 if(!soccer.length)return null;

function simScore(home,away){
 const a=teamPower(home),b=teamPower(away),homeAdv=2.5;
 const x=clamp((a-b+homeAdv)/12,-3,3);

 let ag=clamp(Math.round(1.0-x*.28+(Math.random()*2.4)),0,5);
 if(Math.random()<.08){hg=Math.max(0,hg-1);}return[hg,ag];

function applyResult(home,away,hg,ag){
 const H=S.table[home],A=S.table[away];if(!H||!A)return;
 H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
 if(hg>ag){H.w++;A.l++;H.pts+=3;H.form.unshift('w');A.form.unshift('l');}
 else if(hg<ag){A.w++;H.l++;A.pts+=3;H.form.unshift('l');A.form.unshift('w');}
 else{H.d++;A.d++;H.pts++;A.pts++;H.form.unshift('d');A.form.unshift('d');}
 H.form=H.form.slice(0,5);A.form=A.form.slice(0,5);
}

function updatePlayerSeasonStats(home,away,hg,ag){
 if(home!==S.club&&away!==S.club)return;
 const won=(home===S.club&&hg>ag)||(away===S.club&&ag>hg),lost=(home===S.club&&hg<ag)||(away===S.club&&ag<hg);
 const scored=home===S.club?hg:ag,conceded=home===S.club?ag:hg;
 const ids=new Set((S.lineup||[]).filter(Boolean));
 S.players.forEach(p=>{
   ensurePlayerData(p);const starter=ids.has(p.id);
   if(starter){
     p.apps++;p.seasonStats.presenze++;p.seasonStats.titolarità++;p.seasonStats.minuti+=90;
     p.seasonStats.tiri+=Math.floor(Math.random()*4)+(p.pos==='ATT'?1:0);
     p.seasonStats.intercetti+=['DC','TD','TS','MED'].includes(p.pos)?Math.floor(Math.random()*4):Math.floor(Math.random()*2);
     p.seasonStats.palleRecuperate+=Math.floor(Math.random()*6);
     p.seasonStats.occasioniCreate+=['TQ','CC','AS','AD'].includes(p.pos)?Math.floor(Math.random()*3):0;
     if(p.pos==='ATT'&&Math.random()<scored*.16){p.seasonStats.gol++;p.g++;}
     if(Math.random()<scored*.11){p.seasonStats.assist++;p.a++;}
     if(p.pos==='POR'&&conceded===0)p.seasonStats.cleanSheet++;
     if(Math.random()<.08)p.seasonStats.gialli++;
     const rating=clamp(6.3+(won?.7:lost?-.45:.1)+Math.random()*1.7,5,9.5);
     p.seasonStats.votoMedio=((p.seasonStats.votoMedio*(p.seasonStats.presenze-1))+rating)/p.seasonStats.presenze;
     p.form=clamp(p.form+(rating>=7.5?.18:rating<6.4?-.2:.03),5,9.5);p.formHistory.unshift(p.form);p.formHistory=p.formHistory.slice(0,8);
     p.benchStreak=0;
     if(p.form>=8&&p.ovr<p.pot&&Math.random()<.22)p.ovr++;
     if(p.form<=5.8&&Math.random()<.14)p.ovr=Math.max(45,p.ovr-1);

   }
 });
}

 const roleBonus=role==='titolare'?10:role==='rotazione'?3:-10,ratio=fee/ask;
 const seller=clamp((ratio-0.72)*140+roleBonus+Math.random()*22,0,100),player=clamp(interest+roleBonus+(salary>ask*.02?8:0)+(S.rep>70?5:0),0,100);
 if(S.budget<fee+bonus)return status('💰 Budget insufficiente.');
 if(seller<58){closeModal();return status(`❌ ${transferPool.find(x=>x[0]===name)?.[4]||'Club'} rifiuta: offerta troppo bassa.`);}
 if(player<48){closeModal();return status(`❌ ${name} non è convinto del progetto (${Math.round(player)}% interesse).`);}
 const p=transferPool.find(x=>x[0]===name);S.budget-=fee+bonus;

 closeModal();render();
}
