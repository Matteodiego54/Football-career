 <div class="grid">${Object.keys(pyramid).map(c=>`<button onclick="country('${c}')">🌍 ${c}</button>`).join("")}</div>
 <div id="clubs"></div></div><div id="toast" class="toast"></div>`
}

 const tiers=pyramid[c];

 ${Object.entries(tiers).map(([tier,teams])=>`<div class="card"><h3>▾ ${esc(tier)}</h3><div class="grid">${teams.map(t=>`<div class="card"><b>${esc(t)}</b><br><small class="muted">Rosa reale + stemma caricati online</small><br><button class="primary" onclick="start('${c} — ${tier}','${t}')">Inizia carriera</button></div>`).join("")}</div></div>`).join("")}</div>`
}
function clubs(l){document.getElementById("clubs").innerHTML=`<h2>${esc(l)}</h2><div class="grid">${leagues[l].map(c=>`<div class="card"><b>${esc(c)}</b><p class="muted">Forza ${power[c]||76}</p><button class="primary" onclick="start('${l}','${c}')">Inizia con ${esc(c)}</button></div>`).join("")}</div>`}
function go(t){S.tab=t;render()}
function rank(){return Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts).findIndex(x=>x[0]==S.club)+1}
function home(){return `<div class="screen"><div class="team-title">${badge()}<div><h1 style="margin:0">${esc(S.club)}</h1><span class="muted">${esc(S.league)}</span></div></div><p>Giornata ${S.match+1} · ${S.month==1?"Mercato di gennaio aperto":S.month>=5?"Fine stagione vicina":"Stagione in corso"}</p><div class="stats"><div class="card"><div class="big">${money(S.budget)}</div>Budget</div><div class="card"><div class="big">${S.table[S.club]?.pts||0}</div>Punti</div><div class="card"><div class="big">${rank()}°</div>Posizione</div><div class="card"><div class="big">${S.rep}</div>Reputazione</div></div><br><button class="primary" onclick="match()">⚽ Gioca partita</button><button onclick="simulate()">⏩ Simula 5 partite</button></div><div class="grid"><div class="screen"><h3>Ultimi risultati</h3>${S.results.slice(-6).reverse().map(x=>`<div class="row">${esc(x)}</div>`).join("")||"Nessuna partita."}</div><div class="screen"><h3>News</h3>${S.news.slice(0,8).map(x=>`<div class="row">• ${esc(x)}</div>`).join("")}</div><div class="screen"><h3>Rosa</h3><p>${S.loadingSquad?"⏳ Caricamento rosa reale…":"✅ "+S.players.length+" giocatori"}</p><button onclick="loadRealSquad('${esc(S.club)}')">🔄 Aggiorna rosa reale</button></div></div>`}
function squad(){return `<div class="screen"><h2>👥 Rosa ${S.loadingSquad?"— caricamento…":"("+S.players.length+" giocatori)"}</h2><p class="muted">La lista arriva dalla rosa della squadra presente nella fonte dati online.</p>${S.players.map(p=>`<div class="row"><div class="player-row" onclick="showFullPlayer(${p.id})">${pimg(p)}<span><b>${esc(p.name)}</b><br><small class="muted">${esc(p.pos)} · ${p.age} anni · ${natLabel(p)} · Forma ${p.form.toFixed(1)}</small></span></div><span><b>${p.ovr}</b> <span class="greenText">${p.pot}</span></span></div>`).join("")}</div>`}

function enrichPlayer(p){
  const o=p.ovr||70;
  p.attributes=p.attributes||{
    PAC:Math.max(45,Math.min(98,o+Math.floor(Math.random()*15-7))),
    SHO:Math.max(40,Math.min(98,o+Math.floor(Math.random()*15-7))),
    PAS:Math.max(40,Math.min(98,o+Math.floor(Math.random()*15-7))),
    DRI:Math.max(40,Math.min(98,o+Math.floor(Math.random()*15-7))),
    DEF:Math.max(35,Math.min(98,o+Math.floor(Math.random()*15-7))),
    PHY:Math.max(40,Math.min(98,o+Math.floor(Math.random()*15-7)))
  };
  p.seasonStats=p.seasonStats||{apps:0,starts:0,minutes:0,goals:0,assists:0,cleanSheets:0,yellow:0,red:0,rating:7.0};
  p.transferHistory=p.transferHistory||[];
  return p;
}

async function loadPlayerDetails(id,index){
  try{
    const d=await apiJson(`${API}/lookupplayer.php?id=${encodeURIComponent(id)}`);
    const p=d.players&&d.players[0]; if(!p)return;
    let q=enrichPlayer(S.players[index]);
    q.nationality=p.strNationality||q.nationality;
    q.number=p.strNumber||q.number;
    q.birthPlace=p.strBirthLocation||q.birthPlace;
    q.height=p.strHeight||q.height;
    q.weight=p.strWeight||q.weight;
    q.transferHistory=q.transferHistory||[];
    S.players[index]=q; localStorage.setItem("realRoster_"+S.club,JSON.stringify({badge:S.badge,teamId:S.teamId,players:S.players,updated:Date.now()}));
    showFullPlayer(index);
  }catch(e){showFullPlayer(index)}
}

function showFullPlayer(id){
  let p=enrichPlayer(S.players[id]);
 
  const hist=p.transferHistory.length?p.transferHistory.map(x=>`<div class="row">${esc(x.season||"")} · ${esc(x.from||"Svincolato")} → ${esc(x.to||S.club)} · ${esc(x.fee||"—")}</div>`).join(""):"<p class='muted'>Storico trasferimenti non disponibile nella fonte dati.</p>";
  document.getElementById("modalBody").innerHTML=`
  <div class="player-row">${pimg(p)}<div><h2 style="margin:0">${esc(p.name)}</h2><p>${esc(p.pos)} · ${p.age} anni · OVR <b>${p.ovr}</b></p></div></div>
  <h3>Attributi</h3><div class="stats">${Object.entries(p.attributes).map(([k,v])=>`<div class="card"><div class="big">${v}</div>${k}</div>`).join("")}</div>
  <h3>Stats stagione</h3><div class="stats">${Object.entries(p.seasonStats).map(([k,v])=>`<div class="card"><div class="big">${v}</div>${k}</div>`).join("")}</div>
  <h3>Storico trasferimenti</h3>${hist}<br><button onclick="closeModal()">Chiudi</button>`;
  document.getElementById("modal").style.display="flex";
}

function showPlayer(id){let p=S.players[id];if(!p)return;document.getElementById("modalBody").innerHTML=`<div class="player-row">${pimg(p)}<div><h2 style="margin:0">${esc(p.name)}</h2><p>${p.pos} · ${p.age} anni</p></div></div><div class="stats"><div class="card"><div class="big">${p.ovr}</div>OVERALL</div><div class="card"><div class="big greenText">${p.pot}</div>POTENZIALE</div><div class="card"><div class="big">${p.apps}</div>PRESENZE</div><div class="card"><div class="big">${p.g}</div>GOL</div></div><br><button onclick="closeModal()">Chiudi</button>`;document.getElementById("modal").style.display="flex"}
function tactics(){return `<div class="screen"><h2>🧠 Tattica</h2>${["4-3-3","4-2-3-1","3-5-2","4-4-2"].map(f=>`<button class="${S.formation==f?'primary':''}" onclick="S.formation='${f}';render()">${f}</button>`).join("")}<h3>XI</h3><div class="grid">${S.players.slice(0,11).map((p,i)=>`<div class="card player-row">${pimg(p)}<span>${i+1}. <b>${esc(p.name)}</b><br><span class="muted">${p.pos} · ${p.ovr}</span></span></div>`).join("")}</div></div>`}

function completeYouth(){
 while(S.youth.length<23){
  const i=S.youth.length,n=youthNames[i%youthNames.length],roles=["POR","DC","DC","TD","TS","CC","CC","CC","AD","AS","ATT","ATT"],age=16+(i%3),ovr=52+(i%18);
  S.youth.push(enrichPlayer({id:i,name:`${n[0]} ${n[1]}${i>=youthNames.length?" II":""}`,age,pos:roles[i%roles.length],ovr,pot:Math.min(92,ovr+16),team:age==16?"U17":age==17?"U18":"Primavera",status:"vivaio",nationality:n[2],photo:"",value:apiValue(ovr),apps:0,g:0,a:0,form:7,seasonStats:{apps:0,starts:0,minutes:0,goals:0,assists:0,cleanSheets:0,yellow:0,red:0,rating:7.0},transferHistory:[]}));
 }
}
function youthPage(){completeYouth();S.youth=S.youth.map(enrichPlayer);return `<div class="screen"><h2>🌱 Primavera / U18 / U17 — Rosa completa</h2><p class="muted">Ogni settore giovanile mantiene una rosa completa separata dalla prima squadra.</p>${S.youth.map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br><span class="muted">${p.team} · ${p.pos} · ${p.age} anni · OVR ${p.ovr} · POT ${p.pot}</span></span><span>${p.status=="vivaio"?`<button class="green" onclick="promote(${p.id})">Promuovi</button><button onclick="loan(${p.id})">Prestito</button><button class="gold" onclick="keep(${p.id})">Lascia</button>`:`<span class="pill">${p.status}</span>`}</span></div>`).join("")}</div>`}
function promote(id){let p=S.youth[id];p.status="promosso";S.players.push({id:S.players.length,name:p.name,pos:p.pos,ovr:p.ovr,age:p.age,pot:p.pot,apps:0,g:0,a:0,form:7,value:apiValue(p.ovr),photo:""});S.news.unshift(`${p.name} promosso in prima squadra.`);render()}
function loan(id){S.youth[id].status="prestito";S.news.unshift(`${S.youth[id].name} mandato in prestito.`);render()}
function keep(id){S.news.unshift(`${S.youth[id].name} resta nel vivaio.`);render()}
const marketPool=[["Kenan Yildiz","ATT",82,78000000,"Juventus"],["Nico Paz","CC",79,55000000,"Como"],["Scalvini","DC",82,52000000,"Atalanta"],["Bakayoko","AD",78,42000000,"PSV"],["Nusa","AS",77,35000000,"RB Leipzig"],["Lamine Yamal","AD",89,150000000,"Barcelona"],["Jude Bellingham","CC",91,180000000,"Real Madrid"],["Florian Wirtz","CC",89,130000000,"Bayer Leverkusen"],["Pedri","CC",90,120000000,"Barcelona"],["Bukayo Saka","AD",89,140000000,"Arsenal"]];
function market(){let q=(S.marketSearch||"").toLowerCase(),max=S.marketMax?Number(S.marketMax)*1e6:Infinity,tm=S.marketTeam||"",rl=S.marketRole||"",pool=marketPool.filter(p=>(!q||p[0].toLowerCase().includes(q))&&p[3]<=max&&(!tm||p[4]===tm)&&(!rl||p[1]===rl));return `<div class="screen"><h2>💰 Mercato</h2><p class="muted">Cerca per nome, costo massimo, squadra o ruolo.</p><div class="searchbar"><input placeholder="Nome" value="${esc(S.marketSearch)}" oninput="S.marketSearch=this.value;render()"><input type="number" placeholder="Costo max (€M)" value="${esc(S.marketMax)}" oninput="S.marketMax=this.value;render()"><select onchange="S.marketTeam=this.value;render()"><option value="">Tutte le squadre</option>${[...new Set(marketPool.map(p=>p[4]))].map(t=>`<option ${tm===t?"selected":""}>${esc(t)}</option>`).join("")}</select><select onchange="S.marketRole=this.value;render()"><option value="">Tutti i ruoli</option>${["POR","DC","CC","AD","AS","ATT"].map(r=>`<option ${rl===r?"selected":""}>${r}</option>`).join("")}</select></div><p>Budget: <b class="goldText">${money(S.budget)}</b></p><div class="grid">${pool.map(p=>`<div class="card"><b>${esc(p[0])}</b><p class="muted">${p[1]} · ${esc(p[4])} · OVR ${p[2]}</p><b class="goldText">${money(p[3])}</b><br><button class="primary" onclick="buy(${marketPool.indexOf(p)})">Acquista</button></div>`).join("")||"<p>Nessun giocatore trovato.</p>"}</div></div>`}
function buy(i){if(S.month!=1&&S.month!=7){toast("Mercato chiuso: gennaio e luglio.");return}let p=marketPool[i];if(S.budget<p[3]){toast("Budget insufficiente");return}S.budget-=p[3];S.players.push({id:S.players.length,name:p[0],pos:p[1],ovr:p[2],age:21,pot:p[2]+9,apps:0,g:0,a:0,form:7,value:p[3],photo:""});S.news.unshift(`${p[0]} acquistato.`);toast(`✅ ${p[0]} acquistato!`);render()}
function calendar(){return `<div class="screen"><h2>📅 Calendario</h2>${Array.from({length:38},(_,i)=>`<div class="row"><span>G${i+1} · ${i%2?"✈️":"🏠"} ${esc(leagues[S.league][(i+3)%leagues[S.league].length])}</span><b>${esc(S.results[i]||"—")}</b></div>`).join("")}</div>`}
function table(){let a=Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts);return `<div class="screen"><h2>🏆 ${esc(S.league)}</h2><table style="width:100%"><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>PT</th><th>Europa</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x[0])}</td><td>${x[1].p}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td><b>${x[1].pts}</b></td><td>${i<6?qualificationFor(i+1):"—"}</td></tr>`).join("")}</table></div>`}
function offers(){return `<div class="screen"><h2>📩 Offerte</h2>${S.offers.length?S.offers.map((o,i)=>`<div class="card"><h3>${esc(o.club)}</h3><span class="muted">${esc(o.league)}</span><p>Reputazione richiesta: ${o.req}</p><button class="primary" onclick="accept(${i})">ACCETTA</button><button onclick="S.offers.splice(${i},1);render()">Rifiuta</button></div>`).join(""):`<p>Nessuna offerta disponibile.</p>`}<button onclick="offersNow()">Genera offerte</button></div>`}
function offersNow(){if(S.month!=1&&S.month<5){toast("Le offerte arrivano a gennaio o a fine stagione.");return}let all=[];for(let [l,cs] of Object.entries(leagues))for(let c of cs)if(c!=S.club&&(power[c]||76)<=S.rep+7)all.push([l,c]);if(!all.length){toast("Nessun club interessato.");return}let [l,c]=all[Math.floor(Math.random()*all.length)];S.offers.push({league:l,club:c,req:(power[c]||76)-5});S.tab="offers";render()}
function accept(i){if(S.month!=1&&S.month<5){toast("Puoi cambiare club solo a gennaio o a fine stagione.");return}let o=S.offers[i];start(o.league,o.club);S.news.unshift(`Hai accettato l'offerta del ${o.club}.`)}
function competitions(){ensureCompetitions();const pos=rank(),q=qualificationFor(pos),c=countryOfLeague(),national=(cupByCountry[c]||["Coppa nazionale"])[0];return `<div class="screen"><h2>🏆 Coppe e qualificazioni</h2><div class="stats"><div class="card competition"><div class="big">${pos}°</div>Classifica</div><div class="card competition"><div class="big">${q==="—"?"—":"✓"}</div>${q}</div><div class="card cup"><div class="big">🏆</div>${esc(national)}</div><div class="card competition"><div class="big">🇪🇺</div>Competizioni UEFA</div></div><h3>Qualificazione europea</h3><p>${q==="—"?"Non qualificato al momento.":"Se la stagione finisse oggi: <b>"+q+"</b>"}</p><h3>Coppe</h3>${S.competitions.cups.map(x=>`<div class="row cup"><span><b>${esc(x.name)}</b><br><span class="muted">${esc(x.round||"In corsa")}</span></span><span>${esc(x.status||"In corsa")}<br><small>${esc(x.lastResult||"—")}</small></span></div>`).join("")}</div>`}
function career(){return `<div class="screen"><h2>🧳 Storico carriera</h2>${S.history.map(x=>`<div class="row"><span><b>${esc(x.club)}</b><br><span class="muted">${esc(x.league)}</span></span><b>${esc(x.date)}</b></div>`).join("")}</div>`}
const cupByCountry={"Italia":["Coppa Italia","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Inghilterra":["FA Cup","EFL Cup","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Spagna":["Copa del Rey","Supercopa de España","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Germania":["DFB-Pokal","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Francia":["Coupe de France","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Olanda":["KNVB Beker","UEFA Champions League","UEFA Europa League","UEFA Conference League"],"Portogallo":["Taça de Portugal","UEFA Champions League","UEFA Europa League","UEFA Conference League"]};
function countryOfLeague(){return String(S.league||"").split(" — ")[0]}
function ensureCompetitions(){const c=countryOfLeague();if(!S.competitions)S.competitions={league:{name:S.league,played:0},cups:[]};S.competitions.cups=S.competitions.cups||[];const national=(cupByCountry[c]||["Coppa nazionale"])[0];if(!S.competitions.cups.find(x=>x.name===national))S.competitions.cups.push({name:national,round:"1° turno",status:"in corsa"});}
function qualificationFor(pos){if(pos<=4)return"🏆 Champions League";if(pos===5)return"🟠 Europa League";if(pos===6)return"🟢 Conference League";return"—"}
function updateSeasonCompetitions(){ensureCompetitions();const pos=rank(),q=qualificationFor(pos);S.seasonAwards=[{type:"qualification",text:q,position:pos}];S.news.unshift(q==="—"?`${S.club}: ${pos}° posto, nessuna coppa europea.`:`${S.club}: qualificato alla ${q}!`);}
function showMatchAnimation(title,result,win){
 let m=document.getElementById("matchModal");if(!m){m=document.createElement("div");m.id="matchModal";m.className="modal";document.body.appendChild(m)}
 m.innerHTML=`<div class="result-hero"><div class="muted">${esc(title)}</div><h1 class="${win?'goal':''}">${win?'🎉 VITTORIA':'⚽ FINALE'}</h1><div class="matchbox"><div><b>${esc(S.club)}</b></div><div><strong style="font-size:38px">${esc(result)}</strong></div><div><b>Avversario</b></div></div><p>${win?'Tre punti pesanti! La classifica è stata aggiornata.':'Partita terminata. La classifica è stata aggiornata.'}</p><button class="primary" onclick="this.closest('.modal').style.display='none'">Continua</button></div>`;
 m.style.display="flex";
}
function match(){
 ensureCompetitions();
 const teams=leagues[S.league],opp=teams[(S.match+3)%teams.length],A=power[S.club]||76,B=power[opp]||76;
 const x=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<A/B*.48?1:0)),y=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<B/A*.42?1:0));
 const t=S.table[S.club],o=S.table[opp];t.p++;o.p++;t.gf+=x;t.ga+=y;o.gf+=y;o.ga+=x;
 if(x>y){t.w++;t.pts+=3;o.l++;S.rep++;}else if(x===y){t.d++;t.pts++;o.d++;o.pts++;}else{t.l++;o.w++;o.pts+=3;S.rep=Math.max(1,S.rep-1);}
 // Simula anche le altre partite della giornata: la classifica cambia davvero a ogni giornata.
 const rest=teams.filter(c=>c!==S.club&&c!==opp);for(let i=0;i+1<rest.length;i+=2){const h=rest[i],a=rest[i+1],ha=Math.min(4,Math.floor(Math.random()*3)+(Math.random()<((power[h]||70)/(power[a]||70))*.35?1:0)),hb=Math.min(4,Math.floor(Math.random()*3)+(Math.random()<((power[a]||70)/(power[h]||70))*.35?1:0)),ht=S.table[h],at=S.table[a];ht.p++;at.p++;ht.gf+=ha;ht.ga+=hb;at.gf+=hb;at.ga+=ha;if(ha>hb){ht.w++;ht.pts+=3;at.l++;}else if(ha===hb){ht.d++;ht.pts++;at.d++;at.pts++;}else{ht.l++;at.w++;at.pts+=3;}}
 S.players.slice(0,11).forEach(p=>{p.apps++;p.seasonStats=p.seasonStats||{apps:0,starts:0,minutes:0,goals:0,assists:0,cleanSheets:0,yellow:0,red:0,rating:7};p.seasonStats.apps++;p.seasonStats.starts++;p.seasonStats.minutes+=90;p.seasonStats.goals+=(Math.random()<.1?1:0);p.seasonStats.assists+=(Math.random()<.13?1:0);p.seasonStats.rating=+(6.4+Math.random()*2.1).toFixed(1);p.form=Math.max(5,Math.min(9.5,p.form+(x>y?.2:x<y?-.15:.03)));});
 S.results[S.match]=`${S.club} ${x}-${y} ${opp}`;S.lastMatch={title:S.league,result:S.results[S.match],win:x>y};S.news.unshift(`G${S.match+1}: ${S.results[S.match]}`);S.match++;S.competitions.league.played++;
 showMatchAnimation(S.league,S.results[S.match-1],x>y);
 if(S.match>=38){updateSeasonCompetitions();S.month=7;S.season++;S.match=0;S.players.forEach(p=>{p.age++;p.form=7;p.seasonStats={apps:0,starts:0,minutes:0,goals:0,assists:0,cleanSheets:0,yellow:0,red:0,rating:7}});initTable();S.competitions={league:{name:S.league,played:0},cups:[]};}
 render();
}
function simulate(){
 ensureCompetitions();let played=0;
 for(let i=0;i<5;i++){const teams=leagues[S.league],opp=teams[(S.match+3)%teams.length],A=power[S.club]||76,B=power[opp]||76,x=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<A/B*.48?1:0)),y=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<B/A*.42?1:0)),t=S.table[S.club],o=S.table[opp];t.p++;o.p++;t.gf+=x;t.ga+=y;o.gf+=y;o.ga+=x;if(x>y){t.w++;t.pts+=3;o.l++;}else if(x===y){t.d++;t.pts++;o.d++;o.pts++;}else{t.l++;o.w++;o.pts+=3;}S.results[S.match]=`${S.club} ${x}-${y} ${opp}`;S.match++;S.competitions.league.played++;played++;if(S.match>=38){updateSeasonCompetitions();S.match=0;S.season++;initTable();break;}}
 S.news.unshift(`⏩ Simulazione rapida: ${played} giornate completate. Classifica aggiornata.`);render();toast(`⏩ ${played} giornate simulate`);
}
function closeModal(){document.getElementById("modal").style.display="none"}
const pages={home,competitions,squad,tactics,youth:youthPage,market,calendar,table,offers,career};
render();
</script>
