<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0e12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><title>Football Career</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07090c;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#252c35;color:white;font-weight:800}button:active{transform:scale(.98)}
.app{max-width:760px;margin:auto;padding-bottom:80px}.top{position:sticky;top:0;z-index:5;padding:14px 15px;background:#090b0eea;backdrop-filter:blur(15px);border-bottom:1px solid #252b33}
.brand{font-weight:950}.red{color:#ed2632}.muted{color:#929ca8;font-size:13px}.hero{margin:14px;padding:18px;border:1px solid #33262a;border-radius:18px;background:linear-gradient(135deg,#281317,#131820)}
.panel{margin:12px 14px;background:#12161c;border:1px solid #29313a;border-radius:16px;overflow:hidden}.pad{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.card{background:#1a2028;border:1px solid #303945;border-radius:13px;padding:13px}.big{font-size:24px;font-weight:950}.gold{color:#f1c75b}.green{color:#40d98b}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;justify-content:space-around;background:#0d1116ee;border-top:1px solid #29313a;padding:7px max(7px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}.nav button{background:transparent;padding:7px 8px;font-size:11px}.nav button.active{color:#ed2632}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px;border-bottom:1px solid #252c34}.row:last-child{border-bottom:0}.primary{background:#e32632}.good{background:#14623d}.goldbtn{background:#6d5418}.tabs{display:flex;gap:6px;overflow:auto;padding:10px}.tabs button{white-space:nowrap}.modal{position:fixed;inset:0;z-index:20;background:#000b;display:none;align-items:flex-end}.sheet{width:100%;max-width:760px;margin:auto;background:#11161c;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.close{float:right}.tag{font-size:11px;background:#29313b;padding:4px 7px;border-radius:6px}
</style></head><body><div class="app" id="app"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const L={
"Italia · Serie A":["Milan","Inter","Juventus","Napoli","Roma","Lazio","Atalanta","Fiorentina","Bologna","Torino","Genoa","Sassuolo","Udinese","Parma","Cagliari","Lecce","Como","Cremonese"],
"Inghilterra · Premier League":["Arsenal","Manchester City","Liverpool","Manchester United","Chelsea","Tottenham","Newcastle","Aston Villa","West Ham","Everton","Brighton","Fulham","Brentford","Leeds","Burnley"],
"Spagna · LaLiga":["Real Madrid","Barcelona","Atletico Madrid","Athletic Club","Real Sociedad","Villarreal","Real Betis","Sevilla","Valencia","Girona","Celta Vigo","Getafe","Osasuna","Mallorca"],
"Germania · Bundesliga":["Bayern Munich","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Stuttgart","Frankfurt","Freiburg","Wolfsburg","Mainz","Union Berlin","Hamburg","St Pauli"],
"Francia · Ligue 1":["Paris Saint-Germain","Marseille","Lyon","Monaco","Lille","Nice","Lens","Rennes","Strasbourg","Nantes","Toulouse","Brest","Reims","Saint-Etienne"],
"Olanda · Eredivisie":["Ajax","PSV","Feyenoord","AZ","Twente","Utrecht","Groningen","Heerenveen","Sparta","NEC","Fortuna","Zwolle"],
"Portogallo · Primeira Liga":["Benfica","Porto","Sporting CP","Braga","Vitoria","Boavista","Famalicao","Rio Ave","Gil Vicente","Estoril"]
};
const P={"Milan":84,"Inter":85,"Juventus":82,"Napoli":83,"Arsenal":87,"Manchester City":92,"Liverpool":89,"Manchester United":82,"Chelsea":84,"Real Madrid":92,"Barcelona":89,"Atletico Madrid":87,"Bayern Munich":91,"Borussia Dortmund":85,"Bayer Leverkusen":86,"Paris Saint-Germain":91,"Ajax":82,"PSV":83,"Feyenoord":81,"Benfica":84,"Porto":84,"Sporting CP":84};
const famous={
"Milan":[["Maignan","POR",87,31,88],["Tomori","DC",82,28,83],["Pavlovic","DC",80,25,85],["Fofana","CC",82,27,84],["Modric","CC",90,40,90],["Ricci","CC",79,25,85],["Pulisic","AD",86,27,89],["Leao","AS",88,27,93],["Gimenez","ATT",84,25,90]],
"Real Madrid":[["Courtois","POR",89,34,89],["Rudiger","DC",86,33,86],["Valverde","CC",89,28,92],["Bellingham","CC",91,23,96],["Vinicius","AS",91,26,95],["Mbappe","ATT",92,27,96]],
"Manchester City":[["Ederson","POR",86,33,86],["Dias","DC",88,29,90],["Rodri","CC",90,30,92],["Bernardo","CC",87,32,87],["Haaland","ATT",91,26,96],["Foden","AD",88,26,94]],
"Barcelona":[["Ter Stegen","POR",87,34,87],["Araujo","DC",86,27,91],["Pedri","CC",90,23,95],["De Jong","CC",87,29,89],["Yamal","AD",89,19,97],["Lewandowski","ATT",88,38,88]],
"Bayern Munich":[["Neuer","POR",86,40,86],["Kimmich","CC",88,31,89],["Musiala","TQ",90,23,96],["Kane","ATT",90,33,91],["Olise","AD",86,24,94]]
};
let s=JSON.parse(localStorage.getItem("fc-ios")||"null");
function save(){localStorage.setItem("fc-ios",JSON.stringify(s))}
function teams(){return L[s.league]||[]}
function roster(c){let a=famous[c]||[],p=P[c]||76;if(!a.length)a=[["Portiere","POR",p-2,28,p+2],["Difensore","DC",p-3,26,p+3],["Centrocampista","CC",p-2,25,p+4],["Attaccante","ATT",p,27,p+5],["Talento","CC",p-8,20,p+10]];return a.map((x,i)=>({id:i,name:x[0],pos:x[1],ovr:x[2],age:x[3],pot:x[4],apps:0,g:0,form:7}))}
function newCareer(l,c){s={league:l,club:c,season:2026,match:0,month:8,rep:P[c]||76,budget:(P[c]||76)*1800000,players:roster(c),youth:[["Talento U17",16,55,81,"U17"],["Promessa U18",17,61,86,"U18"],["Stella Primavera",18,67,90,"Primavera"],["Difensore U17",16,54,79,"U17"]].map((x,i)=>({id:i,name:x[0],age:x[1],ovr:x[2],pot:x[3],team:x[4],status:"vivaio"})),table:{},results:[],offers:[],history:[{club:c,league:l,date:"Agosto 2026"}],news:[`Sei il nuovo allenatore di ${c}.`],tab:"home"};makeTable();save();render()}
function makeTable(){s.table={};teams().forEach(t=>s.table[t]={p:0,w:0,d:0,l:0,pts:0,gf:0,ga:0})}
function money(x){return "€"+(x/1e6).toFixed(1)+"M"}
function rank(){return Object.entries(s.table).sort((a,b)=>b[1].pts-a[1].pts).findIndex(x=>x[0]===s.club)+1}
function start(){document.getElementById("app").innerHTML=`<div class="hero"><h1>⚽ Football Career</h1><p class="muted">Una carriera da allenatore pensata per iPhone. Scegli club, vinci trofei e puoi trasferirti a gennaio o a fine stagione.</p></div><div class="panel pad"><h2>Campionato</h2><div class="grid">${Object.keys(L).map(l=>`<button onclick="clubs('${l}')">${l}</button>`).join("")}</div><div id="clubs"></div></div>`}
function clubs(l){document.getElementById("clubs").innerHTML=`<h2>${l}</h2><div class="grid">${L[l].map(c=>`<div class="card"><b>${c}</b><p class="muted">Forza ${P[c]||76}</p><button class="primary" onclick="newCareer('${l}','${c}')">Inizia</button></div>`).join("")}</div>`}
function nav(){return `<div class="nav">${[["home","⌂"],["squad","👥"],["tactics","🧠"],["youth","🌱"],["market","💰"],["career","🧳"]].map(x=>`<button class="${s.tab==x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[0]}</button>`).join("")}</div>`}
function shell(content){document.getElementById("app").innerHTML=`<div class="top"><b><span class="red">⚽</span> FOOTBALL CAREER</b><span class="muted">${s.club} · ${s.season}</span></div>${content}${nav()}`}
function go(t){s.tab=t;render()}
function home(){return `<div class="hero"><h1>${s.club}</h1><p>${s.league} · Giornata ${s.match+1}</p><div class="stats grid"><div class="card"><div class="big">${money(s.budget)}</div><span class="muted">Budget</span></div><div class="card"><div class="big">${s.table[s.club].pts}</div><span class="muted">Punti</span></div><div class="card"><div class="big">${rank()}°</div><span class="muted">Posizione</span></div><div class="card"><div class="big">${s.rep}</div><span class="muted">Reputazione</span></div></div><br><button class="primary" onclick="play()">⚽ GIOCA PARTITA</button><button onclick="sim()">⏩ 5 PARTITE</button></div><div class="panel"><div class="row"><b>Ultimi risultati</b><button onclick="go('calendar')">Calendario</button></div>${s.results.slice(-6).reverse().map(x=>`<div class="row">${x}</div>`).join("")||`<div class="pad muted">Nessuna partita ancora.</div>`}</div><div class="panel"><div class="row"><b>News</b></div>${s.news.slice(0,5).map(x=>`<div class="row">• ${x}</div>`).join("")}</div>`}
function squad(){return `<div class="panel"><div class="pad"><h2>👥 Rosa</h2></div>${s.players.map(p=>`<div class="row" onclick="player(${p.id})"><span><b>${p.name}</b><br><span class="muted">${p.pos} · ${p.age} anni · Forma ${p.form.toFixed(1)}</span></span><b>${p.ovr} <span class="green">${p.pot}</span></b></div>`).join("")}</div>`}
function player(id){let p=s.players[id];openM(`<button class="close" onclick="closeM()">Chiudi</button><h2>${p.name}</h2><p>${p.pos} · ${p.age} anni</p><div class="grid"><div class="card"><div class="big">${p.ovr}</div>OVERALL</div><div class="card"><div class="big green">${p.pot}</div>POTENZIALE</div><div class="card"><div class="big">${p.apps}</div>PRESENZE</div><div class="card"><div class="big">${p.g}</div>GOL</div></div>`)}
function tactics(){return `<div class="panel pad"><h2>🧠 Tattica</h2>${["4-3-3","4-2-3-1","3-5-2","4-4-2"].map(f=>`<button onclick="s.formation='${f}';save();render()">${f}</button>`).join("")}<p>Modulo attuale: <b>${s.formation||"4-3-3"}</b></p></div>`}
function youth(){return `<div class="panel"><div class="pad"><h2>🌱 Primavera / U18 / U17</h2></div>${s.youth.map(p=>`<div class="row"><span><b>${p.name}</b><br><span class="muted">${p.team} · ${p.age} anni · OVR ${p.ovr} · POT ${p.pot}</span></span>${p.status=="vivaio"?`<span><button class="good" onclick="promote(${p.id})">Promuovi</button><button onclick="loan(${p.id})">Prestito</button></span>`:`<span class="tag">${p.status}</span>`}</div>`).join("")}</div>`}
function promote(id){let p=s.youth[id];p.status="promosso";s.players.push({id:s.players.length,name:p.name,pos:"CC",ovr:p.ovr,pot:p.pot,age:p.age,apps:0,g:0,form:7});s.news.unshift(`${p.name} promosso in prima squadra.`);save();render()}
function loan(id){s.youth[id].status="prestito";s.news.unshift(`${s.youth[id].name} mandato in prestito.`);save();render()}
function market(){let pool=[["Yildiz","ATT",82,78],["Nico Paz","CC",79,55],["Scalvini","DC",82,52],["Bakayoko","AD",78,42]];return `<div class="panel pad"><h2>💰 Mercato</h2><p class="muted">Aperto a gennaio e luglio. Budget <b class="gold">${money(s.budget)}</b></p><div class="grid">${pool.map((p,i)=>`<div class="card"><b>${p[0]}</b><p>OVR ${p[2]}</p><b class="gold">€${p[3]}M</b><br><button class="primary" onclick="buy(${i})">Acquista</button></div>`).join("")}</div></div>`}
function buy(i){if(s.month!=1&&s.month!=7)return alert("Mercato chiuso.");let p=[["Yildiz","ATT",82,78],["Nico Paz","CC",79,55],["Scalvini","DC",82,52],["Bakayoko","AD",78,42]][i],cost=p[3]*1e6;if(s.budget<cost)return alert("Budget insufficiente");s.budget-=cost;s.players.push({id:s.players.length,name:p[0],pos:p[1],ovr:p[2],pot:p[2]+9,age:21,apps:0,g:0,form:7});s.news.unshift(`${p[0]} acquistato.`);save();render()}
function calendar(){return `<div class="panel"><div class="pad"><h2>📅 Calendario</h2></div>${Array.from({length:38},(_,i)=>`<div class="row"><span>G${i+1} · ${i%2?"✈️":"🏠"} ${teams()[(i+2)%teams().length]}</span><b>${s.results[i]||"—"}</b></div>`).join("")}</div>`}
function career(){let offers=s.offers.map((o,i)=>`<div class="card"><b>${o.club}</b><p class="muted">${o.league}</p><button class="primary" onclick="accept(${i})">ACCETTA</button></div>`).join("");return `<div class="panel pad"><h2>🧳 Carriera allenatore</h2><p>Puoi cambiare club <b>a gennaio</b> o <b>a fine stagione</b>.</p>${offers||"<p class='muted'>Nessuna offerta. Gioca e aumenta la reputazione.</p>"}<button onclick="findOffers()">Cerca offerte</button></div><div class="panel">${s.history.map(x=>`<div class="row"><b>${x.club}</b><span class="muted">${x.date} · ${x.league}</span></div>`).join("")}</div>`}
function play(){let opp=teams()[(s.match+2)%teams().length],a=P[s.club]||76,b=P[opp]||76,g=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<a/b*.5?1:0)),h=Math.min(5,Math.floor(Math.random()*3)+(Math.random()<b/a*.45?1:0)),t=s.table[s.club],o=s.table[opp];t.p++;o.p++;t.gf+=g;t.ga+=h;o.gf+=h;o.ga+=g;if(g>h){t.w++;t.pts+=3;o.l++;s.rep++}else if(g==h){t.d++;t.pts++;o.d++;o.pts++}else{t.l++;o.w++;o.pts+=3;s.rep=Math.max(1,s.rep-1)}s.players.slice(0,11).forEach(p=>{p.apps++;p.form=Math.max(5,Math.min(9.5,p.form+(g>h?.2:g<h?-.15:.02)));if(p.ovr<p.pot&&p.form>8&&Math.random()<.2)p.ovr++;if(g&&Math.random()<.1)p.g++});s.results[s.match]=`${s.club} ${g}-${h} ${opp}`;s.news.unshift(s.results[s.match]);s.match++;if(s.match==19){s.month=1;if(s.rep>=65)findOffers()}if(s.match>=38){s.month=7;s.season++;s.match=0;s.players.forEach(p=>{p.age++;if(p.ovr<p.pot&&Math.random()<.7)p.ovr++});makeTable();if(s.rep>=65)findOffers()}save();render()}
function sim(){for(let i=0;i<5;i++)play()}
function findOffers(){if(s.month!=1&&s.month<5)return alert("Le offerte importanti arrivano a gennaio o verso fine stagione.");let a=[];for(let l in L)for(let c of L[l])if(c!=s.club&&(P[c]||76)<=s.rep+8)a.push({league:l,club:c});a.sort(()=>Math.random()-.5);s.offers=a.slice(0,3);save();render()}
function accept(i){if(s.month!=1&&s.month<5)return alert("Puoi cambiare club a gennaio o a fine stagione.");let o=s.offers[i];s.club=o.club;s.league=o.league;s.players=roster(s.club);s.budget=(P[s.club]||76)*1800000;s.history.push({club:s.club,league:s.league,date:s.month==1?`Gennaio ${s.season}`:`Luglio ${s.season}`});s.offers=[];makeTable();s.news.unshift(`Nuovo incarico: ${s.club}.`);save();render()}
function openM(x){sheet.innerHTML=x;modal.style.display="flex"}function closeM(){modal.style.display="none"}
function render(){if(!s){start();return}let f={home,squad,tactics,youth,market,calendar,career}[s.tab||"home"];shell(f())}
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
