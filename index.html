 H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
 if(hg>ag){H.w++;A.l++;H.pts+=3;H.form.unshift('w');A.form.unshift('l');}
 else if(hg<ag){A.w++;H.l++;A.pts+=3;H.form.unshift('l');A.form.unshift('w');}
 else{H.d++;A.d++;H.pts++;A.pts++;H.form.unshift('d');A.form.unshift('d');}
 H.form=H.form.slice(0,5);A.form=A.form.slice(0,5);
}
function eventActors(scoredTeam,scoring=true){
 const pool=S.players.filter(p=>p.status!=='loaned'&&p.team===S.club);
 return pool[Math.floor(Math.random()*Math.max(1,pool.length))];
}
function liveEvents(home,away,hg,ag){
 const e=[];
 for(let i=0;i<hg;i++){const p=home===S.club?eventActors(home):null;e.push({m:8+i*18+Math.floor(Math.random()*10),type:'goal',txt:`⚽ ${home}${p?' · '+p.name:''}`});}
 for(let i=0;i<ag;i++){const p=away===S.club?eventActors(away):null;e.push({m:14+i*17+Math.floor(Math.random()*11),type:'goal',txt:`⚽ ${away}${p?' · '+p.name:''}`});}
 if(Math.random()<.62)e.push({m:Math.floor(15+Math.random()*65),type:'card',txt:'🟨 Ammonizione'});
 if(Math.random()<.18)e.push({m:Math.floor(55+Math.random()*25),type:'card',txt:'🟥 Espulsione'});
 if(Math.random()<.48)e.push({m:Math.floor(50+Math.random()*35),type:'change',txt:'🔄 Sostituzione'});
 e.push({m:90,type:'minute',txt:`⏱️ Finale: ${home} ${hg}-${ag} ${away}`});return e.sort((a,b)=>a.m-b.m);
}
function makeMatchSubstitutions(home,away,hg,ag){
 if(home!==S.club&&away!==S.club)return [];
 const ids=new Set((S.lineup||[]).filter(Boolean));let bench=(S.bench||[]).map(id=>S.players.find(p=>String(p.id)===String(id))).filter(Boolean);
 const starters=S.players.filter(p=>ids.has(p.id));const candidates=starters.filter(p=>p.fatigue>=55||p.form<6.3||Math.random()<.22).sort((a,b)=>(b.fatigue-a.fatigue)+(6.5-a.form)-(6.5-b.form));
 const changes=[];const max=Math.min(5,bench.length,candidates.length);
 for(let i=0;i<max;i++){if(Math.random()>.52&&i>0)continue;const out=candidates[i], compatible=bench.filter(p=>!changes.some(c=>c.inId===p.id)&&([p.pos,out.pos].includes(p.pos)||p.pos===out.pos||Math.abs(p.ovr-out.ovr)<=8));const inn=(compatible[0]||bench.find(p=>!changes.some(c=>c.inId===p.id)));if(!inn)continue;changes.push({outId:out.id,inId:inn.id,out:out.name,inn:inn.name,minute:55+i*7});out.fatigue=clamp(out.fatigue-12,0,100);inn.fatigue=clamp(inn.fatigue+10,0,100);inn.apps++;inn.seasonStats.presenze++;inn.seasonStats.minuti+=Math.max(18,90-changes[changes.length-1].minute);inn.seasonStats.tiri+=Math.floor(Math.random()*3);if(Math.random()<.08)inn.seasonStats.assist++;}
 S.matchSubs=changes;return changes;
}
function updatePlayerSeasonStats(home,away,hg,ag){
 if(home!==S.club&&away!==S.club)return;
 const won=(home===S.club&&hg>ag)||(away===S.club&&ag>hg),lost=(home===S.club&&hg<ag)||(away===S.club&&ag<hg);
 const scored=home===S.club?hg:ag,conceded=home===S.club?ag:hg;const ids=new Set((S.lineup||[]).filter(Boolean));
 S.players.forEach(p=>{ensurePlayerData(p);const starter=ids.has(p.id)&&(!p.injury||p.injury.days<=0)&&p.suspension<=0;if(starter){p.apps++;p.seasonStats.presenze++;p.seasonStats.titolarità++;p.seasonStats.minuti+=90;p.seasonStats.tiri+=Math.floor(Math.random()*5)+(p.pos==='ATT'?1:0);p.seasonStats.intercetti+=['DC','TD','TS','MED'].includes(p.pos)?Math.floor(Math.random()*4):Math.floor(Math.random()*2);p.seasonStats.palleRecuperate+=Math.floor(Math.random()*7);p.seasonStats.occasioniCreate+=['TQ','CC','AS','AD'].includes(p.pos)?Math.floor(Math.random()*3):0;if((p.pos==='ATT'||p.pos==='AS'||p.pos==='AD')&&Math.random()<scored*.14){p.seasonStats.gol++;p.g++;}if(Math.random()<scored*.10){p.seasonStats.assist++;p.a++;}if(p.pos==='POR'&&conceded===0)p.seasonStats.cleanSheet++;if(Math.random()<.075){p.seasonStats.gialli++;if(p.seasonStats.gialli%5===0)p.suspension=1;}const rating=clamp(6.15+(won?.85:lost?-.5:.08)+Math.random()*1.8+(p.form-7)*.12,5,9.7);p.seasonStats.votoMedio=((p.seasonStats.votoMedio*(p.seasonStats.presenze-1))+rating)/p.seasonStats.presenze;p.form=clamp(p.form+(rating>=7.5?.22:rating<6.4?-.24:.03),5,9.5);p.formHistory.unshift(p.form);p.formHistory=p.formHistory.slice(0,8);p.benchStreak=0;p.morale=clamp(p.morale+(won?1.5:lost?-1.5:.2),20,95);if(p.form>=8&&p.ovr<p.pot&&Math.random()<.22)p.ovr++;if(p.form<=5.8&&Math.random()<.14)p.ovr=Math.max(45,p.ovr-1);}else if(p.status==='prima squadra'){p.benchStreak++;p.fatigue=clamp(p.fatigue-7,0,100);p.form=clamp(p.form-(p.benchStreak>=5?.05:.01),5,9.5);p.morale=clamp(p.morale-(p.benchStreak>=5?.7:.15),20,95);if(p.benchStreak>=5&&p.form<6.4&&Math.random()<.3)p.ovr=Math.max(45,p.ovr-1);}});
}
function playMatchday(){
 if(S.simBusy)return;const fixtures=S.schedule[S.match]||[];if(!fixtures.length){finishSeason();return;}
 S.simBusy=true;
 const scores=fixtures.map(g=>{const sc=simScore(g.home,g.away);return {...g,score:sc};});
 const mine=scores.find(g=>g.home===S.club||g.away===S.club)||scores[0];
 const subs=makeMatchSubstitutions(mine.home,mine.away,mine.score[0],mine.score[1]);
  const events=liveEvents(mine.home,mine.away,mine.score[0],mine.score[1]);
  subs.forEach(x=>events.push({m:x.minute,type:'change',txt:`🔄 ${x.out} → ${x.inn}`}));events.sort((a,b)=>a.m-b.m);
 scores.forEach(g=>applyResult(g.home,g.away,g.score[0],g.score[1]));
 updatePlayerSeasonStats(mine.home,mine.away,mine.score[0],mine.score[1]);
 processMatchFitness(); updateMorale(); financialMatchResult(mine.home,mine.away,mine.score[0],mine.score[1]);
 const injuries=maybeInjuries(); if(injuries.length)S.news.unshift('🏥 Infermeria: '+injuries.join(' · ')); boardUpdate();
 const mineStats={shots:5+Math.floor(Math.random()*12),shotsOnTarget:2+Math.floor(Math.random()*6),possession:clamp(45+Math.round((teamPower(S.club)-teamPower(mine.home===S.club?mine.away:mine.home))*1.2)+Math.floor(Math.random()*12-6),28,72),corners:Math.floor(Math.random()*8)};
 S.lastMatch={...mine,events,subs,stats:mineStats,mvp:(S.players.find(p=>p.id===S.lineup[Math.floor(Math.random()*S.lineup.length)])||S.players[0])?.name||'—'};
 S.results[S.match]=`${mine.home} ${mine.score[0]}-${mine.score[1]} ${mine.away}`;
 S.news.unshift(`📺 Giornata ${S.match+1}: ${S.results[S.match]} · MVP ${S.lastMatch.mvp}`);
 S.social.unshift(`📱 @MatchdayLive: ${S.results[S.match]} — MVP ${S.lastMatch.mvp}`);
 S.match++;if(S.match===Math.floor((S.schedule.length||38)/2))S.month=1;
 openMatchCenter(mine,events,scores,mineStats,S.lastMatch.mvp);
}

function simulate(){
 if(S.simBusy)return;let n=Math.min(5,(S.schedule.length||0)-S.match);if(n<=0)return finishSeason();
 let i=0;const next=()=>{if(i++>=n)return;playMatchday();setTimeout(()=>{closeMatchCenter();S.simBusy=false;render();next();},1000)};next();
}
function calcEurope(pos){
 if(['Italia','Inghilterra','Spagna','Germania','Francia'].includes(S.country)){if(pos<=4)return'🌟 Champions League';if(pos<=6)return'🟠 Europa League';if(pos===7)return'🟢 Conference League';}
 if(['Olanda','Portogallo','Belgio','Turchia','Scozia'].includes(S.country)){if(pos<=3)return'🌟 Champions League';if(pos<=5)return'🟠 Europa League';if(pos===6)return'🟢 Conference League';}return'';
}
function promoteAcademy(){
 const messages=[];
 S.youth.forEach(p=>{
   if(p.status==='promosso'||p.status==='loaned')return;
   const old=p.academyTier||'U15';
   const idx=ACADEMY_TIERS.indexOf(old);
   if(idx<0)return;
   const targetAge=15+idx+1;
   if(p.age>=targetAge){
     if(idx<ACADEMY_TIERS.length-1){p.academyTier=ACADEMY_TIERS[idx+1];messages.push(`🌱 ${p.name}: ${old} → ${p.academyTier}`);}
     else if(p.age>=19&&p.ovr>=62&&p.pot>=p.ovr+2){p.status='proponi';messages.push(`⭐ ${p.name} è pronto per la Primavera/prima squadra.`);}
   }
 });
 return messages;
}
function finishSeason(){
 const pos=rank();S.month=7;S.europe=calcEurope(pos);
 if(pos===1){S.news.unshift(`🏆 ${S.club} è campione di ${S.division}.`);S.social.unshift(`👑 @LeagueOfficial: ${S.club} campione!`);}
 else S.news.unshift(`📋 Fine stagione: ${pos}° posto. ${S.europe||'Nessuna coppa europea.'}`);
 const academyNews=promoteAcademy();S.news.unshift(...academyNews.slice(0,5));
 S.history.unshift({club:S.club,league:S.league,date:`Fine stagione ${S.season} · ${pos}°`,points:S.table[S.club]?.pts||0});
 S.season++;S.match=0;S.month=7;
 S.players.forEach(p=>{p.age++;p.form=clamp(p.form,5,9.5);p.fatigue=clamp(p.fatigue-35,0,100);p.suspension=0;if(p.injury?.days<=0)p.injury=null;if(p.contractEnd?.startsWith(String(S.season-1)))p.contractEnd=`${S.season}-06-30`;p.benchStreak=0;}); S.board=S.board||{target:4,confidence:68}; S.board.confidence=clamp(S.board.confidence+(pos<=S.board.target?8:-8),0,100);
 S.youth.forEach(p=>{p.age++;const delta=p.form>=7.5?1:p.form<6?-1:0;p.ovr=clamp(p.ovr+delta,p.ovr-3,p.pot);if(p.form<6.2&&Math.random()<.25)p.pot=Math.max(p.ovr,p.pot-1);if(p.form>8&&Math.random()<.3)p.pot=clamp(p.pot+1,p.ovr,94);});
 initTable();S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);S.tacticalSelected=null;S.simBusy=false;render();
}

function submitNegotiation(name,ask,interest){
 const fee=Number(document.getElementById('negFee')?.value)||0,bonus=Number(document.getElementById('negBonus')?.value)||0,salary=Number(document.getElementById('negSalary')?.value)||0,clause=Number(document.getElementById('negClause')?.value)||0,role=document.getElementById('negRole')?.value||'rotazione';
 const roleBonus=role==='titolare'?10:role==='rotazione'?3:-10,ratio=fee/ask;
 const seller=clamp((ratio-0.72)*140+roleBonus+Math.random()*22,0,100),player=clamp(interest+roleBonus+(salary>ask*.02?8:0)+(S.rep>70?5:0),0,100);
 if(S.budget<fee+bonus)return status('💰 Budget insufficiente.');
 if(seller<58){closeModal();return status(`❌ ${transferPool.find(x=>x[0]===name)?.[4]||'Club'} rifiuta: offerta troppo bassa.`);}
 if(player<48){closeModal();return status(`❌ ${name} non è convinto del progetto (${Math.round(player)}% interesse).`);}
 const p=transferPool.find(x=>x[0]===name);S.budget-=fee+bonus;
 const np=ensurePlayerData({id:'tr'+Date.now(),name:p[0],pos:p[1],ovr:p[2],pot:clamp(p[2]+8,p[2],94),age:20,team:S.club,value:fee,salary,releaseClause:clause,contractEnd:`${S.season+(role==='titolare'?3:2)}-06-30`,status:'prima squadra'});
 S.players.push(np);S.news.unshift(`🚨 AFFARE: ${name} arriva da ${p[4]} per ${money(fee)} + ${money(bonus)} bonus.`);S.social.unshift(`🔴 @TransferAlert: ${name} ➡️ ${S.club}.`);
 closeModal();showTransferCelebration(np,p[4],fee,bonus);
}

let ONLINE={peer:null,conn:null,role:null,code:'',guestName:'',hostName:'',connected:false,chat:[],ready:false,opponentReady:false,matchStarting:false,lastRoom:null,opponentSnapshot:null,competitionMode:localStorage.getItem('fcm_online_mode')||'',league:null,viewActive:false,localClub:'',localCountry:'',localDivision:'',localFormation:'4-3-3',localPlayers:[],roomReady:false};
function makeFourLetterCode(){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];return c;}
function friendCode(){let c=String(localStorage.getItem('fcm_friend_code')||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(c.length!==4){c=makeFourLetterCode();localStorage.setItem('fcm_friend_code',c)}return c;}
function onlineSnapshot(){
 const ids=new Set((S.lineup||[]).filter(Boolean));
 const xi=(S.players||[]).filter(p=>ids.has(p.id)).map(p=>({id:p.id,name:p.name,ovr:Number(p.ovr)||60,pos:p.pos,form:Number(p.form)||7,fatigue:Number(p.fatigue)||0}));
 return {club:S.club||'Club',league:S.league||'',formation:S.formation||'4-3-3',tactics:S.tactics||{},xi,bench:(S.bench||[]).map(id=>(S.players||[]).find(p=>p.id===id)).filter(Boolean).slice(0,9).map(p=>({name:p.name,ovr:Number(p.ovr)||60,pos:p.pos})),rep:Number(S.rep)||60};
}
function onlinePower(s){if(!s||!s.xi?.length)return 60;let a=s.xi.reduce((x,p)=>x+(p.ovr||60),0)/s.xi.length;let f=s.xi.reduce((x,p)=>x+(p.form||7),0)/s.xi.length;let fat=s.xi.reduce((x,p)=>x+(p.fatigue||0),0)/s.xi.length;let tac=(s.tactics?.tempo||60)*.035+(s.tactics?.press||60)*.025+(s.tactics?.defLine||55)*.015;return a+(f-7)*2.4-fat*.06+tac;}
function onlineRandom(){const a=new Uint32Array(2);crypto.getRandomValues(a);return (a[0]/4294967296+a[1]/4294967296)/2;}
function onlinePoisson(lambda){let L=Math.exp(-lambda),k=0,pr=1;while(pr>L&&k<8){k++;pr*=Math.max(.000001,onlineRandom())}return k-1;}
function onlineMakeResult(home,away){
 const hp=onlinePower(home),ap=onlinePower(away),diff=hp-ap;
 let hx=.88+diff*.045+(onlineRandom()-.5)*.55, ax=.78-diff*.038+(onlineRandom()-.5)*.45;
 const chaos=onlineRandom(); if(chaos>.84){hx*=1.28;ax*=1.18}else if(chaos<.12){hx*=.58;ax*=.62}
 let hg=onlinePoisson(clamp(hx,.15,3.9)),ag=onlinePoisson(clamp(ax,.12,3.7));
 if(hg===ag&&onlineRandom()<.13){if(onlineRandom()<.5)hg++;else ag++;}
 const onlineKey=(home.club||'HOME')+'|'+(away.club||'AWAY');
 ONLINE._lastScores=ONLINE._lastScores||{};
 if(ONLINE._lastScores[onlineKey]===hg+'-'+ag){
   const alts=[[0,1],[1,0],[1,1],[2,0],[0,2],[2,1],[1,2],[2,2],[3,1],[1,3]];
   const alt=alts[Math.floor(onlineRandom()*alts.length)]; hg=alt[0];ag=alt[1];
 }
 ONLINE._lastScores[onlineKey]=hg+'-'+ag;
 const events=[];for(let i=0;i<hg;i++)events.push({m:Math.floor(5+onlineRandom()*82),type:'goal',txt:`⚽ ${home.club}`});for(let i=0;i<ag;i++)events.push({m:Math.floor(5+onlineRandom()*82),type:'goal',txt:`⚽ ${away.club}`});
 const cards=Math.floor(1+onlineRandom()*5);for(let i=0;i<cards;i++)events.push({m:Math.floor(15+onlineRandom()*72),type:'card',txt:'🟨 Ammonizione'});if(onlineRandom()<.13)events.push({m:Math.floor(35+onlineRandom()*45),type:'card',txt:'🟥 Espulsione'});
 events.sort((a,b)=>a.m-b.m);events.push({m:90,type:'final',txt:`⏱️ FINALE ${home.club} ${hg}-${ag} ${away.club}`});return {hg,ag,events,home,away,ts:Date.now(),seed:Math.floor(onlineRandom()*1e9)};
}
function onlineSetStatus(text,live=false){const el=document.getElementById('onlineStatusText'),dot=document.getElementById('onlineDot');if(el)el.textContent=text;if(dot)dot.classList.toggle('live',!!live);}
function onlineReset(){const mode=ONLINE.competitionMode||localStorage.getItem('fcm_online_mode')||'duel';try{ONLINE.conn?.close();ONLINE.peer?.destroy()}catch(e){}ONLINE={peer:null,conn:null,role:null,code:'',guestName:'',hostName:'',connected:false,chat:[],ready:false,opponentReady:false,lastRoom:null,opponentSnapshot:null,competitionMode:mode,league:mode==='league'?{round:0,rounds:6,hostPts:0,guestPts:0,hostWins:0,guestWins:0,hostGoals:0,guestGoals:0,hostTrophies:0,guestTrophies:0}:null,viewActive:true,localClub:'',localCountry:'',localDivision:'',localFormation:'4-3-3',localPlayers:[],roomReady:false};onlinePreLobby();}
function onlineHost(){
 if(!window.Peer){status('🌐 Connessione online non disponibile. Controlla Internet.');return;}
 try{ONLINE.conn?.close();ONLINE.peer?.destroy()}catch(e){}
 ONLINE.role='host';ONLINE.viewActive=true;ONLINE.ready=false;ONLINE.opponentReady=false;ONLINE.matchStarting=false;
 ONLINE.hostName=ONLINE.localClub||S.club||'Allenatore';
 const raw=makeFourLetterCode(); ONLINE.code=raw;
 onlineSetStatus('Creazione stanza…',false); render();
 try{
   ONLINE.peer=new Peer('fcm-'+raw,{debug:0});
   ONLINE.peer.on('open',()=>{ONLINE.roomReady=true;onlineSetStatus('STANZA ONLINE — codice pronto',true);render();});
   ONLINE.peer.on('connection',c=>{
     if(ONLINE.conn&&ONLINE.connected){c.close();return;}
     ONLINE.conn=c; onlineWire(c);
   });
   ONLINE.peer.on('disconnected',()=>{ONLINE.roomReady=false;onlineSetStatus('Connessione al server persa…',false);try{ONLINE.peer.reconnect()}catch(e){}});
   ONLINE.peer.on('error',e=>{ONLINE.roomReady=false;onlineSetStatus('Errore stanza',false);status('❌ '+(e.message||e.type||'Errore PeerJS'));});
 }catch(e){status('❌ Impossibile creare la stanza: '+e.message)}
}
function onlineJoin(){
 const input=document.getElementById('onlineJoinCode'),code=(input?.value||'').trim().toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
 if(code.length!==4)return status('Il codice della stanza deve essere formato da esattamente 4 lettere.');
 if(!window.Peer)return status('🌐 Connessione online non disponibile.');
 try{ONLINE.conn?.close();ONLINE.peer?.destroy()}catch(e){}
 ONLINE.role='guest';ONLINE.viewActive=true;ONLINE.code=code;ONLINE.ready=false;ONLINE.opponentReady=false;ONLINE.connected=false;ONLINE.roomReady=false;
 ONLINE.guestName=ONLINE.localClub||S.club||'Allenatore'; onlineSetStatus('Connessione alla stanza…',false);render();
 try{
   ONLINE.peer=new Peer(undefined,{debug:0});
   ONLINE.peer.on('open',()=>{
     const c=ONLINE.peer.connect('fcm-'+code,{reliable:true,serialization:'json'}); ONLINE.conn=c; onlineWire(c);
     setTimeout(()=>{if(!ONLINE.connected)status('⏳ La stanza non risponde. Controlla il codice e che l’amico abbia lasciato aperta la lobby.');},9000);
   });
   ONLINE.peer.on('error',e=>{onlineSetStatus('Impossibile entrare nella stanza',false);status('❌ Codice non valido, stanza chiusa o connessione non disponibile.');});
 }catch(e){status('❌ Impossibile entrare: '+e.message)}
}
function onlineWire(c){
 c.on('open',()=>{
   ONLINE.connected=true; ONLINE.roomReady=true; onlineSetStatus('CONNESSO — lobby attiva',true);
   onlineSend({type:'HELLO',from:ONLINE.localClub||S.club||'Allenatore',snapshot:onlineSnapshot(),friendCode:friendCode(),competitionMode:ONLINE.competitionMode});
   onlineSend({type:'TEAM',snapshot:onlineSnapshot()}); render();
 });
 c.on('data',msg=>onlineReceive(msg));
 c.on('close',()=>{ONLINE.connected=false;ONLINE.conn=null;ONLINE.opponentReady=false;onlineSetStatus('Amico disconnesso',false);render();});
 c.on('error',()=>{ONLINE.connected=false;onlineSetStatus('Errore collegamento',false);render();});
}
function onlineSend(msg){try{if(ONLINE.conn&&ONLINE.conn.open)ONLINE.conn.send(msg)}catch(e){}}
function onlineMaybeStart(){
 if(ONLINE.role!=='host'||!ONLINE.connected||!ONLINE.ready||!ONLINE.opponentReady||ONLINE.matchStarting)return;
 if(!ONLINE.opponentSnapshot)return;
 ONLINE.matchStarting=true;
 onlineSetStatus('⚡ ENTRAMBI PRONTI — KICK-OFF IN 3…',true);
 render();
 let n=3;
 const timer=setInterval(()=>{
   n--;
   if(n>0){ onlineSetStatus('⚡ KICK-OFF IN '+n+'…',true); render(); return; }
   clearInterval(timer);
   if(!ONLINE.connected||!ONLINE.ready||!ONLINE.opponentReady){ONLINE.matchStarting=false;render();return;}
   onlineChallenge();
 },700);
}
function onlineToggleReady(){
 if(!ONLINE.connected)return status('Connettiti prima al tuo amico.');
 ONLINE.ready=!ONLINE.ready;
 onlineSend({type:'READY',ready:ONLINE.ready,snapshot:onlineSnapshot(),competitionMode:ONLINE.competitionMode});
 onlineSend({type:'TEAM',snapshot:onlineSnapshot()});
 if(ONLINE.ready)onlineSetStatus('Sei PRONTO — in attesa dell’amico…',true); else onlineSetStatus('Hai annullato il PRONTO',true);
 render(); onlineMaybeStart();
}
function onlineReceive(msg){
 if(!msg)return;
 if(msg.type==='HELLO'){
   ONLINE.guestName=msg.from||ONLINE.guestName;ONLINE.opponentSnapshot=msg.snapshot||ONLINE.opponentSnapshot;ONLINE.competitionMode=msg.competitionMode||ONLINE.competitionMode;
   onlineSend({type:'WELCOME',from:ONLINE.localClub||S.club||'Allenatore',snapshot:onlineSnapshot(),friendCode:friendCode(),competitionMode:ONLINE.competitionMode});
   onlineSend({type:'TEAM',snapshot:onlineSnapshot()}); render(); return;
 }
 if(msg.type==='WELCOME'){
   ONLINE.hostName=msg.from||ONLINE.hostName;ONLINE.opponentSnapshot=msg.snapshot||ONLINE.opponentSnapshot;ONLINE.competitionMode=msg.competitionMode||ONLINE.competitionMode;render();return;
 }
 if(msg.type==='TEAM'){ONLINE.opponentSnapshot=msg.snapshot||ONLINE.opponentSnapshot;render();return;}
 if(msg.type==='READY'){
   ONLINE.opponentReady=!!msg.ready; ONLINE.opponentSnapshot=msg.snapshot||ONLINE.opponentSnapshot; ONLINE.competitionMode=msg.competitionMode||ONLINE.competitionMode;
   render();
   if(ONLINE.role==='host') onlineMaybeStart();
   return;
 }
 if(msg.type==='START'){
   ONLINE.matchStarting=false; ONLINE.opponentSnapshot=msg.host||ONLINE.opponentSnapshot; onlineApplyCompetitionResult(msg.result); onlineAnimateOnlineMatch(msg.result,true); render(); return;
 }

<script>
/* V13 — THE BIG STEP: career realism engine. Deliberately does NOT modify

(function(){
  const OLD_HOME=window.home, OLD_CAL=window.calendar, OLD_FINISH=window.finishSeason, OLD_NORMALIZE=window.normalizeState;
  function r(a,b){return a+Math.random()*(b-a)}
  function rr(a,b){return Math.floor(r(a,b+1))}
  function realismInit(){
    S.realism={
      morale: S.realism?.morale ?? 68,
      dressingRoom: S.realism?.dressingRoom ?? 72,
      tacticalFamiliarity: S.realism?.tacticalFamiliarity ?? 70,
      boardPressure: S.realism?.boardPressure ?? 20,
      mediaPressure: S.realism?.mediaPressure ?? 15,
      injuries: S.realism?.injuries ?? 0,
      momentum: S.realism?.momentum ?? 0,
      cupProgress: S.realism?.cupProgress ?? '—',
      cleanSheets: S.realism?.cleanSheets ?? 0,
      xgFor: S.realism?.xgFor ?? 0,
      xgAgainst: S.realism?.xgAgainst ?? 0,
      shotsFor: S.realism?.shotsFor ?? 0,
      shotsAgainst: S.realism?.shotsAgainst ?? 0,
      lastPress: S.realism?.lastPress ?? 'La squadra prepara la prossima gara.'
    };
  }
  function teamRealismPower(team){
    let base=teamPower(team);
    if(team!==S.club)return base+r(-2.5,2.5);
    const ls=lineupStrength();
    const fatigue=(S.players||[]).filter(p=>(S.lineup||[]).includes(p.id)).reduce((a,p)=>a+(p.fatigue||0),0)/Math.max(1,(S.lineup||[]).length);
    const form=(S.players||[]).filter(p=>(S.lineup||[]).includes(p.id)).reduce((a,p)=>a+(p.form||7),0)/Math.max(1,(S.lineup||[]).length);
    const tac=tacticalModifier();
    return base+(ls-75)*.65+(form-7)*2.3+tac-(fatigue*.075)+(S.realism.morale-60)*.07+(S.realism.momentum*.5);
  }
  function realisticScore(home,away){
    const hp=teamRealismPower(home)+(home===S.club?4.0:2.2), ap=teamRealismPower(away)+(away===S.club?3.4:0);
    const diff=(hp-ap);
    const upset=(Math.random()-.5)*14, formSwing=(Math.random()-.5)*8;
    const tempoHome=home===S.club?(S.tactics.tempo-55)*.012:0;
    const tempoAway=away===S.club?(S.tactics.tempo-55)*.012:0;
    let hx=1.28+(diff+upset+formSwing)*.032+tempoHome-tempoAway;
    let ax=1.12-(diff+upset+formSwing)*.027+tempoAway*.7+((Math.random()-.5)*.12);
    const chaos=Math.random();
    if(chaos>.82){hx*=1.28;ax*=1.24;}
    else if(chaos<.10){hx*=.72;ax*=.70;}
    hx=clamp(hx,.22,4.2); ax=clamp(ax,.18,3.9);
    const poisson=lambda=>{const L=Math.exp(-lambda);let k=0,p=1;while(p>L&&k<9){k++;p*=Math.random()}return Math.max(0,k-1)};
    let hg=poisson(hx),ag=poisson(ax);
    // Wider, football-like score distribution: 0-0 through 4-3 are all genuinely possible.
    if(Math.random()<.035){ if(Math.random()<.5)hg+=2; else ag+=2; }
    if(Math.random()<.018){ hg=Math.min(6,hg+3); }
    if(Math.random()<.018){ ag=Math.min(6,ag+3); }
    hg=Math.min(6,hg);ag=Math.min(6,ag);
    const key=home+'|'+away;
    if(!S._lastScoreByFixture)S._lastScoreByFixture={};
    const previous=S._lastScoreByFixture[key];
    if(previous===hg+'-'+ag){
      const alternatives=[[0,0],[0,1],[1,0],[1,1],[2,0],[0,2],[2,1],[1,2],[2,2],[3,0],[0,3],[3,1],[1,3],[3,2],[2,3],[4,1],[1,4],[4,2],[2,4],[3,3],[4,3],[3,4]];
      const viable=alternatives.filter(x=>x[0]+'-'+x[1]!==previous);
      const alt=viable[Math.floor(Math.random()*viable.length)];hg=alt[0];ag=alt[1];
    }
    S._lastScoreByFixture[key]=hg+'-'+ag;
    return [hg,ag];
  }
  function playerMatchRatings(hg,ag,home,away){
    if(home!==S.club&&away!==S.club)return;
    const won=(home===S.club&&hg>ag)||(away===S.club&&ag>hg), draw=hg===ag;

      const tactical=(S.tactics.press>80&&['POR','DC'].includes(p.pos))?.08:0;
      let rating=6.45+(won?.85:draw?.18:-.55)+r(-.65,.85)+((p.form||7)-7)*.18+tactical-(p.fatigue||0)*.012;
      rating=clamp(rating,4.8,9.6);

  function realisticEvents(home,away,hg,ag){

  function matchStats(home,away,hg,ag){

  const oldSave=window.save, oldLoad=window.load;

 function careerDate(){return S.currentDate?parseDate(S.currentDate):new Date(S.season,7,1)}
 function setDate(d){S.currentDate=iso(d);S.dayCount=(S.dayCount||0)+1}
 function marketOpen(d){const m=d.getMonth()+1;return (m===8&&d.getDate()<=31)||(m===1&&d.getDate()<=31)}
 function roundDate(r){let start=new Date(S.season,7,22);return new Date(start.getTime()+r*7*86400000)}
 function ensureDates(){if(!S.currentDate)S.currentDate=iso(new Date(S.season,7,1));if(!S.dayCount)S.dayCount=0;if(!S.trainingHistory)S.trainingHistory=[];if(!S.dailyLog)S.dailyLog=[];if(!S.scouting)S.scouting={reports:[],assignments:[]};if(!S.staff)S.staff={physio:1,coach:1,scout:1,analyst:1};if(!S.objectives)S.objectives={target:S.board?.target||4,bonus:0};
  if(S.schedule?.length){S.schedule.forEach((round,r)=>round.forEach(g=>{if(!g.date)g.date=iso(roundDate(r));}))}
 }
 function toast(t){let e=document.getElementById('v33toast');if(!e){e=document.createElement('div');e.id='v33toast';e.className='v33Toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(window.v33tt);window.v33tt=setTimeout(()=>e.classList.remove('show'),2600)}
 function dailyTraining(){ensureDates();const t=V.training||'balanced';const cfg={balanced:[1.2,.3,-.8],attack:[1.7,.1,-1.5],defense:[1.5,.1,-1.2],physical:[.5,.8,-2.8],recovery:[-.3,.2,3.8],tactical:[1.8,.9,-1.0]}[t]||[1.2,.3,-.8];S.players.forEach(p=>{if(p.status==='loaned')return;ensurePlayerData(p);p.fatigue=clamp(p.fatigue+cfg[2],0,100);p.form=clamp(p.form+cfg[0]*.018,5,9.5);if(t==='physical'&&Math.random()<.018+(p.fatigue>75?.02:0)){p.injury=p.injury||{days:2+Math.floor(Math.random()*6),reason:'sovraccarico in allenamento'};S.news.unshift('🏥 '+p.name+' si ferma in allenamento.')}});S.trainingHistory.unshift({date:S.currentDate,type:t});S.trainingHistory=S.trainingHistory.slice(0,60)}
 function dailyRecovery(){S.players.forEach(p=>{if(p.status==='loaned')return;ensurePlayerData(p);if(p.injury?.days>0){p.injury.days--;if(p.injury.days===0){p.injury=null;S.news.unshift('✅ '+p.name+' è tornato disponibile.')}}else p.fatigue=clamp(p.fatigue-5,0,100);if(p.suspension>0)p.suspension--;});}
 function contractWatch(){S.players.forEach(p=>{if(!p.contractEnd)return;const end=parseDate(p.contractEnd),now=careerDate(),days=Math.ceil((end-now)/86400000);if(days===120||days===60||days===30){S.news.unshift('📜 '+p.name+' entra negli ultimi '+days+' giorni di contratto.');if(days<=60&&p.morale<55&&Math.random()<.35)S.news.unshift('🗣️ '+p.name+' valuta il proprio futuro.')}})}
 function marketPulse(){const open=marketOpen(careerDate());S.marketWindow=open;if(!open)return;const r=Math.random();if(r<.055&&transferPool?.length){const p=transferPool[Math.floor(Math.random()*transferPool.length)];S.news.unshift('🔎 Mercato: '+p[4]+' valuta movimenti per '+p[0]+'.');S.social.unshift('📱 @TransferWatch: '+p[0]+' è entrato nei radar di diversi club.')}else if(r<.095){const c=clubs().filter(x=>x!==S.club)[Math.floor(Math.random()*Math.max(1,clubs().length-1))];if(c)S.news.unshift('💼 '+c+' ha aperto un dossier mercato.')}}
 function youthDay(){if(!S.youth?.length)return;S.youth.forEach(p=>{if(Math.random()<.035){p.form=clamp(p.form+(Math.random()>.45?.1:-.08),5,9.5);if(p.form>8&&Math.random()<.12)p.ovr=clamp(p.ovr+1,p.ovr,p.pot)}});if(Math.random()<.025){const p=S.youth[Math.floor(Math.random()*S.youth.length)];if(p)S.news.unshift('🌱 Report vivaio: '+p.name+' sta attirando l’attenzione dello staff.')}}
 function scoutDay(){if(!S.scouting)return;if(Math.random()<.025&&transferPool?.length){const p=transferPool[Math.floor(Math.random()*transferPool.length)];S.scouting.reports.unshift({date:S.currentDate,name:p[0],pos:p[1],ovr:p[2],value:p[3],club:p[4],confidence:55+Math.floor(Math.random()*40)});S.scouting.reports=S.scouting.reports.slice(0,20);S.news.unshift('🔭 Scout: nuovo report su '+p[0]+'.')}}
 function worldNews(){if(Math.random()<.035){const texts=['un club annuncia il nuovo allenatore','un talento rinnova il contratto','un big è finito sul mercato','una sorpresa scuote la classifica','un giovane debutta tra i professionisti'];const t=texts[Math.floor(Math.random()*texts.length)];S.news.unshift('🌍 Mondo calcio: '+t+'.')}}
 function myMatchOnDate(date){return (S.schedule||[]).findIndex(round=>round.some(g=>g.date===iso(date)&&(g.home===S.club||g.away===S.club))) }
 function silentMatch(roundIndex){const fixtures=S.schedule[roundIndex]||[];if(!fixtures.length)return null;const scores=fixtures.map(g=>{const sc=simScore(g.home,g.away);return {...g,score:sc}});const mine=scores.find(g=>g.home===S.club||g.away===S.club);scores.forEach(g=>applyResult(g.home,g.away,g.score[0],g.score[1]));if(mine){updatePlayerSeasonStats(mine.home,mine.away,mine.score[0],mine.score[1]);processMatchFitness();updateMorale();financialMatchResult(mine.home,mine.away,mine.score[0],mine.score[1]);const inj=maybeInjuries();if(inj.length)S.news.unshift('🏥 '+inj.join(' · '));S.results[roundIndex]=mine.home+' '+mine.score[0]+'-'+mine.score[1]+' '+mine.away;S.social.unshift('📱 @MatchdayLive: '+S.results[roundIndex]);S.news.unshift('📺 G'+(roundIndex+1)+' · '+S.results[roundIndex]);}else{scores.forEach(()=>{});}S.match=Math.max(S.match,roundIndex+1);boardUpdate();return {roundIndex,scores,mine}}
 function dayStep(){ensureDates();const before=careerDate();dailyRecovery();dailyTraining();contractWatch();marketPulse();youthDay();scoutDay();worldNews();const ri=myMatchOnDate(before);let match=null;if(ri>=0&&ri>=S.match)match=silentMatch(ri);const next=new Date(before.getTime()+86400000);setDate(next);if(next.getDate()===1)S.month=next.getMonth()+1;S.news=S.news.slice(0,120);S.social=S.social.slice(0,120);return match}
 function advanceDays(n,renderAfter=true){ensureDates();n=Math.max(1,Math.min(370,Number(n)||1));for(let i=0;i<n;i++)dayStep();if(renderAfter)render();toast('⏩ '+n+' giorni simulati · '+fmt(careerDate()));}
 function advanceUntil(){const a=document.getElementById('v33from')?.value||S.currentDate;const b=document.getElementById('v33to')?.value||a;let from=parseDate(a),to=parseDate(b);if(to<from)return status('⚠️ La data finale deve essere successiva.');S.currentDate=iso(from);let guard=0;while(careerDate()<to&&guard++<370)dayStep();render();toast('🏁 Simulazione completata fino al '+fmt(careerDate()));}
 function setTraining(t){V.training=t;toast('🧠 Allenamento impostato: '+t);render()}
 function simulateNextMatch(){ensureDates();const idx=(S.schedule||[]).findIndex((round,i)=>i>=S.match&&round.some(g=>g.home===S.club||g.away===S.club));if(idx<0)return finishSeason();const g=S.schedule[idx].find(x=>x.home===S.club||x.away===S.club);let target=parseDate(g.date||iso(roundDate(idx)));while(careerDate()<target)dayStep();const result=dayStep();render();if(result?.mine)openMatchCenter(result.mine,result.scores?.flatMap(x=>liveEvents(x.home,x.away,x.score[0],x.score[1]))||[],result.scores||[],{shots:0,shotsOnTarget:0,possession:50,corners:0},'—')}
 function calendarV33(){ensureDates();const now=careerDate();const rows=(S.schedule||[]).map((round,r)=>{const g=round.find(x=>x.home===S.club||x.away===S.club);if(!g)return '';const d=parseDate(g.date||iso(roundDate(r)));const done=!!S.results[r];const past=d<now&&!done;return '<div class="v33Day '+(done?'done ':'')+(d.getTime()===d0(now).getTime()?'today ':'')+'match"><div class="v33Date">'+fmt(d)+'</div><div><b>G'+(r+1)+' · '+(g.home===S.club?'🏠':'✈️')+'</b><div>'+esc(g.home)+' — '+esc(g.away)+'</div><div class="v33Event">'+(done?esc(S.results[r]):(past?'⚠️ Da recuperare':'⏳ In programma'))+'</div></div><div><button onclick="v33JumpTo('+r+')">'+(done?'📺':'▶️')+'</button></div></div>'}).join('');return '<div class="v33Calendar"><div><div class="screen hero"><div class="eyebrow">CAREER TIMELINE · V33</div><h2>📅 Centro del Tempo</h2><div class="v33HeroStats"><div class="card"><b>'+fmt(now)+'</b><span class="muted">Data carriera</span></div><div class="card"><b>G'+Math.min(S.match+1,(S.schedule?.length||1))+'</b><span class="muted">Prossima giornata</span></div><div class="card"><b>'+(S.marketWindow?'APERTO':'CHIUSO')+'</b><span class="muted">Mercato</span></div><div class="card"><b>'+Math.round(S.budget/1000)+'k</b><span class="muted">Budget</span></div><div class="card"><b>'+Math.round(S.board?.confidence||0)+'%</b><span class="muted">Fiducia</span></div></div></div><div class="screen v33Timeline">'+rows+'</div></div><div class="v33Controls"><div class="screen"><h3>⏩ Avanzamento</h3><button class="primary v33Action v33Pulse" onclick="v33Advance(1)">▶️ Avanza 1 giorno</button><div class="grid2"><button class="v33Action" onclick="v33Advance(7)">+7 giorni</button><button class="v33Action" onclick="v33Advance(30)">+30 giorni</button></div><button class="gold v33Action" onclick="v33NextMatch()">⚽ Vai alla prossima partita</button><hr><h3>🗓️ Simula intervallo</h3><div class="v33Range"><label class="small">Da<input id="v33from" type="date" value="'+S.currentDate+'"></label><label class="small">A<input id="v33to" type="date" value="'+S.currentDate+'"></label></div><button class="blue v33Action" onclick="v33AdvanceRange()">⏩ SIMULA FINO ALLA DATA</button></div><div class="screen"><h3>🧠 Allenamento del giorno</h3><div class="v33DayActions">'+[['balanced','⚖️ Equilibrato'],['tactical','🎯 Tattico'],['attack','⚔️ Attacco'],['defense','🛡️ Difesa'],['physical','💪 Fisico'],['recovery','🧘 Recupero']].map(x=>'<button onclick="v33Training(&quot;'+x[0]+'&quot;)" class="'+(V.training===x[0]?'primary':'')+'">'+x[1]+'</button>').join('')+'</div><p class="muted">Il carico scelto viene applicato ogni giorno durante la simulazione.</p></div><div class="screen"><h3>🔭 Scouting</h3><p class="muted">Lo staff continua a lavorare mentre il tempo passa.</p>'+((S.scouting?.reports||[]).slice(0,4).map(x=>'<div class="row"><span>🔎 '+esc(x.name)+' · '+x.pos+'</span><b>OVR '+x.ovr+'</b></div>').join('')||'<p class="muted">Nessun nuovo report.</p>')+'</div></div></div>'}
 function v33JumpTo(r){ensureDates();const g=S.schedule[r]?.find(x=>x.home===S.club||x.away===S.club);if(!g)return;const target=parseDate(g.date||iso(roundDate(r)));if(target<careerDate())return toast('Quella giornata è già passata.');while(careerDate()<target)dayStep();render();toast('📍 Arrivato al '+fmt(target));}
 window.v33Advance=advanceDays;window.v33AdvanceRange=advanceUntil;window.v33Training=setTraining;window.v33NextMatch=simulateNextMatch;window.v33JumpTo=v33JumpTo;
 const oldStart=start;window.start=function(...args){oldStart(...args);setTimeout(()=>{ensureDates();render()},30)};
 const oldNormalize=normalizeState;window.normalizeState=function(){const x=oldNormalize();ensureDates();return x};
 window.calendar=calendarV33; if(window.pages)window.pages.calendar=calendarV33;
 const oldSave=save;window.save=function(){ensureDates();oldSave()};

 // Extend career page with the management layer without replacing its existing history.
 const oldCareer=career;window.career=function(){ensureDates();return oldCareer()+'<div class="grid2"><div class="screen"><h2>🧩 Staff & struttura</h2><div class="row"><span>🏋️ Preparatore fisico</span><b>Lv '+(S.staff?.physio||1)+'</b></div><div class="row"><span>🧠 Allenatore tattico</span><b>Lv '+(S.staff?.coach||1)+'</b></div><div class="row"><span>🔭 Scout</span><b>Lv '+(S.staff?.scout||1)+'</b></div><div class="row"><span>📊 Analista</span><b>Lv '+(S.staff?.analyst||1)+'</b></div></div><div class="screen"><h2>🎯 Obiettivi dirigenza</h2><p>Obiettivo campionato: <b>'+((S.objectives?.target)||S.board?.target||4)+'° posto</b></p><div class="v33Meter"><i style="width:'+clamp(S.board?.confidence||0,0,100)+'%"></i></div><p class="muted">Fiducia: '+Math.round(S.board?.confidence||0)+'%</p><div class="row"><span>Entrate stagione</span><b>'+money(S.finance?.income||0)+'</b></div><div class="row"><span>Uscite stagione</span><b>'+money(S.finance?.expenses||0)+'</b></div></div></div><div class="screen"><h2>🗞️ Diario manageriale</h2><div class="v33NewsFeed">'+(S.dailyLog||[]).slice(0,30).map(x=>'<div class="newsItem">'+esc(x)+'</div>').join('')+'</div></div>'}
 // Add daily log capture around dayStep.
 const rawDayStep=dayStep; window.__v33RawDayStep=rawDayStep;
 // raw function is closure-local; wrap exported operations through a small log helper instead.
 const oldAdvance=window.v33Advance; window.v33Advance=function(n){const before=careerDate();advanceDays(n,false);S.dailyLog=S.dailyLog||[];S.dailyLog.unshift(fmt(before)+' → '+fmt(careerDate())+' · '+n+' giorni simulati');S.dailyLog=S.dailyLog.slice(0,60);render();toast('⏩ '+n+' giorni simulati')};
 const oldRange=window.v33AdvanceRange; window.v33AdvanceRange=function(){const before=careerDate();advanceUntil();S.dailyLog=S.dailyLog||[];S.dailyLog.unshift('Simulazione intervallo completata: '+fmt(before)+' → '+fmt(careerDate()));S.dailyLog=S.dailyLog.slice(0,60)};
 const oldNext=window.v33NextMatch; window.v33NextMatch=function(){oldNext()};
 ensureDates();
})();

<script id="v36-realism-data-simulation">
(function(){
  const API='https://www.thesportsdb.com/api/v1/json/123/';
  function v36status(t){try{status(t,3500)}catch(e){}}
  async function v36fetch(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
  function v36norm(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
  async function v36Team(club){
    const aliases=(window.teamAliases&&teamAliases[club])||[club];
    for(const q of aliases){try{const j=await v36fetch('searchteams.php?t='+encodeURIComponent(q));const ts=(j.teams||[]).filter(x=>!x.strSport||x.strSport==='Soccer');if(ts.length){const t=ts.sort((a,b)=>v36norm(a.strTeam)===v36norm(club)?-1:1)[0];return t;}}catch(e){}}
    return null;
  }
  function v36mapPos(pos){return typeof posMap==='function'?posMap(pos):'CC'}
  function v36player(x,club,i){const pos=v36mapPos(x.strPosition||x.strPosition2);let age=ageFromDate(x.dateBorn);if(!Number.isFinite(age))age=25;const ovr=baseOvr(pos,i,S.division,club);return ensurePlayerData({id:x.idPlayer||('api_'+i),apiId:x.idPlayer,name:x.strPlayer||x.strPlayerAlternate||'Giocatore',pos,ovr,pot:clamp(ovr+Math.max(2,Math.floor((29-age)/3)),ovr,94),age,team:club,nationality:x.strNationality||'',height:x.strHeight||'',weight:x.strWeight||'',thumb:x.strThumb||'',cutout:x.strCutout||'',value:Math.max(1000000,ovr*ovr*10000),dataFallback:false,_gameGeneratedOvr:true});}
  async function v36LoadRoster(club){
    const t=await v36Team(club);if(!t?.idTeam)throw Error('Club non trovato');
    const j=await v36fetch('lookup_all_players.php?id='+encodeURIComponent(t.idTeam));
    const raw=(j.player||[]).filter(x=>(!x.strSport||x.strSport==='Soccer')&&!isStaffEntry(x));
    if(raw.length<11)throw Error('Rosa live incompleta');
    let list=raw.map((x,i)=>v36player(x,club,i));
    list=normalizeRosterLevel(list,club,S.division||divisionForClub(club));
    rosterCache[club]=list;teamCache[club]={id:t.idTeam,name:t.strTeam,badge:t.strBadge||t.strTeamBadge||'',country:t.strCountry||'',league:t.strLeague||''};
    try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));localStorage.setItem('fcm_team_cache_v11',JSON.stringify(teamCache));}catch(e){}
    return list;
  }
  async function v36SyncCurrentClub(){
    if(!S?.started||!S.club)return;
    v36status('🔄 Verifica rosa reale di '+S.club+'…');
    try{
      const list=await v36LoadRoster(S.club);
      S.players=list.map(ensurePlayerData);S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);initContracts(S.players);
      S.news.unshift('✅ Rosa verificata: ogni giocatore appartiene al club selezionato.');S.social.unshift('📱 @DataCheck: rosa ufficiale sincronizzata per '+S.club+'.');render();
    }catch(e){v36status('⚠️ Dati live non disponibili: uso la rosa salvata senza mischiare club.');}
  }
  /* Never trust a stale mixed cache: force a live roster whenever a career starts. */
  const oldStart=window.start;
  window.start=function(...args){oldStart.apply(this,args);setTimeout(v36SyncCurrentClub,80)};
  /* Rehydrate missing photos without blocking the roster. */
  window.v36RefreshPhotos=async function(){if(!S?.players?.length)return;let changed=false;for(const p of S.players){if(!p.thumb&&!p.cutout){const before=p.thumb+p.cutout;await hydratePlayerMedia(p);changed ||= before!==(p.thumb+p.cutout);}}if(changed){rosterCache[S.club]=S.players;try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache))}catch(e){}render();}};
  /* Full career timeline: one day = training, recovery, market, scouting, contracts, news, then fixtures. */
  window.v36AdvanceDay=function(){if(typeof dayStep==='function'){dayStep();render();toast('📅 +1 giorno · '+fmt(careerDate()));}};
  window.v36AdvanceWeek=function(){if(typeof advanceDays==='function'){advanceDays(7,true);}};
  window.v36AdvanceMonth=function(){if(typeof advanceDays==='function'){advanceDays(30,true);}};
  window.v36AdvanceTo=function(){const a=document.getElementById('v36to')?.value;if(!a)return;const target=parseDate(a);let guard=0;while(careerDate()<target&&guard++<370){dayStep();}render();toast('🏁 Arrivato al '+fmt(careerDate()));};
  /* Add a persistent quick-control strip to the calendar page, preserving the existing V33 simulator. */
  const oldCalendar=window.calendarV33;
  if(oldCalendar){window.calendarV33=function(){let html=oldCalendar();const controls=`<div class="screen v36TimelineControls"><div class="sectionTitle"><div><div class="eyebrow">V36 · DAILY CAREER ENGINE</div><h3>⏱️ Controllo del tempo</h3><p class="muted">Ogni giorno applica allenamento, recupero, mercato, scouting, contratti e, se previsto, la partita.</p></div></div><button class="primary" onclick="v36AdvanceDay()">▶️ +1 giorno</button><button onclick="v36AdvanceWeek()">+7 giorni</button><button onclick="v36AdvanceMonth()">+30 giorni</button><label class="small">Simula fino a <input id="v36to" type="date" value="${S.currentDate||''}"></label><button class="blue" onclick="v36AdvanceTo()">⏩ SIMULA FINO ALLA DATA</button></div>`;return html.replace('</div></div>',controls+'</div></div>');};}
  setTimeout(()=>{try{if(S?.started)v36SyncCurrentClub();}catch(e){}},300);
})();
</script>

<script id="v37-match-simulation">
(function(){
  // V37: richer score model + animated career timeline.
  function v37Clamp(n,a,b){return Math.max(a,Math.min(b,n));}
  function v37Poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;while(p>L&&k<10){k++;p*=Math.random();}return Math.max(0,k-1);}
  function v37Score(home,away){
    const hp=typeof teamRealismPower==='function'?teamRealismPower(home):teamPower(home);
    const ap=typeof teamRealismPower==='function'?teamRealismPower(away):teamPower(away);
    const diff=(hp-ap);
    const homeAdv=home===S.club?3.8:2.6;
    const awayBoost=away===S.club?2.4:0;
    const noise=(Math.random()-0.5)*10;
    let xh=1.38 + diff*.025 + homeAdv*.035 + noise*.035;
    let xa=1.18 - diff*.021 + awayBoost*.025 - noise*.025;
    if(home===S.club) xh += ((S.tactics?.tempo||55)-55)*.009;
    if(away===S.club) xa += ((S.tactics?.tempo||55)-55)*.006;
    const chaos=Math.random();
    if(chaos>.90){xh*=1.38;xa*=1.30;} else if(chaos<.07){xh*=.68;xa*=.66;}
    xh=v37Clamp(xh,.28,4.8); xa=v37Clamp(xa,.22,4.5);
    let hg=v37Poisson(xh),ag=v37Poisson(xa);
    if(Math.random()<.035){if(Math.random()<.5)hg+=2;else ag+=2;}
    if(Math.random()<.012)hg+=3;
    if(Math.random()<.012)ag+=3;
    return [Math.min(7,hg),Math.min(7,ag)];
  }
  window.v37Score=v37Score;
  // Replace the score generator used by the daily engine through a global shim where possible.
  window.simScore=function(home,away){return v37Score(home,away);};

  function v37DayLabel(d){return typeof fmt==='function'?fmt(d):d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});}
  function v37Overlay(){
    let x=document.getElementById('v37SimOverlay');

  async function api39(path){const r=await fetch(API39+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
  function teamMatch39(teams,club){const t=norm39(club);return (teams||[]).filter(x=>!x.strSport||x.strSport==='Soccer').sort((a,b)=>{const A=norm39(a.strTeam),B=norm39(b.strTeam);const score=n=>n===t?100:(n.includes(t)||t.includes(n)?70:0);return score(B)-score(A)})[0]||null;}

    let team=null;

    for(const q of aliases){try{const j=await api39('searchteams.php?t='+encodeURIComponent(q));team=teamMatch39(j.teams,club);if(team)break;}catch(e){}}

    }).filter(Boolean);

    list.forEach(p=>p.team=club);
    rosterCache[club]=list;teamCache[club]={id:team.idTeam,name:team.strTeam,badge:team.strBadge||team.strTeamBadge||'',country:team.strCountry||'',league:team.strLeague||''};
    try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));localStorage.setItem('fcm_team_cache_v11',JSON.stringify(teamCache));}catch(e){}
    return list;
  }
  window.v39RefreshAuthoritativeRoster=async function(){
    if(!S?.started||!S.club)return;
    try{
      status('🔐 Verifica ufficiale rosa di '+S.club+'…');
      const list=await authoritativeRoster39(S.club);
      S.players=list;S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);initContracts(S.players);
      // hydrate missing face photos in small batches so the UI stays responsive
      for(let i=0;i<S.players.length;i+=4){
        await Promise.all(S.players.slice(i,i+4).map(async p=>{if(!p.cutout&&!p.thumb)try{await hydratePlayerMedia(p)}catch(e){}}));
        if(typeof render==='function')render();
      }
      try{rosterCache[S.club]=S.players;localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));}catch(e){}
      S.news.unshift('🔐 Rosa verificata live: '+S.players.length+' giocatori del '+S.club+'.');
      S.social.unshift('📸 @SquadCheck: foto e giocatori sincronizzati con il club.');
      render();status('✅ Rosa ufficiale verificata · '+S.players.length+' giocatori');
    }catch(e){
      // Never mix clubs as an offline fallback. Keep only players explicitly tagged to this club.
      const clean=(S.players||[]).filter(p=>p.team===S.club);
      S.players=clean;S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);
      render();status('⚠️ Rosa live non disponibile: nessun giocatore di un altro club verrà mischiato.');
    }
  };
  const oldStart39=window.start;
  window.start=async function(...args){
    // wipe stale mixed roster immediately; then load the selected club authoritatively
    const club=args[2];
    if(club){S.players=[];try{delete rosterCache[club]}catch(e){}}
    const r=oldStart39.apply(this,args);
    setTimeout(()=>window.v39RefreshAuthoritativeRoster(),120);
    return r;
  };
  // Force the squad button to use authoritative live data too.
  window.refreshRoster=window.v39RefreshAuthoritativeRoster;

  // Much wider, more varied football score model. 0-0/1-1 remain possible but are no longer the default.
  function poisson39(lambda){let L=Math.exp(-lambda),k=0,p=1;while(p>L&&k<10){k++;p*=Math.random();}return Math.max(0,k-1);}
  function score39(home,away){
    const hp=typeof teamRealismPower==='function'?teamRealismPower(home):teamPower(home);
    const ap=typeof teamRealismPower==='function'?teamRealismPower(away):teamPower(away);
    const diff=hp-ap, homeAdv=home===S.club?5.0:2.5, awayAdv=away===S.club?3.0:0;
    let xh=1.48+diff*.035+homeAdv*.055+(Math.random()-.5)*.38;
    let xa=1.24-diff*.030+awayAdv*.045+(Math.random()-.5)*.34;
    if(home===S.club)xh+=(S.tactics?.tempo-55||0)*.014;
    if(away===S.club)xa+=(S.tactics?.tempo-55||0)*.010;
    const chaos=Math.random();
    if(chaos>.78){xh*=1.28;xa*=1.22;}
    if(chaos<.08){xh*=.62;xa*=.64;}
    xh=clamp(xh,.35,4.9);xa=clamp(xa,.28,4.7);
    let hg=poisson39(xh),ag=poisson39(xa);
    // Add match-state bursts: open games and late collapses create believable 3+ goal results.
    if(Math.random()<.14){if(Math.random()<.52)hg+=1;else ag+=1;}
    if(Math.random()<.055){if(Math.random()<.5)hg+=2;else ag+=2;}
    hg=Math.min(7,hg);ag=Math.min(7,ag);
    // Avoid pathological runs of identical low scores for the same fixture.
    const key=home+'|'+away;S._v39Last=S._v39Last||{};const prev=S._v39Last[key];
    if(prev===hg+'-'+ag){
      const alt=[[1,0],[0,1],[2,0],[0,2],[2,1],[1,2],[2,2],[3,0],[0,3],[3,1],[1,3],[3,2],[2,3],[4,1],[1,4],[4,2],[2,4],[3,3],[4,3],[3,4]][Math.floor(Math.random()*20)];hg=alt[0];ag=alt[1];
    }
    S._v39Last[key]=hg+'-'+ag;return [hg,ag];
  }
  window.v37Score=score39;window.simScore=score39;window.v39Score=score39;

  // More cinematic simulation: animated phases, shots, danger, goals, VAR, cards and final stats.
  async function cinematicMatch39(result){
    if(!result?.mine)return;
    const g=result.mine, ev=(result.events||[]).filter(e=>e.m<=90).sort((a,b)=>a.m-b.m);
    const o=typeof ensure38==='function'?ensure38():document.getElementById('v38Overlay');if(!o)return;
    document.getElementById('v38Home').textContent=g.home;document.getElementById('v38Away').textContent=g.away;
    let h=0,a=0;score38(0,0);document.getElementById('v38Feed').innerHTML='';
    show38(careerDate(),'🎬 WALKOUT · luci accese',2,'Spogliatoi · tunnel · saluto dei capitani');feed38('Le squadre entrano in campo','major','');await sleep39(900);
    show38(careerDate(),'⚽ CALCIO D’INIZIO',8,'Il pubblico esplode · parte la partita');feed38('Fischio d’inizio','major','0\'');await sleep39(700);
    let last=0;
    for(const e of ev.slice(0,22)){
      await sleep39(Math.max(220,Math.min(850,(e.m-last)*14)));last=e.m;clock38(e.m);
      const roll=Math.random();
      if(e.type==='goal'){if(String(e.txt).includes(g.home))h++;else a++;score38(h,a);show38(careerDate(),'🔥 GOOOOOL!',Math.min(94,10+e.m),'Esplode lo stadio · esultanza · panchina in piedi');feed38(e.txt,'goal',e.m+"'");document.querySelector('.v38Ball')?.classList.add('goalFlash');setTimeout(()=>document.querySelector('.v38Ball')?.classList.remove('goalFlash'),700);await sleep39(650);}
      else if(e.type==='card'){show38(careerDate(),e.txt.includes('🟥')?'🟥 ROSSO':'🟨 CARTELLINO',Math.min(94,10+e.m),'Arbitro richiama il giocatore');feed38(e.txt,'card',e.m+"'");}
      else if(roll<.45){show38(careerDate(),'💥 OCCASIONE!',Math.min(94,10+e.m),'Tiro · parata · calcio d’angolo');feed38('Grande occasione · il portiere salva la squadra','major',e.m+"'");}
      else {show38(careerDate(),'🔄 CAMBIO TATTICO',Math.min(94,10+e.m),'Panchina · pressing · gestione del ritmo');feed38(e.txt,'change',e.m+"'");}
      const mom=Math.max(8,Math.min(92,50+(h-a)*15+(Math.random()*20-10)));const mb=document.getElementById('v38MomBar');if(mb)mb.style.width=mom+'%';
    }
    await sleep39(700);score38(g.score[0],g.score[1]);show38(careerDate(),'🏁 FISCHIO FINALE',100,'Statistiche · classifica · morale · stampa');feed38('Fischio finale · '+g.home+' '+g.score[0]+'-'+g.score[1]+' '+g.away,'major','90\'');await sleep39(1300);
  }
  window.cinematicMatch38=cinematicMatch39;
})();
</script>
