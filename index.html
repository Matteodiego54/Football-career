<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Manager - Browser Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00d2ff, #7a2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .card {
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #2a3a6e;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .card .label {
            font-size: 14px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card .value {
            font-size: 32px;
            font-weight: bold;
            margin-top: 8px;
        }
        .card .value.gold {
            color: #ffd700;
        }
        .card .value.green {
            color: #00ff88;
        }
        .card .value.red {
            color: #ff6b6b;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d2ff, #7a2ffc);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00b894);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }
        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
        }
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(253, 203, 110, 0.3);
        }

        .classifica {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
            overflow-x: auto;
        }
        .classifica h2 {
            margin-bottom: 15px;
            color: #00d2ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #2a3a6e;
            color: #8892b0;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #1a2a4e;
        }
        .pos-1 {
            color: #ffd700;
        }
        .pos-2 {
            color: #c0c0c0;
        }
        .pos-3 {
            color: #cd7f32;
        }
        tr:hover {
            background: #1a2a4e;
        }

        .partite {
            margin-top: 20px;
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
        }
        .partite h2 {
            color: #00d2ff;
            margin-bottom: 15px;
        }
        .partita {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #1a2a4e;
        }
        .partita:last-child {
            border-bottom: none;
        }
        .partita .squadra {
            font-weight: bold;
        }
        .partita .risultato {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }

        .giocatori {
            margin-top: 20px;
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
        }
        .giocatori h2 {
            color: #00d2ff;
            margin-bottom: 15px;
        }
        .giocatore {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #1a2a4e;
        }
        .giocatore:last-child {
            border-bottom: none;
        }
        .giocatore .nome {
            font-weight: bold;
        }
        .giocatore .ovr {
            color: #ffd700;
            font-weight: bold;
        }
        .giocatore .stats {
            color: #8892b0;
            font-size: 14px;
        }

        .messaggio {
            background: #2a3a6e;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            border-left: 4px solid #00d2ff;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
            .card .value {
                font-size: 24px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

        let gameState = {

        // ============================================================
        // INIZIALIZZAZIONE
        // ============================================================
        function initClassifica() {
            const c = {};
            for (const squadra of SQUADRE) {
                c[squadra.id] = {
                    nome: squadra.nome,
                    partite: 0,
                    vittorie: 0,
                    pareggi: 0,
                    sconfitte: 0,
                    golFatti: 0,
                    golSubiti: 0,
                    punti: 0,
                };
            }
            return c;
        }

        function initGiocatori() {
            const giocatori = [];
            let id = 1;
            for (const squadra of SQUADRE) {
                const lista = GIOCATORI_REALI[squadra.nome] || [];
                for (const data of lista) {
                    giocatori.push({
                        id: id++,
                        nome: data.nome,
                        cognome: data.cognome,
                        ruolo: data.ruolo,
                        ovr: data.ovr,
                        eta: data.eta,
                        squadra_id: squadra.id,
                        gol: 0,
                        assist: 0,
                        minuti: 0,
                        golStagione: 0,
                        assistStagione: 0,
                        tiro: Math.round(data.ovr * (0.5 + Math.random() * 0.5)),
                        difesa: Math.round(data.ovr * (0.4 + Math.random() * 0.6)),
                        velocita: Math.round(data.ovr * (0.5 + Math.random() * 0.5)),
                        fisico: Math.round(data.ovr * (0.4 + Math.random() * 0.6)),
                        tecnica: Math.round(data.ovr * (0.5 + Math.random() * 0.5)),
                        intelligenza: Math.round(data.ovr * (0.4 + Math.random() * 0.6)),
                    });
                }
            }
            return giocatori;
        }

        function resetGame() {
            gameState.giornata = 0;
            gameState.classifica = initClassifica();
            gameState.partite = [];
            gameState.giocatori = initGiocatori();
            gameState.capocannoniere = { nome: '', gol: 0 };
            gameState.assistman = { nome: '', assist: 0 };
            aggiornaUI();
            mostraMessaggio('🔄 Gioco resettato! Inizia una nuova stagione!', '#2a3a6e');
        }

        // ============================================================
        // FUNZIONI DI UTILITÀ
        // ============================================================
        function getSquadra(id) {
            return SQUADRE.find(s => s.id === id);
        }

        function getGiocatoriSquadra(id) {
            return gameState.giocatori.filter(g => g.squadra_id === id);
        }

        function calcolaForza(id) {
            const giocatori = getGiocatoriSquadra(id);
            if (giocatori.length === 0) return 50;
            giocatori.sort((a, b) => b.ovr - a.ovr);
            const top = giocatori.slice(0, 11);
            const sum = top.reduce((acc, g) => acc + g.ovr, 0);
            return Math.round(sum / top.length);
        }

        function getClassificaArray() {
            const arr = Object.values(gameState.classifica);
            arr.sort((a, b) => {
                if (b.punti !== a.punti) return b.punti - a.punti;
                return (b.golFatti - b.golSubiti) - (a.golFatti - a.golSubiti);
            });
            return arr;
        }

        // ============================================================
        // SIMULAZIONE
        // ============================================================
        function simulaGiornata() {
            if (gameState.giornata >= gameState.totaleGiornate) {
                mostraMessaggio('🏆 Stagione completata! Premi Reset per ricominciare.', '#ff6b6b');
                return;
            }

            gameState.giornata++;
            const squadreIds = SQUADRE.map(s => s.id);
            const mischiate = [...squadreIds].sort(() => Math.random() - 0.5);
            const risultati = [];

            for (let i = 0; i < mischiate.length; i += 2) {
                if (i + 1 >= mischiate.length) break;
                const casa = mischiate[i];
                const ospite = mischiate[i + 1];

                const fCasa = calcolaForza(casa);
                const fOspite = calcolaForza(ospite);

                const attesiCasa = Math.max(0, (fCasa / 100) * 2.5 - (fOspite / 100) * 1.2) * 1.1;
                const attesiOspite = Math.max(0, (fOspite / 100) * 2.5 - (fCasa / 100) * 1.2);

                let gCasa = Math.round(attesiCasa + (Math.random() - 0.5) * 1.5);
                let gOspite = Math.round(attesiOspite + (Math.random() - 0.5) * 1.5);
                gCasa = Math.max(0, gCasa);
                gOspite = Math.max(0, gOspite);

                // Aggiorna classifica
                const c = gameState.classifica;
                if (c[casa]) {
                    c[casa].partite++;
                    c[casa].golFatti += gCasa;
                    c[casa].golSubiti += gOspite;
                    if (gCasa > gOspite) { c[casa].vittorie++;
                        c[casa].punti += 3; } else if (gCasa === gOspite) { c[casa].pareggi++;
                        c[casa].punti += 1; } else { c[casa].sconfitte++; }
                }
                if (c[ospite]) {
                    c[ospite].partite++;
                    c[ospite].golFatti += gOspite;
                    c[ospite].golSubiti += gCasa;
                    if (gOspite > gCasa) { c[ospite].vittorie++;
                        c[ospite].punti += 3; } else if (gOspite === gCasa) { c[ospite].pareggi++;
                        c[ospite].punti += 1; } else { c[ospite].sconfitte++; }
                }

                // Statistiche giocatori
                for (const id of [casa, ospite]) {
                    const gol = id === casa ? gCasa : gOspite;
                    const giocatori = getGiocatoriSquadra(id);
                    for (const g of giocatori) {
                        g.minuti = (g.minuti || 0) + 90;
                        if (Math.random() < 0.15 && gol > 0) {
                            g.gol = (g.gol || 0) + 1;
                            g.golStagione = (g.golStagione || 0) + 1;
                        }
                        if (Math.random() < 0.12 && gol > 1) {
                            g.assist = (g.assist || 0) + 1;
                            g.assistStagione = (g.assistStagione || 0) + 1;
                        }
                    }
                }

                risultati.push({
                    giornata: gameState.giornata,
                    squadra_casa: casa,
                    squadra_ospite: ospite,
                    gol_casa: gCasa,
                    gol_ospite: gOspite,
                });
            }

            gameState.partite = [...gameState.partite, ...risultati];

            // Calcola capocannoniere e assistman
            aggiornaPremi();

            aggiornaUI();
            mostraMessaggio(`📊 Giornata ${gameState.giornata} completata! ${risultati.length} partite giocate.`, '#00d2ff');
        }

        function simulaStagione() {
            if (gameState.giornata >= gameState.totaleGiornate) {
                mostraMessaggio('🏆 Stagione già completata! Premi Reset per ricominciare.', '#ff6b6b');
                return;
            }
            const rimanenti = gameState.totaleGiornate - gameState.giornata;
            for (let i = 0; i < rimanenti; i++) {
                simulaGiornata();
            }
            mostraMessaggio('🏆 STAGIONE COMPLETATA! ' + 
                `Campione: ${getClassificaArray()[0]?.nome || '?'} 🏆`, '#ffd700');
        }

        function aggiornaPremi() {
            let maxGol = 0;
            let maxAssist = 0;
            let capo = '';
            let assistMan = '';
            
            for (const g of gameState.giocatori) {
                if ((g.golStagione || 0) > maxGol) {
                    maxGol = g.golStagione || 0;
                    capo = `${g.nome} ${g.cognome}`;
                }
                if ((g.assistStagione || 0) > maxAssist) {
                    maxAssist = g.assistStagione || 0;
                    assistMan = `${g.nome} ${g.cognome}`;
                }
            }
            gameState.capocannoniere = { nome: capo, gol: maxGol };
            gameState.assistman = { nome: assistMan, assist: maxAssist };
        }

            const nomi = SQUADRE.map(s => s.nome);

                }
            }
        }

                </thead>
                <tbody>`;
            for (let i = 0; i < classificaArr.length; i++) {
                const s = classificaArr[i];
                const classe = i === 0 ? 'pos-1' : i === 1 ? 'pos-2' : i === 2 ? 'pos-3' : '';
                const isMia = s.nome === squadra?.nome;
                html += `<tr style="${isMia ? 'background: #2a3a6e;' : ''}">
                    <td class="${classe}">${i + 1}</td>
                    <td>${isMia ? '👉 ' : ''}${s.nome}</td>
                    <td>${s.partite}</td>
                    <td>${s.vittorie}</td>
                    <td>${s.pareggi}</td>
                    <td>${s.sconfitte}</td>
                    <td>${s.golFatti}</td>
                    <td>${s.golSubiti}</td>
                    <td><strong>${s.punti}</strong></td>
                </tr>`;
            }
            html += `</tbody></table>
                <div style="margin-top:15px;padding:10px;background:#1a2a4e;border-radius:10px;">
                    <strong>⚽ Capocannoniere:</strong> ${gameState.capocannoniere.nome || '-'} (${gameState.capocannoniere.gol || 0} gol) &nbsp;|&nbsp;
                    <strong>🅰️ Assistman:</strong> ${gameState.assistman.nome || '-'} (${gameState.assistman.assist || 0} assist)
                </div>`;
            document.getElementById('classificaTabella').innerHTML = html;

            // Ultime partite
            const ultime = gameState.partite.slice(-10).reverse();
            let partiteHtml = '';
            if (ultime.length === 0) {
                partiteHtml = '<p style="color:#8892b0;">Nessuna partita giocata. Simula una giornata!</p>';
            } else {
                for (const p of ultime) {
                    const casa = getSquadra(p.squadra_casa);
                    const ospite = getSquadra(p.squadra_ospite);
                    partiteHtml += `<div class="partita">
                        <span class="squadra">${casa?.stemma || ''} ${casa?.nome || '?'}</span>
                        <span class="risultato">${p.gol_casa} - ${p.gol_ospite}</span>
                        <span class="squadra">${ospite?.stemma || ''} ${ospite?.nome || '?'}</span>
                    </div>`;
                }
            }
            document.getElementById('partiteLista').innerHTML = partiteHtml;

            // Giocatori della squadra selezionata
            const giocatori = getGiocatoriSquadra(gameState.squadraSelezionata);
            let giocatoriHtml = '';
            if (giocatori.length === 0) {
                giocatoriHtml = '<p style="color:#8892b0;">Nessun giocatore trovato.</p>';
            } else {
                giocatori.sort((a, b) => b.ovr - a.ovr);
                for (const g of giocatori) {
                    giocatoriHtml += `<div class="giocatore">
                        <span class="nome">${g.nome} ${g.cognome}</span>
                        <span class="stats">${g.ruolo}</span>
                        <span class="ovr">${g.ovr}</span>
                        <span class="stats">⚽ ${g.golStagione || 0} 🅰️ ${g.assistStagione || 0}</span>
                    </div>`;
                }
            }
            document.getElementById('giocatoriLista').innerHTML = giocatoriHtml;
        }

        function mostraMessaggio(msg, colore = '#2a3a6e') {
            const el = document.getElementById('messaggio');
            el.textContent = msg;
            el.style.borderLeftColor = colore || '#00d2ff';
        }

        // ============================================================
        // AVVIO
        // ============================================================
        resetGame();

        // Cambia squadra automaticamente all'avvio (chiedi all'utente)
        setTimeout(() => {
            if (confirm('Benvenuto in Football Manager! 🏆\n\nVuoi selezionare la tua squadra?')) {
                cambiaSquadra();
            }
        }, 500);
    </script>
</body>
</html>
