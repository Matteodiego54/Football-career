function calcEurope(pos){
 if(['Italia','Inghilterra','Spagna','Germania','Francia'].includes(S.country)){if(pos<=4)return'🌟 Champions League';if(pos<=6)return'🟠 Europa League';if(pos===7)return'🟢 Conference League';}
 if(['Olanda','Portogallo','Belgio','Turchia','Scozia'].includes(S.country)){if(pos<=3)return'🌟 Champions League';if(pos<=5)return'🟠 Europa League';if(pos===6)return'🟢 Conference League';}return'';
}
function promoteAcademy(){
 const messages=[];
 S.youth.forEach(p=>{
   if(p.status==='promosso'||p.status==='loaned')return;
   const old=p.academyTier||'U15';
   const idx=ACADEMY_TIERS.indexOf(old);
   if(idx<0)return;
   const targetAge=15+idx+1;
   if(p.age>=targetAge){
     if(idx<ACADEMY_TIERS.length-1){p.academyTier=ACADEMY_TIERS[idx+1];messages.push(`🌱 ${p.name}: ${old} → ${p.academyTier}`);}
     else if(p.age>=19&&p.ovr>=62&&p.pot>=p.ovr+2){p.status='proponi';messages.push(`⭐ ${p.name} è pronto per la Primavera/prima squadra.`);}
   }
 });
 return messages;
}
function finishSeason(){
 const pos=rank();S.month=7;S.europe=calcEurope(pos);
 if(pos===1){S.news.unshift(`🏆 ${S.club} è campione di ${S.division}.`);S.social.unshift(`👑 @LeagueOfficial: ${S.club} campione!`);}
 else S.news.unshift(`📋 Fine stagione: ${pos}° posto. ${S.europe||'Nessuna coppa europea.'}`);
 const academyNews=promoteAcademy();S.news.unshift(...academyNews.slice(0,5));
 S.history.unshift({club:S.club,league:S.league,date:`Fine stagione ${S.season} · ${pos}°`,points:S.table[S.club]?.pts||0});
 S.season++;S.match=0;S.month=7;
 S.players.forEach(p=>{p.age++;p.form=clamp(p.form,5,9.5);p.fatigue=clamp(p.fatigue-35,0,100);p.suspension=0;if(p.injury?.days<=0)p.injury=null;if(p.contractEnd?.startsWith(String(S.season-1)))p.contractEnd=`${S.season}-06-30`;p.benchStreak=0;}); S.board=S.board||{target:4,confidence:68}; S.board.confidence=clamp(S.board.confidence+(pos<=S.board.target?8:-8),0,100);
 S.youth.forEach(p=>{p.age++;const delta=p.form>=7.5?1:p.form<6?-1:0;p.ovr=clamp(p.ovr+delta,p.ovr-3,p.pot);if(p.form<6.2&&Math.random()<.25)p.pot=Math.max(p.ovr,p.pot-1);if(p.form>8&&Math.random()<.3)p.pot=clamp(p.pot+1,p.ovr,94);});
 initTable();S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);S.tacticalSelected=null;S.simBusy=false;render();
}

 return `<div class="teamHero">${safeImg(p.cutout||p.thumb,'face',p.name)}<div><div class="eyebrow">PLAYER PROFILE</div><h2>${esc(p.name)} <span class="rating">${p.ovr}</span></h2><p>${p.pos} · ${p.age} anni · ${esc(p.nationality||'—')} · ${esc(p.foot||'—')}</p>
 <a class="tag" target="_blank" rel="noopener" href="${tmPlayerUrl(p.name)}">↗ Verifica Transfermarkt</a>${loading?'<span class="muted" style="display:block;margin-top:8px">Aggiornamento dati reali…</span>':''}</div></div>
 <div class="profileGrid"><div class="screen"><h3>🎮 Rating motore</h3>${playerAttributes(p)}<p class="muted">OVR/POT sono rating della simulazione.</p></div><div class="screen"><h3>📋 Dati reali disponibili</h3>
 <div class="row">Altezza <b>${esc(p.height||'—')}</b></div><div class="row">Peso <b>${esc(p.weight||'—')}</b></div><div class="row">Piede <b>${esc(p.foot||'—')}</b></div><div class="row">Luogo nascita <b>${esc(p.birthPlace||'—')}</b></div><div class="row">Agente <b>${esc(p.agent||'—')}</b></div><div class="row">Contratto <b>${esc(p.contractEnd||'—')}</b></div><div class="row">Valore gioco <b>${money(marketValue(p))}</b></div></div></div>
 <h3>📊 Statistiche stagione</h3><div class="stats">${playerStats(p)}</div><h3>🔁 Storico trasferimenti</h3>${transfers}<br><button class="primary" onclick="closeModal()">Chiudi</button>`;
}
function openPlayer(id){
 let p=S.players.find(x=>String(x.id)===String(id)); if(!p)return;
 ensurePlayerData(p);
 modal(playerProfileHtml(p,true));
 const pid=String(p.id);
 /* Background only: the modal is usable and scrollable immediately. */
 Promise.resolve(loadPlayerProfile(p)).then(updated=>{
   S.players=S.players.map(x=>String(x.id)===pid?updated:x);
   rosterCache[S.club]=S.players;
   try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));}catch(e){}
   const m=document.getElementById('playerModal');
   if(m) m.querySelector('.trophyBox').innerHTML=playerProfileHtml(updated,false);
 }).catch(()=>{});
}
function modal(x){let old=document.getElementById('playerModal');if(old)old.remove();let d=document.createElement('div');d.className='trophy';d.style.display='flex';d.id='playerModal';d.innerHTML=`<div class="trophyBox">${x}</div>`;document.body.appendChild(d);}
function closeModal(){document.getElementById('playerModal')?.remove();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMatchCenter();}});
document.addEventListener('click',e=>{const m=e.target.closest('#playerModal');if(m&&e.target===m)closeModal();const mm=e.target.closest('#matchModal');if(mm&&e.target===mm&&!S.simBusy){closeMatchCenter();}});
function tactics(){
 const pos=formationPositions(),wanted=formations[S.formation];
 const active=S.players.filter(p=>p.status!=='loaned');
 const ids=new Set((S.lineup||[]).filter(Boolean));
 const bench=(S.bench||[]).map(id=>S.players.find(p=>String(p.id)===String(id))).filter(Boolean);
 const available=active.filter(p=>!ids.has(p.id));
 const selected=S.tacticalSelected||null;
 const captain=S.captain||S.lineup.find(Boolean);
 return `<div class="screen"><div class="sectionTitle"><div><div class="eyebrow">TACTICAL COMMAND CENTER · V16</div><h2>🧠 Formazioni & Panchina</h2><p class="muted">Costruisci l'XI, gestisci la panchina e prepara i cambi prima del fischio d'inizio. <b>Gli stemmi, le foto e le identità dei giocatori non vengono modificati.</b></p></div><button class="primary" onclick="autoTactical()">✨ XI ottimale</button></div>
 <div class="tabs" style="margin:12px 0">${Object.keys(formations).map(f=>`<button class="${S.formation===f?'primary':''}" onclick="setFormation('${f}')">${f}</button>`).join('')}</div>
 <div class="tacticPreset"><b class="muted" style="padding:10px 4px">PRESET:</b><button onclick="applyPreset('balanced')">⚖️ Equilibrato</button><button onclick="applyPreset('gegen')">🔥 Gegenpress</button><button onclick="applyPreset('low')">🧱 Blocco basso</button><button onclick="applyPreset('possession')">🎯 Possesso</button><button onclick="applyPreset('direct')">🚀 Verticale</button></div>
 <div class="lineupSummary"><div class="card"><b>${active.filter(p=>ids.has(p.id)).length}/11</b><span class="muted">XI completo</span></div><div class="card"><b>${bench.length}</b><span class="muted">Panchina</span></div><div class="card"><b>${captain?esc(S.players.find(p=>p.id===captain)?.name||'—'):'—'}</b><span class="muted">Capitano</span></div><div class="card"><b>${Math.round(lineupStrength())}</b><span class="muted">Forza XI</span></div></div>
 <div class="formBoard"><div class="tacticalPanel"><div class="sectionTitle"><h3>🏟️ Lavagna</h3><span class="tag">Tocca un giocatore → sostituiscilo</span></div><div class="pitch v15">${pos.map((xy,i)=>{let p=S.players.find(x=>String(x.id)===String(S.lineup[i]));return `<div class="slot v15" style="left:${xy[0]}%;top:${xy[1]}%"><span class="posLabel">${esc(wanted[i]||'RUOLO')}</span><div class="playerdot" onclick="selectSlot(${i})" title="Cambia giocatore">${p?safeImg(p.cutout||p.thumb,'',''):`${i+1}`}</div><span class="playerName" onclick="selectSlot(${i})">${p?esc(p.name):'— SLOT VUOTO'}</span>${p?`<span class="micro">OVR ${p.ovr} · ${p.form.toFixed(1)} · ${p.fatigue}% fatica</span>`:''}</div>`}).join('')}</div><div class="pitchLegend"><span>🟡 Titolare</span><span>🔵 Selezionato: ${selected?esc(S.players.find(p=>p.id===selected)?.name||'—'):'nessuno'}</span><span>👑 Capitano: ${captain?esc(S.players.find(p=>p.id===captain)?.name||'—'):'—'}</span></div></div>
 <div class="tacticalPanel"><h3>🪑 Panchina</h3><p class="muted">9 posti. Seleziona un giocatore e poi clicca uno slot in campo per effettuare uno scambio.</p><div class="benchGrid">${bench.map((p,i)=>`<div class="benchItem ${selected===p.id?'selected':''}" onclick="selectBench('${esc(p.id)}')">${safeImg(p.cutout||p.thumb,'face',p.name)}<span style="flex:1"><b>${esc(p.name)}</b><br><span class="micro">${p.pos} · OVR ${p.ovr} · Forma ${p.form.toFixed(1)}</span></span><span class="benchNo">${i+1}</span></div>`).join('')||'<div class="dropHint">Panchina vuota. Usa “XI ottimale”.</div>'}</div><div class="dropHint">💡 <b>Scambio rapido:</b> seleziona un panchinaro → tocca il titolare da sostituire.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button onclick="fillBench()">🪑 Completa panchina</button><button onclick="clearBench()">🧹 Svuota panchina</button><button class="gold" onclick="autoTactical()">✨ Ottimizza XI + panchina</button></div></div></div>
 <div class="grid2" style="margin-top:14px"><div class="card"><h3>🎛️ Piano partita</h3><label>⚡ Ritmo <b>${S.tactics.tempo}</b><input type="range" min="20" max="90" value="${S.tactics.tempo}" oninput="S.tactics.tempo=+this.value;this.previousElementSibling.innerHTML='⚡ Ritmo <b>'+this.value+'</b>'"></label><label>🔥 Pressing <b>${S.tactics.press}</b><input type="range" min="20" max="90" value="${S.tactics.press}" oninput="S.tactics.press=+this.value;this.previousElementSibling.innerHTML='🔥 Pressing <b>'+this.value+'</b>'"></label><label>🧱 Linea difensiva <b>${S.tactics.defLine}</b><input type="range" min="20" max="90" value="${S.tactics.defLine}" oninput="S.tactics.defLine=+this.value;this.previousElementSibling.innerHTML='🧱 Linea difensiva <b>'+this.value+'</b>'"></label><label>↔️ Ampiezza <b>${S.tactics.width}</b><input type="range" min="20" max="90" value="${S.tactics.width}" oninput="S.tactics.width=+this.value;this.previousElementSibling.innerHTML='↔️ Ampiezza <b>'+this.value+'</b>'"></label></div><div class="card"><h3>👑 Leadership & ruoli</h3><label>Capitano<select class="roleSelect" onchange="S.captain=this.value;render()">${active.map(p=>`<option value="${esc(p.id)}" ${String(captain)===String(p.id)?'selected':''}>${esc(p.name)} · ${p.ovr}</option>`).join('')}</select></label><p class="muted">Il capitano influenza morale e leadership della squadra. I cambi durante la partita vengono scelti anche in base a fatica, ruolo e risultato.</p><button class="blue" onclick="prepareMatchPlan()">📋 Conferma piano partita</button></div></div></div>`;
}
function setFormation(f){S.formation=f;S.lineup=defaultLineup();S.bench=S.players.filter(p=>p.status!=='loaned'&&!S.lineup.includes(p.id)).sort((a,b)=>b.ovr-a.ovr).slice(0,9).map(p=>p.id);S.tacticalSelected=null;render();}
function selectBench(id){S.tacticalSelected=id;render();}
function selectSlot(i){const id=S.tacticalSelected;if(id){swapIntoSlot(i,id);return;}const current=S.lineup[i];if(current){S.captain=current;S.tacticalSelected=current;status('👤 Giocatore selezionato: ora scegli chi deve entrare.');render();}}
function swapIntoSlot(i,id){const old=S.lineup[i];const bi=(S.bench||[]).findIndex(x=>String(x)===String(id));if(bi<0)return;S.lineup[i]=id;if(old){S.bench[bi]=old;}else S.bench.splice(bi,1);S.bench=[...new Set(S.bench.filter(Boolean))].filter(x=>!S.lineup.includes(x)).slice(0,9);S.tacticalSelected=null;render();}
function autoTactical(){S.lineup=defaultLineup();S.bench=S.players.filter(p=>p.status!=='loaned'&&!S.lineup.includes(p.id)&&(!p.injury||p.injury.days<=0)&&(!p.suspension||p.suspension<=0)).sort((a,b)=>(b.ovr+b.form*2-b.fatigue*.04)-(a.ovr+a.form*2-a.fatigue*.04)).slice(0,9).map(p=>p.id);if(!S.captain||!S.lineup.includes(S.captain))S.captain=S.lineup.find(Boolean);S.tacticalSelected=null;status('✨ XI e panchina ottimizzati.');render();}
function fillBench(){const ids=new Set((S.lineup||[]).filter(Boolean));S.bench=S.players.filter(p=>p.status!=='loaned'&&!ids.has(p.id)&&(!p.injury||p.injury.days<=0)&&(!p.suspension||p.suspension<=0)).sort((a,b)=>b.ovr-a.ovr).slice(0,9).map(p=>p.id);status('🪑 Panchina completata con i migliori disponibili.');render();}
function clearBench(){S.bench=[];S.tacticalSelected=null;status('🧹 Panchina svuotata.');render();}
function applyPreset(x){const presets={balanced:[60,60,55,55],gegen:[76,88,72,62],low:[42,35,30,45],possession:[55,52,58,70],direct:[82,68,66,45]};const v=presets[x]||presets.balanced;S.tactics={tempo:v[0],press:v[1],defLine:v[2],width:v[3]};render();}
function prepareMatchPlan(){S.news.unshift(`📋 Piano partita confermato: ${S.formation} · ${S.tactics.tempo}/${S.tactics.press}/${S.tactics.defLine}/${S.tactics.width}.`);status('✅ Piano partita confermato');}
function youthPage(){
 initAcademy();const tiers=ACADEMY_TIERS;const pre=['U8','U9','U10','U11','U12','U13','U14'];
 return `<div class="screen"><div class="eyebrow">ACADEMY · LONG TERM</div><h2>🌱 Vivaio completo</h2><div class="card"><b>Settore pre-agonistico</b><p class="muted">U8–U14 presenti nel club come categorie di sviluppo, ma non vengono promossi direttamente in prima squadra. Il percorso gestionale giocabile parte da U15.</p><div class="tabs">${pre.map(t=>`<span class="tag">${t} · ${3+(S.club.length+t.length)%5} atleti</span>`).join('')}</div></div><p class="muted">La filiera giocabile parte da U15. Ogni stagione i giovani avanzano di categoria; forma, minuti e prestiti modificano OVR e POT.</p>
 ${tiers.map(t=>`<div class="youthTier"><h3>${t}</h3>${S.youth.filter(p=>p.academyTier===t&&p.status!=='loaned').map(p=>`<div class="row"><span><b>${esc(p.name)}</b><br><small class="muted">${p.pos} · ${p.age} anni · ${esc(p.nationality)} · OVR ${p.ovr} · POT ${p.pot} · forma ${p.form.toFixed(1)}</small></span><span><button class="green" onclick="promoteYouth('${esc(p.id)}')">Promuovi</button><button onclick="loanYouth('${esc(p.id)}')">Prestito</button></span></div>`).join('')||'<p class="muted">Nessun giocatore in questa categoria.</p>'}</div>`).join('')}</div>`;
}
function promoteYouth(id){
 const p=S.youth.find(x=>String(x.id)===String(id));if(!p)return;
 if(p.age<15)return status('⛔ Le promozioni partono da U15.');
 if(p.age<17&&p.academyTier!=='U19')return status('⏳ Fai crescere il giocatore nella filiera prima della prima squadra.');
 p.status='prima squadra';p.team=S.club;p.contractEnd=`${S.season+2}-06-30`;S.players.push(p);S.youth=S.youth.filter(x=>x.id!==p.id);
 S.news.unshift(`🟢 ${p.name} promosso in prima squadra dalla ${p.academyTier}.`);render();
}
function loanTargets(){return clubs().filter(c=>c!==S.club).slice(0,12);}
function loanYouth(id){
 const p=S.youth.find(x=>String(x.id)===String(id));if(!p)return;
 const dest=loanTargets()[Math.floor(Math.random()*Math.max(1,loanTargets().length))]||'Club estero';
 p.status='loaned';p.loan={club:dest,until:S.season+1};S.loansOut.push(p);S.news.unshift(`✈️ ${p.name} va in prestito a ${dest}.`);render();
}
function loanFirstTeam(id){
 const p=S.players.find(x=>String(x.id)===String(id));if(!p||p.status==='loaned')return;
 const dest=loanTargets()[Math.floor(Math.random()*Math.max(1,loanTargets().length))]||'Club estero';
 p.status='loaned';p.loan={club:dest,until:S.season+1};S.loansOut.push(p);S.news.unshift(`✈️ Prestito: ${p.name} → ${dest}.`);render();
}
function contracts(){
 const exp=S.players.filter(p=>p.status!=='loaned').sort((a,b)=>String(a.contractEnd).localeCompare(String(b.contractEnd)));
 return `<div class="screen"><h2>📜 Contratti</h2><p class="muted">Rinnovi, scadenze, stipendi e clausole. I giocatori con poco minutaggio possono rifiutare il rinnovo.</p>${exp.map(p=>`<div class="playerCard">${safeImg(p.cutout||p.thumb,'face',p.name)}<span style="flex:1"><b>${esc(p.name)}</b><br><small class="muted">OVR ${p.ovr} · scade ${esc(p.contractEnd)} · stipendio ${money(p.salary)} · clausola ${money(p.releaseClause)}</small></span><button onclick="renewPlayer('${esc(p.id)}')">Rinnova</button><button onclick="releasePlayer('${esc(p.id)}')">Svincola</button><button onclick="loanFirstTeam('${esc(p.id)}')">Prestito</button></div>`).join('')}</div>`;
}
function renewPlayer(id){
 const p=S.players.find(x=>String(x.id)===String(id));if(!p)return;
 const playing=p.apps||0,interest=clamp(55+(playing*1.2)+(S.rep-60)*.3+(p.form-7)*5,15,95);
 if(Math.random()*100>interest){status(`❌ ${p.name} rifiuta il rinnovo (interesse ${Math.round(interest)}%).`);return;}
 p.contractEnd=`${S.season+2}-06-30`;p.salary=Math.round((p.salary||200000)*(1.05+Math.random()*.15));p.releaseClause=Math.round((p.releaseClause||marketValue(p))*1.12);
 S.news.unshift(`📝 Rinnovo: ${p.name} prolunga fino al ${p.contractEnd}.`);render();
}
function releasePlayer(id){
 const p=S.players.find(x=>String(x.id)===String(id));if(!p)return;
 if(p.age<18)return status('⛔ Un giovane non può essere svincolato da questo pannello.');
 S.players=S.players.filter(x=>x.id!==p.id);S.lineup=S.lineup.filter(x=>x!==p.id);S.news.unshift(`🆓 ${p.name} è stato svincolato.`);render();
}
function negotiation(name){
 const p=transferPool.find(x=>x[0]===name);if(!p)return;
 const interest=clamp(50+(teamPower(S.club)-teamPower(p[4]))*1.5+(S.rep-60)*.35,12,92);
 modal(`<div class="eyebrow">TRANSFER ROOM</div><h2>${esc(p[0])}</h2><p>${p[1]} · OVR ${p[2]} · ${esc(p[4])} · valore richiesto ${money(p[3])}</p>
 <div class="grid2"><div class="card"><label>💶 Offerta iniziale<input id="negFee" type="number" value="${Math.round(p[3]*.8)}"></label><label>💰 Bonus<input id="negBonus" type="number" value="${Math.round(p[3]*.05)}"></label></div>
 <div class="card"><label>👤 Stipendio annuo<input id="negSalary" type="number" value="${Math.round(p[3]*.025)}"></label><label>🔓 Clausola<input id="negClause" type="number" value="${Math.round(p[3]*1.4)}"></label></div></div>
 <p>Interesse giocatore: <b>${Math.round(interest)}%</b>. Ruolo: <select id="negRole"><option>titolare</option><option>rotazione</option><option>panchina</option></select></p>
 <button class="primary" onclick="submitNegotiation('${esc(name)}',${p[3]},${interest})">🤝 Presenta offerta</button> <button onclick="closeModal()">Annulla</button>`);
}
function showTransferCelebration(player,fromClub,fee,bonus){
 const old=document.getElementById('transferCelebration');if(old)old.remove();
 const ov=document.createElement('div');ov.id='transferCelebration';
 ov.innerHTML=`<div class="transferCelebrationBox"><div class="dealFlash">🚨 AFFARE COMPLETATO · UFFICIALE</div><div class="transferFaces"><div>${safeImg(teamImg(fromClub), 'transferFace',fromClub)}<div class="muted" style="margin-top:7px">${esc(fromClub)}</div></div><div class="transferArrow">→</div><div>${safeImg(player.cutout||player.thumb,'transferFace',player.name)}<div class="muted" style="margin-top:7px">${esc(S.club)}</div></div></div><div class="dealTitle">${esc(player.name)}</div><div class="dealFee">${money(fee)}${bonus?` + ${money(bonus)} bonus`:''}</div><p class="muted">Il giocatore ha firmato. La piazza esplode.</p><button class="primary" onclick="document.getElementById('transferCelebration')?.remove();render()">✨ Presentalo alla squadra</button></div>`;
 document.body.appendChild(ov);
 for(let i=0;i<55;i++){const c=document.createElement('i');c.className='confettiPiece';c.style.left=(Math.random()*100)+'%';c.style.setProperty('--dx',((Math.random()-.5)*520)+'px');c.style.setProperty('--dy',(Math.random()*650+420)+'px');c.style.animationDelay=(Math.random()*.25)+'s';c.style.background=['#ffd76a','#55d6ff','#ffffff','#e84b5f'][i%4];ov.appendChild(c)}
 setTimeout(()=>{if(document.getElementById('transferCelebration')){document.getElementById('transferCelebration').remove();render()}},6500);
}
function submitNegotiation(name,ask,interest){
 const fee=Number(document.getElementById('negFee')?.value)||0,bonus=Number(document.getElementById('negBonus')?.value)||0,salary=Number(document.getElementById('negSalary')?.value)||0,clause=Number(document.getElementById('negClause')?.value)||0,role=document.getElementById('negRole')?.value||'rotazione';
 const roleBonus=role==='titolare'?10:role==='rotazione'?3:-10,ratio=fee/ask;
 const seller=clamp((ratio-0.72)*140+roleBonus+Math.random()*22,0,100),player=clamp(interest+roleBonus+(salary>ask*.02?8:0)+(S.rep>70?5:0),0,100);
 if(S.budget<fee+bonus)return status('💰 Budget insufficiente.');
 if(seller<58){closeModal();return status(`❌ ${transferPool.find(x=>x[0]===name)?.[4]||'Club'} rifiuta: offerta troppo bassa.`);}
 if(player<48){closeModal();return status(`❌ ${name} non è convinto del progetto (${Math.round(player)}% interesse).`);}
 const p=transferPool.find(x=>x[0]===name);S.budget-=fee+bonus;
 const np=ensurePlayerData({id:'tr'+Date.now(),name:p[0],pos:p[1],ovr:p[2],pot:clamp(p[2]+8,p[2],94),age:20,team:S.club,value:fee,salary,releaseClause:clause,contractEnd:`${S.season+(role==='titolare'?3:2)}-06-30`,status:'prima squadra'});
 S.players.push(np);S.news.unshift(`🚨 AFFARE: ${name} arriva da ${p[4]} per ${money(fee)} + ${money(bonus)} bonus.`);S.social.unshift(`🔴 @TransferAlert: ${name} ➡️ ${S.club}.`);
 closeModal();showTransferCelebration(np,p[4],fee,bonus);
}
function market(){
 return `<div class="screen"><h2>💰 Mercato — negoziazione reale</h2><p>Budget: <b class="goldText">${money(S.budget)}</b>. Il prezzo da solo non basta: contano club, interesse del giocatore, ruolo promesso, stipendio, bonus e clausola.</p>
 <div class="searchbar"><input id="q" placeholder="🔎 Nome" oninput="filterMarket()"><input id="max" type="number" placeholder="Valore max €" oninput="filterMarket()"><select id="teamFilter" onchange="filterMarket()"><option value="">Tutti i club</option>${[...new Set(transferPool.map(x=>x[4]))].map(t=>`<option>${esc(t)}</option>`).join('')}</select><select id="posFilter" onchange="filterMarket()"><option value="">Tutti i ruoli</option>${['POR','DC','CC','TQ','AS','AD','ATT'].map(x=>`<option>${x}</option>`).join('')}</select></div>
 <div id="marketResults"></div><div class="card"><b>📚 Verifica dati</b><p class="muted">Per mercato e trasferimenti storici il gioco apre Transfermarkt come fonte di verifica; il gioco non esegue scraping automatico del sito.</p><a class="tag" target="_blank" rel="noopener" href="${TM}">↗ Apri Transfermarkt</a></div></div>`;
}
function filterMarket(){
 const q=(document.getElementById('q')?.value||'').toLowerCase(),max=Number(document.getElementById('max')?.value||Infinity),tm=document.getElementById('teamFilter')?.value||'',po=document.getElementById('posFilter')?.value||'';

<script>
/* V13 — THE BIG STEP: career realism engine. Deliberately does NOT modify
   the existing real-club badge or real-player media/roster systems. */
(function(){
  const OLD_HOME=window.home, OLD_CAL=window.calendar, OLD_FINISH=window.finishSeason, OLD_NORMALIZE=window.normalizeState;
  function r(a,b){return a+Math.random()*(b-a)}
  function rr(a,b){return Math.floor(r(a,b+1))}
  function realismInit(){
    S.realism={
      morale: S.realism?.morale ?? 68,
      dressingRoom: S.realism?.dressingRoom ?? 72,
      tacticalFamiliarity: S.realism?.tacticalFamiliarity ?? 70,
      boardPressure: S.realism?.boardPressure ?? 20,
      mediaPressure: S.realism?.mediaPressure ?? 15,
      injuries: S.realism?.injuries ?? 0,
      momentum: S.realism?.momentum ?? 0,
      cupProgress: S.realism?.cupProgress ?? '—',
      cleanSheets: S.realism?.cleanSheets ?? 0,
      xgFor: S.realism?.xgFor ?? 0,
      xgAgainst: S.realism?.xgAgainst ?? 0,
      shotsFor: S.realism?.shotsFor ?? 0,
      shotsAgainst: S.realism?.shotsAgainst ?? 0,
      lastPress: S.realism?.lastPress ?? 'La squadra prepara la prossima gara.'
    };
  }
  function teamRealismPower(team){
    let base=teamPower(team);
    if(team!==S.club)return base+r(-2.5,2.5);
    const ls=lineupStrength();
    const fatigue=(S.players||[]).filter(p=>(S.lineup||[]).includes(p.id)).reduce((a,p)=>a+(p.fatigue||0),0)/Math.max(1,(S.lineup||[]).length);
    const form=(S.players||[]).filter(p=>(S.lineup||[]).includes(p.id)).reduce((a,p)=>a+(p.form||7),0)/Math.max(1,(S.lineup||[]).length);
    const tac=tacticalModifier();
    return base+(ls-75)*.65+(form-7)*2.3+tac-(fatigue*.075)+(S.realism.morale-60)*.07+(S.realism.momentum*.5);
  }
  function realisticScore(home,away){
    const hp=teamRealismPower(home)+(home===S.club?4.0:2.2), ap=teamRealismPower(away)+(away===S.club?3.4:0);
    const diff=(hp-ap);
    const upset=(Math.random()-.5)*14, formSwing=(Math.random()-.5)*8;
    const tempoHome=home===S.club?(S.tactics.tempo-55)*.012:0;
    const tempoAway=away===S.club?(S.tactics.tempo-55)*.012:0;
    let hx=1.28+(diff+upset+formSwing)*.032+tempoHome-tempoAway;
    let ax=1.12-(diff+upset+formSwing)*.027+tempoAway*.7+((Math.random()-.5)*.12);
    const chaos=Math.random();
    if(chaos>.82){hx*=1.28;ax*=1.24;}
    else if(chaos<.10){hx*=.72;ax*=.70;}
    hx=clamp(hx,.22,4.2); ax=clamp(ax,.18,3.9);
    const poisson=lambda=>{const L=Math.exp(-lambda);let k=0,p=1;while(p>L&&k<9){k++;p*=Math.random()}return Math.max(0,k-1)};
    let hg=poisson(hx),ag=poisson(ax);
    // Wider, football-like score distribution: 0-0 through 4-3 are all genuinely possible.
    if(Math.random()<.035){ if(Math.random()<.5)hg+=2; else ag+=2; }
    if(Math.random()<.018){ hg=Math.min(6,hg+3); }
    if(Math.random()<.018){ ag=Math.min(6,ag+3); }
    hg=Math.min(6,hg);ag=Math.min(6,ag);
    const key=home+'|'+away;
    if(!S._lastScoreByFixture)S._lastScoreByFixture={};
    const previous=S._lastScoreByFixture[key];
    if(previous===hg+'-'+ag){
      const alternatives=[[0,0],[0,1],[1,0],[1,1],[2,0],[0,2],[2,1],[1,2],[2,2],[3,0],[0,3],[3,1],[1,3],[3,2],[2,3],[4,1],[1,4],[4,2],[2,4],[3,3],[4,3],[3,4]];
      const viable=alternatives.filter(x=>x[0]+'-'+x[1]!==previous);
      const alt=viable[Math.floor(Math.random()*viable.length)];hg=alt[0];ag=alt[1];
    }
    S._lastScoreByFixture[key]=hg+'-'+ag;
    return [hg,ag];
  }
  function playerMatchRatings(hg,ag,home,away){
    if(home!==S.club&&away!==S.club)return;
    const won=(home===S.club&&hg>ag)||(away===S.club&&ag>hg), draw=hg===ag;
    const ids=new Set((S.lineup||[]).filter(Boolean));
    let best=null,bestR=-1;
    S.players.forEach(p=>{
      ensurePlayerData(p);
      const starter=ids.has(p.id)&&p.status!=='loaned'&&!(p.injury?.days>0)&&!(p.suspension>0);
      if(!starter){p.benchStreak=(p.benchStreak||0)+1;p.morale=clamp((p.morale||65)-(p.benchStreak>=4?.35:.08),15,95);return;}
      const tactical=(S.tactics.press>80&&['POR','DC'].includes(p.pos))?.08:0;
      let rating=6.45+(won?.85:draw?.18:-.55)+r(-.65,.85)+((p.form||7)-7)*.18+tactical-(p.fatigue||0)*.012;
      rating=clamp(rating,4.8,9.6);
      p.seasonStats=p.seasonStats||{};p.seasonStats.ratingSum=(p.seasonStats.ratingSum||0)+rating;p.seasonStats.lastRating=rating;
      p.matchRatings=p.matchRatings||[];p.matchRatings.unshift(rating);p.matchRatings=p.matchRatings.slice(0,10);
      p.form=clamp((p.form||7)+(rating>=7.5?.22:rating<6.2?-.28:.03),5,9.6);
      p.morale=clamp((p.morale||65)+(rating>=7.5?1.2:rating<6.2?-1.5:.15),15,95);
      p.benchStreak=0;
      if(rating>=8.2&&p.ovr<p.pot&&Math.random()<.25)p.ovr++;
      if(rating<=5.7&&Math.random()<.16)p.ovr=Math.max(45,p.ovr-1);
      if(rating>bestR){bestR=rating;best=p;}
    });
    return best;
  }
  function realisticEvents(home,away,hg,ag){
    const e=[];
    for(let i=0;i<hg;i++)e.push({m:rr(4,86),type:'goal',txt:`⚽ ${home}${home===S.club?' · rete della tua squadra':''}`});
    for(let i=0;i<ag;i++)e.push({m:rr(4,86),type:'goal',txt:`⚽ ${away}${away===S.club?' · rete della tua squadra':''}`});
    const cards=rr(1,5);for(let i=0;i<cards;i++)e.push({m:rr(18,88),type:'card',txt:'🟨 Ammonizione'});
    if(Math.random()<.12)e.push({m:rr(40,82),type:'card',txt:'🟥 Espulsione'});
    if(Math.random()<.72)e.push({m:rr(55,82),type:'change',txt:'🔄 Cambio tattico / sostituzione'});
    return e.sort((a,b)=>a.m-b.m).concat([{m:90,type:'minute',txt:`⏱️ Finale: ${home} ${hg}-${ag} ${away}`}]);
  }
  function updateRealismAfterMatch(home,away,hg,ag,mine){
    realismInit();
    const gf=home===S.club?hg:ag,ga=home===S.club?ag:hg,won=gf>ga,lost=gf<ga;
    const xgF=clamp(.75+gf*.48+(teamRealismPower(S.club)-teamPower(mine.home===S.club?mine.away:mine.home))*.04+r(-.35,.45),.15,4.5);
    const xgA=clamp(.70+ga*.48-(teamRealismPower(S.club)-teamPower(mine.home===S.club?mine.away:mine.home))*.035+r(-.35,.45),.15,4.5);
    S.realism.xgFor+=xgF;S.realism.xgAgainst+=xgA;S.realism.shotsFor+=rr(6,19);S.realism.shotsAgainst+=rr(4,16);
    if(ga===0)S.realism.cleanSheets++;
    S.realism.momentum=clamp(S.realism.momentum+(won?1.1:lost?-1.35:.15),-6,6);
    S.realism.morale=clamp(S.realism.morale+(won?2.1:lost?-2.3:.3),25,95);
    S.realism.dressingRoom=clamp(S.realism.dressingRoom+(won?1.4:lost?-1.6:.2),25,95);
    S.realism.tacticalFamiliarity=clamp(S.realism.tacticalFamiliarity+.45,45,100);
    S.realism.boardPressure=clamp((S.board.target||4)-(rank())>0?S.realism.boardPressure+1.2:S.realism.boardPressure-.8,0,100);
    S.realism.mediaPressure=clamp(S.realism.mediaPressure+(lost?2.5:won?-1.2:.2),0,100);
    const headlines=won?['Il piano del mister funziona: vittoria meritata.','Spogliatoio compatto e fiducia in crescita.']:lost?['Pressione sul tecnico dopo una prestazione deludente.','Il mercato torna al centro del dibattito.']:['Equilibrio in campo: un punto che muove la classifica.'];
    S.realism.lastPress=headlines[rr(0,headlines.length-1)];
    S.news.unshift('🗞️ '+S.realism.lastPress);
    if(S.realism.boardPressure>75)S.news.unshift('⚠️ Il consiglio aumenta la pressione sulla panchina.');
  }
  function matchStats(home,away,hg,ag){
    const hp=teamRealismPower(home),ap=teamRealismPower(away),total=Math.max(1,hp+ap);
    const possession=clamp(Math.round(50+(hp-ap)*.65+r(-6,6)),28,72);
    const shots=Math.max(hg+2,rr(7,19)), opp=Math.max(ag+2,rr(6,18));
    return {shots,shotsOnTarget:clamp(Math.round(shots*.42+r(-1,2)),1,shots),opponentShots:opp,opponentShotsOnTarget:clamp(Math.round(opp*.36+r(-1,2)),1,opp),possession,corners:rr(2,10),xg:clamp(.35+hg*.48+r(.05,.9),.2,4.5),opponentXg:clamp(.35+ag*.48+r(.05,.9),.2,4.5)};
  }
  function realisticPlayMatchday(){
    if(S.simBusy)return;const fixtures=S.schedule[S.match]||[];if(!fixtures.length){finishSeason();return;}
    realismInit();S.simBusy=true;
    const scores=fixtures.map(g=>{const sc=realisticScore(g.home,g.away);return {...g,score:sc};});
    const mine=scores.find(g=>g.home===S.club||g.away===S.club)||scores[0];
    const events=realisticEvents(mine.home,mine.away,mine.score[0],mine.score[1]);
    scores.forEach(g=>applyResult(g.home,g.away,g.score[0],g.score[1]));
    updatePlayerSeasonStats(mine.home,mine.away,mine.score[0],mine.score[1]);
    const mvp=playerMatchRatings(mine.score[0],mine.score[1],mine.home,mine.away);
    processMatchFitness();updateMorale();financialMatchResult(mine.home,mine.away,mine.score[0],mine.score[1]);
    const injuries=maybeInjuries();if(injuries.length){S.realism.injuries+=injuries.length;S.news.unshift('🏥 Infermeria: '+injuries.join(' · '));}
    updateRealismAfterMatch(mine.home,mine.away,mine.score[0],mine.score[1],mine);
    boardUpdate();
    const stats=matchStats(mine.home,mine.away,mine.score[0],mine.score[1]);
    S.lastMatch={...mine,events,stats,mvp:mvp?.name||'—'};
    S.results[S.match]=`${mine.home} ${mine.score[0]}-${mine.score[1]} ${mine.away}`;

<script>

  function addStory14(text){dynastyInit();S.dynasty.seasonStory.unshift(text);S.dynasty.seasonStory=S.dynasty.seasonStory.slice(0,80);S.news.unshift(text);}
  function managerSeasonProgress(){return S.schedule?.length?S.match/S.schedule.length:0;}
  function updateRelationships14(){

    (S.players||[]).forEach(p=>{ensurePlayerData(p); const key=String(p.id); let r=S.dynasty.relationships[key]??65;

  function chooseTraining14(focus,load){

  function trainingPanel14(){

  function decision14(){

      player:{title:'👤 Colloquio nello spogliatoio',text:'Un giocatore importante chiede garanzie sul proprio minutaggio.',opts:[['Prometti un ruolo centrale','+morale','promessa'],['Prometti meritocrazia','+fiducia','meritocrazia'],['Rifiuta le pressioni','+autorità','autorita']]},

  function renderDecision14(){

  }
  function esc14(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function resolveDecision14(i){
    dynastyInit();const d=S.dynasty,p=d.pendingDecision;if(!p)return;const choice=p.choices.opts[i];let msg='';

    if(p.type==='player'){if(choice[2]==='promessa'){const p1=S.players.find(x=>(x.benchStreak||0)>=2);if(p1){p1.morale=clamp14(p1.morale+10,0,100);p1.role='titolare';}}if(choice[2]==='meritocrazia')S.realism.dressingRoom=clamp14(S.realism.dressingRoom+5,0,100);if(choice[2]==='autorita')S.dynasty.boardTrust=clamp14(S.dynasty.boardTrust+3,0,100);}
    if(p.type==='board'){if(choice[2]==='budget'){S.budget+=Math.round(teamPower(S.club)*85000);S.dynasty.boardTrust=clamp14(S.dynasty.boardTrust-2,0,100);}if(choice[2]==='giovani'){S.dynasty.clubVision='giovani';S.dynasty.boardTrust=clamp14(S.dynasty.boardTrust+4,0,100);}if(choice[2]==='risultati'){S.board.target=Math.max(1,(S.board.target||4)-1);S.dynasty.boardTrust=clamp14(S.dynasty.boardTrust-3,0,100);}}
    if(p.type==='transfer'){const p1=S.players.find(x=>x.status==='prima squadra'&&x.age>23);if(p1){if(choice[2]==='rinnovo'){p1.morale=clamp14(p1.morale+7,0,100);p1.contractEnd=`${S.season+2}-06-30`;}if(choice[2]==='vendita')S.dynasty.transferRumours.unshift(`${p1.name}: interesse crescente di club rivali.`);if(choice[2]==='incedibile')S.realism.dressingRoom=clamp14(S.realism.dressingRoom+3,0,100);}}

    d.lastDecision=`${p.choices.title}: ${choice[0]}`;d.pendingDecision=null;addStory14(`🧠 Decisione: ${choice[0]}.`);closeModal();render();
  }
  function preMatch14(){
    dynastyInit();const next=S.schedule?.[S.match]?.find(g=>g.home===S.club||g.away===S.club);if(!next)return V14_OLD_MATCH();

  function preMatchChoice14(mode){

  }
  function generateJobOffers14(){
    dynastyInit();if(S.dynasty.jobOffers.length||S.dynasty.managerReputation<65)return;const pool=[];for(const [c,pow] of Object.entries(power)){if(c===S.club)continue;if(Math.abs(pow-S.dynasty.managerReputation)<18)pool.push(c);}if(pool.length){const c=pool[rr14(0,pool.length-1)];S.dynasty.jobOffers.push({club:c,league:'Nuova sfida',salary:Math.round(teamPower(c)*9000),season:S.season});addStory14(`📩 ${c} ha chiesto informazioni sul tuo profilo.`);}}
  function acceptJob14(i){dynastyInit();const o=S.dynasty.jobOffers[i];if(!o)return;const old=S.club;S.history.unshift({club:old,league:S.league,date:`Lasciato il club · stagione ${S.season}`});S.club=o.club;for(const cc of Object.keys(divisions)){for(const dd of Object.keys(divisions[cc]||{})){if((divisions[cc][dd]||[]).includes(o.club)){S.country=cc;S.division=dd;S.league=cc+' — '+dd;}}}S.rep=clamp14(S.rep+3,1,99);S.dynasty.managerYears++;S.dynasty.jobOffers=[];S.news.unshift(`🧳 Nuova avventura: hai accettato la panchina di ${o.club}.`);closeModal();render();Promise.allSettled([getTeamData(o.club),loadRealRoster(o.club,true)]).then(rs=>{if(rs[1].status==='fulfilled'&&rs[1].value?.length){S.players=rs[1].value.map(ensurePlayerData);S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);S.tacticalSelected=null;}initTable();render();});}
  function jobOffersPanel14(){dynastyInit();return `<div class="screen"><div class="eyebrow">MANAGER MARKET</div><h2>🧳 Opportunità di carriera</h2><p class="muted">La reputazione apre porte. Non tutte le offerte arrivano subito.</p>${S.dynasty.jobOffers.map((o,i)=>`<div class="jobOffer"><div class="team"><span style="flex:1"><b>${esc14(o.club)}</b><br><small class="muted">Progetto: ${esc14(o.league)} · stagione ${o.season}</small></span><button class="primary" onclick="acceptJob14(${i})">Accetta</button></div></div>`).join('')||'<div class="emptyState">Nessuna offerta al momento. Continua a costruire la tua reputazione.</div>'}</div>`}
  function dynastyHome14(){

    const base=V14_OLD_HOME();

  function career14(){

  window.home=dynastyHome14;window.career=career14;window.match=preMatch14;window.decision14=decision14;window.resolveDecision14=resolveDecision14;window.preMatchChoice14=preMatchChoice14;window.chooseTraining14=chooseTraining14;window.acceptJob14=acceptJob14;

 function myMatchOnDate(date){return (S.schedule||[]).findIndex(round=>round.some(g=>g.date===iso(date)&&(g.home===S.club||g.away===S.club))) }

l><label class="small">A<input id="v33to" type="date" value="'+S.currentDate+'"></label></div><button class="blue v33Action" onclick="v33AdvanceRange()">⏩ SIMULA FINO ALLA DATA</button></div><div class="screen"><h3>🧠 Allenamento del giorno</h3><div class="v33DayActions">'+[['balanced','⚖️ Equilibrato'],['tactical','🎯 Tattico'],['attack','⚔️ Attacco'],['defense','🛡️ Difesa'],['physical','💪 Fisico'],['recovery','🧘 Recupero']].map(x=>'<button onclick="v33Training(&quot;'+x[0]+'&quot;)" class="'+(V.training===x[0]?'primary':'')+'">'+x[1]+'</button>').join('')+'</div><p class="muted">Il carico scelto viene applicato ogni giorno durante la simulazione.</p></div><div class="screen"><h3>🔭 Scouting</h3><p class="muted">Lo staff continua a lavorare mentre il tempo passa.</p>'+((S.scouting?.reports||[]).slice(0,4).map(x=>'<div class="row"><span>🔎 '+esc(x.name)+' · '+x.pos+'</span><b>OVR '+x.ovr+'</b></div>').join('')||'<p class="muted">Nessun nuovo report.</p>')+'</div></div></div>'}

<script id="v36-realism-data-simulation">
(function(){

  async function v36fetch(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
  function v36norm(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
  async function v36Team(club){

    return null;
  }
  function v36mapPos(pos){return typeof posMap==='function'?posMap(pos):'CC'}
  function v36player(x,club,i){const pos=v36mapPos(x.strPosition||x.strPosition2);let age=ageFromDate(x.dateBorn);if(!Number.isFinite(age))age=25;const ovr=baseOvr(pos,i,S.division,club);return ensurePlayerData({id:x.idPlayer||('api_'+i),apiId:x.idPlayer,name:x.strPlayer||x.strPlayerAlternate||'Giocatore',pos,ovr,pot:clamp(ovr+Math.max(2,Math.floor((29-age)/3)),ovr,94),age,team:club,nationality:x.strNationality||'',height:x.strHeight||'',weight:x.strWeight||'',thumb:x.strThumb||'',cutout:x.strCutout||'',value:Math.max(1000000,ovr*ovr*10000),dataFallback:false,_gameGeneratedOvr:true});}

    if(raw.length<11)throw Error('Rosa live incompleta');

    list=normalizeRosterLevel(list,club,S.division||divisionForClub(club));
    rosterCache[club]=list;teamCache[club]={id:t.idTeam,name:t.strTeam,badge:t.strBadge||t.strTeamBadge||'',country:t.strCountry||'',league:t.strLeague||''};

  async function v36SyncCurrentClub(){

      const list=await v36LoadRoster(S.club);
      S.players=list.map(ensurePlayerData);S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);initContracts(S.players);
      S.news.unshift('✅ Rosa verificata: ogni giocatore appartiene al club selezionato.');S.social.unshift('📱 @DataCheck: rosa ufficiale sincronizzata per '+S.club+'.');render();
    }catch(e){v36status('⚠️ Dati live non disponibili: uso la rosa salvata senza mischiare club.');}
  }
  /* Never trust a stale mixed cache: force a live roster whenever a career starts. */
  const oldStart=window.start;
  window.start=function(...args){oldStart.apply(this,args);setTimeout(v36SyncCurrentClub,80)};
  /* Rehydrate missing photos without blocking the roster. */
  window.v36RefreshPhotos=async function(){if(!S?.players?.length)return;let changed=false;for(const p of S.players){if(!p.thumb&&!p.cutout){const before=p.thumb+p.cutout;await hydratePlayerMedia(p);changed ||= before!==(p.thumb+p.cutout);}}if(changed){rosterCache[S.club]=S.players;try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache))}catch(e){}render();}};
  /* Full career timeline: one day = training, recovery, market, scouting, contracts, news, then fixtures. */

<script id="v37-match-simulation">
(function(){
  // V37: richer score model + animated career timeline.
  function v37Clamp(n,a,b){return Math.max(a,Math.min(b,n));}
  function v37Poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;while(p>L&&k<10){k++;p*=Math.random();}return Math.max(0,k-1);}
  function v37Score(home,away){
    const hp=typeof teamRealismPower==='function'?teamRealismPower(home):teamPower(home);
    const ap=typeof teamRealismPower==='function'?teamRealismPower(away):teamPower(away);
    const diff=(hp-ap);
    const homeAdv=home===S.club?3.8:2.6;
    const awayBoost=away===S.club?2.4:0;
    const noise=(Math.random()-0.5)*10;
    let xh=1.38 + diff*.025 + homeAdv*.035 + noise*.035;
    let xa=1.18 - diff*.021 + awayBoost*.025 - noise*.025;
    if(home===S.club) xh += ((S.tactics?.tempo||55)-55)*.009;
    if(away===S.club) xa += ((S.tactics?.tempo||55)-55)*.006;
    const chaos=Math.random();
    if(chaos>.90){xh*=1.38;xa*=1.30;} else if(chaos<.07){xh*=.68;xa*=.66;}
    xh=v37Clamp(xh,.28,4.8); xa=v37Clamp(xa,.22,4.5);
    let hg=v37Poisson(xh),ag=v37Poisson(xa);
    if(Math.random()<.035){if(Math.random()<.5)hg+=2;else ag+=2;}
    if(Math.random()<.012)hg+=3;
    if(Math.random()<.012)ag+=3;
    return [Math.min(7,hg),Math.min(7,ag)];
  }
  window.v37Score=v37Score;
  // Replace the score generator used by the daily engine through a global shim where possible.
  window.simScore=function(home,away){return v37Score(home,away);};

  function v37DayLabel(d){return typeof fmt==='function'?fmt(d):d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});}
  function v37Overlay(){
    let x=document.getElementById('v37SimOverlay');
    if(!x){x=document.createElement('div');x.id='v37SimOverlay';x.innerHTML='<div class="v37SimBox"><div class="v37Live">● SIMULAZIONE LIVE</div><div id="v37SimDate"></div><div id="v37SimAction"></div><div class="v37Progress"><i id="v37ProgressBar"></i></div><div id="v37SimLog"></div></div>';document.body.appendChild(x);}
    return x;
  }
  function v37Show(date,action,progress,log){const o=v37Overlay();o.style.display='flex';document.getElementById('v37SimDate').textContent=v37DayLabel(date);document.getElementById('v37SimAction').textContent=action;document.getElementById('v37ProgressBar').style.width=progress+'%';document.getElementById('v37SimLog').innerHTML='<div>'+String(log||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>';}
  function v37Hide(){const o=document.getElementById('v37SimOverlay');if(o)o.style.display='none';}
  function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

  function v37MatchForDate(date){
    const isoDate=typeof iso==='function'?iso(date):date.toISOString().slice(0,10);
    return (S.schedule||[]).findIndex(round=>round.some(g=>g.date===isoDate&&(g.home===S.club||g.away===S.club)));
  }
  function v37SimRound(idx){
    const fixtures=S.schedule[idx]||[]; if(!fixtures.length)return null;
    const scores=fixtures.map(g=>{const sc=v37Score(g.home,g.away);return {...g,score:sc};});
    scores.forEach(g=>applyResult(g.home,g.away,g.score[0],g.score[1]));
    const mine=scores.find(g=>g.home===S.club||g.away===S.club);
    if(mine){
      updatePlayerSeasonStats(mine.home,mine.away,mine.score[0],mine.score[1]);
      processMatchFitness();updateMorale();financialMatchResult(mine.home,mine.away,mine.score[0],mine.score[1]);
      const inj=maybeInjuries();if(inj.length)S.news.unshift('🏥 '+inj.join(' · '));
      S.results[idx]=mine.home+' '+mine.score[0]+'-'+mine.score[1]+' '+mine.away;
      const stats=typeof matchStats==='function'?matchStats(mine.home,mine.away,mine.score[0],mine.score[1]):{shots:0,shotsOnTarget:0,possession:50,corners:0,xg:1,opponentXg:1};
      const mvp=typeof playerMatchRatings==='function'?playerMatchRatings(mine.score[0],mine.score[1],mine.home,mine.away):null;
      const events=typeof realisticEvents==='function'?realisticEvents(mine.home,mine.away,mine.score[0],mine.score[1]):[];
      S.lastMatch={...mine,events,stats,mvp:mvp?.name||'—'};
      S.news.unshift('📺 Giornata '+(idx+1)+': '+S.results[idx]+' · MVP '+S.lastMatch.mvp);
      S.social.unshift('📱 @MatchdayLive: '+S.results[idx]);
      if(typeof boardUpdate==='function')boardUpdate();
    }
    S.match=Math.max(S.match,idx+1);
    return {mine,scores,events:mine&&S.lastMatch?S.lastMatch.events:[]};
  }
  async function v37AnimateMatch(result){
    if(!result?.mine)return;
    const events=(result.events||[]).filter(e=>e.m<90);
    v37Show(careerDate(),'⚽ Giornata '+(S.match)+' · partita in corso',92,'Entrano in campo…');

<script id="v39-roster-score-animation-fix">
(function(){
  const API39='https://www.thesportsdb.com/api/v1/json/123/';
  const sleep39=ms=>new Promise(r=>setTimeout(r,ms));
  const norm39=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  async function api39(path){const r=await fetch(API39+path,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
  function teamMatch39(teams,club){const t=norm39(club);return (teams||[]).filter(x=>!x.strSport||x.strSport==='Soccer').sort((a,b)=>{const A=norm39(a.strTeam),B=norm39(b.strTeam);const score=n=>n===t?100:(n.includes(t)||t.includes(n)?70:0);return score(B)-score(A)})[0]||null;}
  async function authoritativeRoster39(club){
    let team=null;
    const aliases=(window.teamAliases&&teamAliases[club])||[club];
    for(const q of aliases){try{const j=await api39('searchteams.php?t='+encodeURIComponent(q));team=teamMatch39(j.teams,club);if(team)break;}catch(e){}}
    if(!team?.idTeam)throw Error('Club non verificato');
    const j=await api39('lookup_all_players.php?id='+encodeURIComponent(team.idTeam));
    const raw=(j.player||[]).filter(x=>(!x.strSport||x.strSport==='Soccer')&&!isStaffEntry(x));
    if(raw.length<11)throw Error('Rosa live incompleta');
    const seen=new Set();
    const list=raw.map((x,i)=>{
      const id=x.idPlayer||('live_'+norm39(club)+'_'+i);
      if(seen.has(id))return null;seen.add(id);
      const pos=typeof posMap==='function'?posMap(x.strPosition||x.strPosition2):'CC';
      const age=typeof ageFromDate==='function'?ageFromDate(x.dateBorn):25;
      const ovr=typeof baseOvr==='function'?baseOvr(pos,i,S.division,club):70;
      return ensurePlayerData({id,apiId:x.idPlayer,name:x.strPlayer||x.strPlayerAlternate||'Giocatore',pos,ovr,pot:clamp(ovr+Math.max(2,Math.floor((29-age)/3)),ovr,94),age,team:club,nationality:x.strNationality||'',height:x.strHeight||'',weight:x.strWeight||'',thumb:x.strThumb||'',cutout:x.strCutout||'',value:Math.max(1000000,ovr*ovr*10000),dataFallback:false,_gameGeneratedOvr:true,_verifiedClubId:String(team.idTeam)});
    }).filter(Boolean);
    // Hard integrity check: no player from an older cached club can survive a live refresh.
    if(list.length<11)throw Error('Rosa non valida');
    list.forEach(p=>p.team=club);
    rosterCache[club]=list;teamCache[club]={id:team.idTeam,name:team.strTeam,badge:team.strBadge||team.strTeamBadge||'',country:team.strCountry||'',league:team.strLeague||''};
    try{localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));localStorage.setItem('fcm_team_cache_v11',JSON.stringify(teamCache));}catch(e){}
    return list;
  }
  window.v39RefreshAuthoritativeRoster=async function(){
    if(!S?.started||!S.club)return;
    try{
      status('🔐 Verifica ufficiale rosa di '+S.club+'…');
      const list=await authoritativeRoster39(S.club);
      S.players=list;S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);S.captain=S.lineup.find(Boolean);initContracts(S.players);
      // hydrate missing face photos in small batches so the UI stays responsive
      for(let i=0;i<S.players.length;i+=4){
        await Promise.all(S.players.slice(i,i+4).map(async p=>{if(!p.cutout&&!p.thumb)try{await hydratePlayerMedia(p)}catch(e){}}));
        if(typeof render==='function')render();
      }
      try{rosterCache[S.club]=S.players;localStorage.setItem('fcm_roster_cache_v12',JSON.stringify(rosterCache));}catch(e){}
      S.news.unshift('🔐 Rosa verificata live: '+S.players.length+' giocatori del '+S.club+'.');
      S.social.unshift('📸 @SquadCheck: foto e giocatori sincronizzati con il club.');
      render();status('✅ Rosa ufficiale verificata · '+S.players.length+' giocatori');
    }catch(e){
      // Never mix clubs as an offline fallback. Keep only players explicitly tagged to this club.
      const clean=(S.players||[]).filter(p=>p.team===S.club);
      S.players=clean;S.lineup=defaultLineup();S.bench=S.players.filter(p=>!S.lineup.includes(p.id)).slice(0,9).map(p=>p.id);
      render();status('⚠️ Rosa live non disponibile: nessun giocatore di un altro club verrà mischiato.');
    }
  };
  const oldStart39=window.start;
  window.start=async function(...args){
    // wipe stale mixed roster immediately; then load the selected club authoritatively
    const club=args[2];
    if(club){S.players=[];try{delete rosterCache[club]}catch(e){}}
    const r=oldStart39.apply(this,args);
    setTimeout(()=>window.v39RefreshAuthoritativeRoster(),120);
    return r;
  };
  // Force the squad button to use authoritative live data too.
  window.refreshRoster=window.v39RefreshAuthoritativeRoster;

  // Much wider, more varied football score model. 0-0/1-1 remain possible but are no longer the default.
  function poisson39(lambda){let L=Math.exp(-lambda),k=0,p=1;while(p>L&&k<10){k++;p*=Math.random();}return Math.max(0,k-1);}
  function score39(home,away){
    const hp=typeof teamRealismPower==='function'?teamRealismPower(home):teamPower(home);
    const ap=typeof teamRealismPower==='function'?teamRealismPower(away):teamPower(away);
    const diff=hp-ap, homeAdv=home===S.club?5.0:2.5, awayAdv=away===S.club?3.0:0;
    let xh=1.48+diff*.035+homeAdv*.055+(Math.random()-.5)*.38;

  async function verifyPlayerClubV45(x,team){

  async function loadV45(club,force=true){

  window.simScore=function(home,away){
    const a=home===S.club?lineupStrength():teamPower(home), b=away===S.club?lineupStrength():teamPower(away);

    let la=clamp(1.22-diff*.09+(formA-50)*.012+(tmA.attack||0)*.16-(tmH.defense||0)*.08,.45,3.7);

    const shock=Math.random();if(shock<.16){lh*=1.18;la*=1.18}else if(shock>.91){lh*=.78;la*=.78}

    if(hg===1&&ag===1&&Math.random()<.38){if(Math.random()<lh/(lh+la))hg=2;else ag=2;}
    if(hg===2&&ag===2&&Math.random()<.18){if(Math.random()<lh/(lh+la))hg=3;else ag=3;}
    return [hg,ag];
  };

})();

      'atleticomineiro':['atleticomineiro','atleticomg','atletico'], 'saopaulo':['saopaulo','saopaulofc'],

      'redbullbragantino':['redbullbragantino','bragantino']

  }

    if(!Array.isArray(list)||list.length<11)return false;

      if(!p||!p.name)return false;
      const key=norm(p.name); if(seen.has(key))return false; seen.add(key);

  }
  function preserveRoster(){

      const sc=t=>{const n=norm(t.strTeam),c=norm(club);let z=0;if(n===c)z+=5000;else if(n.includes(c)||c.includes(n))z+=2500;if(t.strBadge||t.strTeamBadge)z+=20;return z};return sc(b)-sc(a)

  async function loadRealClub(club){

    });

  }

<script id="v67-formation-and-roster-lock">
(function(){
  function norm67(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]/g,'');}
  function rebuild67(){
    if(!window.S||!S.started||!S.club)return;
    let players=Array.isArray(S.players)?S.players.filter(Boolean):[];
    const club=norm67(S.club);
    players=players.filter(p=>!p.team||norm67(p.team)===club);
    S.players=players;
    const ids=new Set(players.map(p=>String(p.id)));
    let line=Array.isArray(S.lineup)?S.lineup.filter(id=>ids.has(String(id))):[];
    const used=new Set(line.map(String));
    const want=(window.formations&&formations[S.formation])||['POR','DC','DC','TS','TD','CC','CC','AS','AD','ATT','ATT'];
    for(const pos of want){
      if(line.length>=11)break;
      const p=players.find(x=>!used.has(String(x.id)) && String(x.pos||'').toUpperCase()===String(pos).toUpperCase());
      if(p){line.push(p.id);used.add(String(p.id));}
    }
    for(const p of players){if(line.length>=11)break;if(!used.has(String(p.id))){line.push(p.id);used.add(String(p.id));}}

    S.captain=ids.has(String(S.captain))?S.captain:(S.lineup[0]||players[0]?.id||null);
  }

  const oldRender67=window.render;

  const oldStart67=window.start;
  window.start=function(){const r=oldStart67?oldStart67.apply(this,arguments):undefined;setTimeout(()=>{try{rebuild67();if(window.render)window.render()}catch(e){}},500);return r};
  setTimeout(()=>{try{rebuild67()}catch(e){}},1000);
