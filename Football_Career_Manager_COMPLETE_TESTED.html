async function getTeamData(name){if(teamCache[name]?.id)return teamCache[name];const names=teamAliases[name]||[name];for(const q of names){try{let j=await api('searchteams.php?t='+encodeURIComponent(q));let t=(j.teams||[]).find(x=>x.strSport==='Soccer')||(j.teams||[])[0];if(t){let d={id:t.idTeam,name:t.strTeam,badge:t.strBadge||t.strTeamBadge||'',country:t.strCountry||'',league:t.strLeague||''};teamCache[name]=d;localStorage.setItem('fcTeamCacheV5',JSON.stringify(teamCache));return d}}catch(e){}}throw new Error('team')}

  const pos=["POR","DC","DC","DC","DC","CC","CC","CC","AS","AD","TQ","ATT"];

  for(let i=out.length;i<23;i++){const o=66+(i%15);out.push(ensurePlayerData({id:i+1000,name:names[i%names.length],pos:pos[i%pos.length],ovr:o,age:19+(i%10),pot:Math.min(91,o+5+(i%8)),apps:0,g:0,a:0,form:7,value:o*o*9000,team:club,nationality:"Italia",thumb:"",cutout:"",dataFallback:true}));}

}

async function loadRealRoster(club,force=false){if(!force&&rosterCache[club]?.length)return rosterCache[club];let t=await getTeamData(club);let j=await api('lookup_all_players.php?id='+t.id);let raw=j.player||[];let list=raw.filter(x=>(x.strSport==='Soccer'||!x.strSport)&&!(x.strStatus||'').toLowerCase().includes('coach')&&!(x.strPosition||'').toLowerCase().includes('coach')).map((x,i)=>({id:i,name:x.strPlayer||x.strPlayerAlternate||'Giocatore',pos:posMap(x.strPosition||x.strPosition2),ovr:estimatedOvr({position:x.strPosition,nationality:x.strNationality},i),age:ageFromDate(x.dateBorn),pot:Math.min(94,estimatedOvr({position:x.strPosition,nationality:x.strNationality},i)+Math.max(1,Math.floor((29-ageFromDate(x.dateBorn))/3))),apps:0,g:0,a:0,form:7,value:Math.max(1000000,estimatedOvr({position:x.strPosition,nationality:x.strNationality},i)**2*10000),team:club,thumb:x.strThumb||'',cutout:x.strCutout||'',nationality:x.strNationality||''}));list=fillCompleteSquad(club,list);rosterCache[club]=list;localStorage.setItem('fcRosterCacheV5',JSON.stringify(rosterCache));return list}

function completeYouthRoster(){
  if(S.youth?.length>=23)return S.youth.map(ensurePlayerData);
  const positions=["POR","DC","DC","DC","DC","CC","CC","CC","AS","AD","TQ","ATT"];
  const arr=[];
  for(let i=0;i<23;i++){
    const age=15+(i%5), pos=positions[i%positions.length], ovr=52+(i%18);
    arr.push(ensurePlayerData({id:i,name:youthNames[i%youthNames.length]+(i>=youthNames.length?' '+(i+1):''),age,pos,ovr,pot:Math.min(92,ovr+15+(i%8)),team:age<=16?'U17':age===17?'U18':age===18?'U19':'Primavera',status:'vivaio',nationality:youthNationalities[i%youthNationalities.length],apps:0,g:0,a:0,form:7,value:ovr*ovr*5000}));
  }
  return arr;
}

function youth(){return completeYouthRoster();}

function makeSchedule(){
  const teams=[...clubs()]; const list=teams.length%2?teams.concat(['__BYE__']):teams.slice();
  const n=list.length, rounds=n-1, half=n/2, first=[];
  for(let r=0;r<rounds;r++){
    const games=[];
    for(let i=0;i<half;i++){const a=list[i],b=list[n-1-i];if(a!=='__BYE__'&&b!=='__BYE__')games.push({home:a,away:b});}
    first.push(games); list.splice(1,0,list.pop());
  }
  return first.concat(first.map(g=>g.map(x=>({home:x.away,away:x.home}))));
}
function initTable(){S.table={};clubs().forEach(c=>S.table[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});S.schedule=makeSchedule()}
function defaultLineup(){const f=S.formation;const pos=f==='4-3-3'?['POR','DC','DC','DC','DC','CC','CC','CC','AS','ATT','AD']:f==='4-2-3-1'?['POR','DC','DC','DC','DC','CC','CC','AS','TQ','AD','ATT']:f==='3-5-2'?['POR','DC','DC','DC','AS','CC','CC','CC','AD','ATT','ATT']:['POR','DC','DC','DC','DC','CC','CC','AS','AD','ATT','ATT'];const used=[];return pos.map(r=>{const p=S.players.find(x=>x.pos===r&&!used.includes(x.id))||S.players.find(x=>!used.includes(x.id));if(p)used.push(p.id);return p?p.id:null})}
async function refreshRoster(){try{status('⟳ Aggiornamento rosa reale…');S.players=await loadRealRoster(S.club,true);S.lineup=defaultLineup();render();status(`✅ Rosa aggiornata: ${S.players.length} giocatori`)}catch(e){status('⚠️ Dati reali non disponibili; la carriera resta giocabile')}}
function start(country,division,c){
  const fallback=fillCompleteSquad(c,makePlayers(c));
  S={...S,started:true,country,division,league:country+' — '+division,club:c,season:2026,match:0,month:8,budget:(power[c]||76)*1800000,rep:power[c]||60,players:fallback,youth:completeYouthRoster(),table:{},results:[],offers:[],history:[{club:c,league:country+' — '+division,date:'Agosto 2026'}],news:[`Sei il nuovo allenatore di ${c}.`],social:[`📰 @CalcioNews: ${c} presenta il nuovo allenatore.`],formation:'4-3-3',lineup:[],tab:'home',schedule:[],europe:'',cup:'',simBusy:false};
  initTable();S.lineup=defaultLineup();render();status('⚽ Carriera iniziata — caricamento dati reali in background…',3500);
  Promise.allSettled([getTeamData(c),loadRealRoster(c,true)]).then(rs=>{if(rs[0].status==='fulfilled')teamCache[c]=rs[0].value;if(rs[1].status==='fulfilled'&&rs[1].value?.length){S.players=rs[1].value.map(ensurePlayerData);S.lineup=defaultLineup();S.news.unshift(`✅ Rosa reale caricata: ${S.players.length} giocatori.`)}render();status(rs[1].status==='fulfilled'?`✅ Rosa pronta: ${S.players.length} giocatori`:'ℹ️ Carriera pronta; dati reali non disponibili.',3200)})
}
function simScore(home,away){const A=power[home]||74,B=power[away]||74;const hg=Math.max(0,Math.min(5,Math.round(.6+(A-B)/20+Math.random()*2.3)));const ag=Math.max(0,Math.min(5,Math.round(.5+(B-A)/22+Math.random()*2.1)));return[hg,ag]}
function applyResult(home,away,hg,ag){const H=S.table[home],A=S.table[away];if(!H||!A)return;H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;if(hg>ag){H.w++;H.pts+=3;A.l++;H.form.unshift('w');A.form.unshift('l')}else if(hg<ag){A.w++;A.pts+=3;H.l++;H.form.unshift('l');A.form.unshift('w')}else{H.d++;A.d++;H.pts++;A.pts++;H.form.unshift('d');A.form.unshift('d')}H.form=H.form.slice(0,5);A.form=A.form.slice(0,5)}
function liveEvents(home,away,hg,ag){const e=[];for(let i=0;i<hg;i++)e.push({m:12+i*17+Math.floor(Math.random()*9),type:'goal',txt:`⚽ Gol ${home}`});for(let i=0;i<ag;i++)e.push({m:18+i*16+Math.floor(Math.random()*10),type:'goal',txt:`⚽ Gol ${away}`});if(Math.random()<.55)e.push({m:Math.floor(20+Math.random()*60),type:'card',txt:'🟨 Ammonizione dopo un contrasto duro'});if(Math.random()<.25)e.push({m:Math.floor(55+Math.random()*25),type:'change',txt:'🔄 Cambio: il tecnico prova a cambiare l’inerzia'});e.push({m:90,type:'minute',txt:`⏱️ Finale: ${home} ${hg}-${ag} ${away}`});return e.sort((a,b)=>a.m-b.m)}
function updatePlayerSeasonStats(home,away,hg,ag){if(home!==S.club&&away!==S.club)return;const scored=home===S.club?hg:ag,conceded=home===S.club?ag:hg;const ids=new Set((S.lineup||[]).filter(x=>x!==null));S.players.forEach(p=>{if(!ids.has(p.id))return;ensurePlayerData(p);p.apps++;p.seasonStats.presenze++;p.seasonStats.titolarità++;p.seasonStats.minuti+=90;p.seasonStats.tiri+=Math.floor(Math.random()*4);p.seasonStats.intercetti+=p.pos==='DC'?Math.floor(Math.random()*3):Math.floor(Math.random()*2);p.seasonStats.gol+=p.pos==='ATT'&&Math.random()<scored*.12?1:0;p.seasonStats.assist+=Math.random()<scored*.08?1:0;p.seasonStats.cleanSheet+=p.pos==='POR'&&conceded===0?1:0;p.seasonStats.gialli+=Math.random()<.08?1:0;p.form=Math.max(5,Math.min(9.5,p.form+(scored>conceded?.15:scored<conceded?-.12:.02)));if(p.form>8&&p.ovr<p.pot&&Math.random()<.15)p.ovr++})}
async function playMatchday(){if(S.simBusy)return;const fixtures=S.schedule[S.match]||[];if(!fixtures.length){finishSeason();return}S.simBusy=true;const scores=fixtures.map(g=>{const sc=simScore(g.home,g.away);return{...g,score:sc}});const mine=scores.find(g=>g.home===S.club||g.away===S.club)||scores[0];openMatchCenter(mine,liveEvents(mine.home,mine.away,mine.score[0],mine.score[1]),scores);scores.forEach(g=>applyResult(g.home,g.away,g.score[0],g.score[1]));updatePlayerSeasonStats(mine.home,mine.away,mine.score[0],mine.score[1]);S.results[S.match]=`${mine.home} ${mine.score[0]}-${mine.score[1]} ${mine.away}`;S.news.unshift(`📺 Giornata ${S.match+1}: ${S.results[S.match]}`);S.social.unshift(`📱 @MatchdayLive: ${S.results[S.match]}`);S.match++;if(S.match===19)S.month=1;if(S.match>=S.schedule.length){setTimeout(()=>{closeMatchCenter();finishSeason()},900)}else{setTimeout(()=>{closeMatchCenter();S.simBusy=false;render()},900)}}
function openMatchCenter(my,events,scores){const m=document.getElementById('matchModal'),box=document.getElementById('matchBox');if(!m||!box)return;box.innerHTML=`<div class="eyebrow">MATCHDAY · LIVE CRONACA</div><div class="scoreboard"><div class="teamScore">${my.home}</div><div><span class="liveBadge">LIVE</span><div class="score">${my.score[0]} — ${my.score[1]}</div></div><div class="teamScore">${my.away}</div></div><div id="matchTimeline" class="timeline"></div><h3>Altri risultati</h3>${scores.filter(x=>x!==my).map(x=>`<div class="row">${x.home}<b>${x.score[0]}–${x.score[1]}</b>${x.away}</div>`).join('')}<button class="primary" onclick="closeMatchCenter()">Continua</button>`;m.style.display='flex';const tl=document.getElementById('matchTimeline');events.forEach((e,i)=>setTimeout(()=>{if(!tl)return;const d=document.createElement('div');d.className='event '+e.type;d.innerHTML=`<b>${e.m}'</b><span>${e.txt}</span>`;tl.appendChild(d)},i*180))}
function closeMatchCenter(){const m=document.getElementById('matchModal');if(m)m.style.display='none';S.simBusy=false}
function simulate(){if(S.simBusy)return;let n=Math.min(5,(S.schedule?.length||0)-S.match),i=0;const next=()=>{if(i++>=n)return;playMatchday();setTimeout(next,1200)};next()}
function calcEurope(pos){if(['Italia','Inghilterra','Spagna','Germania','Francia'].includes(S.country)){if(pos<=4)return'🌟 Champions League';if(pos<=6)return'🟠 Europa League';if(pos===7)return'🟢 Conference League'}if(['Olanda','Portogallo'].includes(S.country)){if(pos<=3)return'🌟 Champions League';if(pos<=5)return'🟠 Europa League';return'🟢 Conference League'}return''}
function promotionRelegation(){const o=['Serie D','Serie C','Serie B','Serie A'],i=o.indexOf(S.division);if(i<0)return;const pos=rank(),total=clubs().length;if(pos<=2&&i<o.length-1){S.division=o[i+1];S.league=S.country+' — '+S.division;S.news.unshift(`⬆️ PROMOZIONE: ${S.club} sale in ${S.division}.`)}else if(pos>total-3&&i>0){S.division=o[i-1];S.league=S.country+' — '+S.division;S.news.unshift(`⬇️ RETROCESSIONE: ${S.club} scende in ${S.division}.`)}}
function finishSeason(){const pos=rank();S.month=7;S.europe=calcEurope(pos);if(pos===1){S.news.unshift(`🏆 ${S.club} è campione di ${S.division}.`);S.social.unshift(`👑 @LeagueOfficial: ${S.club} campione!`);celebrate('league',S.division,'CAMPIONI!')}else S.news.unshift(`📋 Fine stagione: ${pos}° posto. ${S.europe||'Nessuna coppa europea.'}`);if(['Serie A','Premier League','LaLiga','Bundesliga','Ligue 1','Eredivisie','Primeira Liga'].includes(S.division))S.cup='Coppa nazionale — nuova stagione';promotionRelegation();S.history.unshift({club:S.club,league:S.league,date:`Fine stagione ${S.season} · ${pos}°`});S.season++;S.match=0;S.month=7;S.players.forEach(p=>{p.age++;p.form=7});S.youth=completeYouthRoster().map(p=>{p.age++;if(p.age>=19&&Math.random()<.3)p.status='promosso';if(p.ovr<p.pot&&Math.random()<.5)p.ovr++;if(Math.random()<.2)p.pot=Math.max(p.ovr,p.pot-1);return p});initTable();S.lineup=defaultLineup();S.simBusy=false;render()}

function rank(){return Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts).findIndex(x=>x[0]==S.club)+1}
function home(){const t=S.table[S.club]||{pts:0};return `<div class="screen hero"><div class="eyebrow">MANAGER OFFICE · MATCHDAY HUB</div><div class="teamHero">${safeImg(teamImg(S.club),'logo',S.club)}<div><h1 style="margin:0">${S.club}</h1><p class="muted">${S.league} · ${S.season}/${S.season+1}</p><span class="liveBadge">${S.simBusy?'MATCH IN CORSO':'STAGIONE LIVE'}</span></div></div><div class="stats" style="margin-top:16px"><div class="card"><div class="big">${money(S.budget)}</div><span class="muted">Budget</span></div><div class="card"><div class="big">${t.pts}</div><span class="muted">Punti</span></div><div class="card"><div class="big">${rank()}°</div><span class="muted">Posizione</span></div><div class="card"><div class="big">${S.rep}</div><span class="muted">Fiducia</span></div></div><div style="margin-top:14px"><button class="primary" onclick="match()">⚽ Simula giornata</button><button onclick="simulate()">⏩ Simula 5 giornate</button><button class="gold" onclick="go('market')">💼 Mercato</button></div></div><div class="grid2"><div class="screen"><h3>📺 Ultima cronaca</h3>${S.results.slice(-5).reverse().map(x=>`<div class="row">${x}</div>`).join('')||'<p class="muted">Il primo fischio deve ancora arrivare.</p>'}</div><div class="screen"><h3>📰 Ufficio stampa</h3>${S.news.slice(0,6).map(x=>`<div class="newsItem">${x}</div>`).join('')}</div></div>`}
function squad(){return `<div class="screen"><div class="sectionTitle"><div><h2>👥 Rosa <span class="realBadge">LIVE DATABASE</span></h2><p class="muted">${S.players.length} giocatori · clicca un giocatore per la scheda completa.</p></div><button class="blue" onclick="refreshRoster()">🔄 Aggiorna rosa reale</button></div>${S.players.map(p=>{ensurePlayerData(p);return `<div class="playerCard" onclick="openPlayer(${p.id})">${safeImg(p.cutout||p.thumb,'face',p.name)}<span style="flex:1"><b>${p.name}</b><br><small class="muted">${p.pos} · ${p.age} anni · 🌍 ${p.nationality||'—'} · ${p.height||'—'} · ${p.foot||'—'}</small></span><span class="rating">${p.ovr}</span></div>`}).join('')}</div>`}

async function loadPlayerProfile(p){
  if(!p.apiId)return p;
  try{
    const d=await api('lookupplayer.php?id='+encodeURIComponent(p.apiId));
    const x=d.players?.[0]; if(!x)return p;
    p.height=x.strHeight||p.height||'—';
    p.weight=x.strWeight||p.weight||'—';
    p.foot=x.strSide||x.strFoot||p.foot||'—';
    p.birthPlace=x.strBirthLocation||p.birthPlace||'—';
    p.nationality=x.strNationality||p.nationality||'—';
    p.agent=x.strAgent||p.agent||'—';
    p.attributes=p.attributes||makeAttributes(p);
    p.transferHistory=p.transferHistory||[];
    try{
      const ft=await api('lookupformerteams.php?id='+encodeURIComponent(p.apiId));
      p.transferHistory=(ft.formerteams||[]).map(t=>({season:t.strJoined||'',from:t.strFormerTeam||'',to:t.strTeam||'',fee:t.strJoined||'—'}));
    }catch(_){}
    try{
      const st=await api('lookupplayerstats.php?id='+encodeURIComponent(p.apiId));
      p.externalStats=st.playerstats||st.stats||[];
    }catch(_){}
    return p;
  }catch(_){return p}
}
function makeAttributes(p){
  const o=p.ovr||70, n=()=>Math.max(35,Math.min(99,o+Math.floor(Math.random()*15)-7));
  return {Velocità:n(),Tiro:n(),Passaggio:n(),Dribbling:n(),Difesa:n(),Fisico:n(),Mentalità:n(),Porta:p.pos==='POR'?Math.max(60,n()-5):20};
}
function ensurePlayerData(p){
  p.attributes=p.attributes||makeAttributes(p);
  p.seasonStats=p.seasonStats||{presenze:p.apps||0,titolarità:0,minuti:0,gol:p.g||0,assist:p.a||0,tiri:0,intercetti:0,cleanSheet:0,gialli:0,rossi:0,voto:7};
  p.transferHistory=p.transferHistory||[];
  return p;
}
async function openPlayer(id){
  let p=ensurePlayerData(S.players.find(x=>x.id===id));
  if(!p)return;
  modal('<div class="loadingCard">⏳ Caricamento scheda completa di '+p.name+'…</div>');
  p=await loadPlayerProfile(p);
  const attrs=Object.entries(p.attributes||{}).map(([k,v])=>`<div class="attr"><span>${k}</span><b>${v}</b></div>`).join('');
  const stats=Object.entries(p.seasonStats||{}).map(([k,v])=>`<div class="card"><div class="big">${v}</div><span class="muted">${k}</span></div>`).join('');
  const transfers=(p.transferHistory||[]).map(t=>`<div class="row"><span>${t.season||'—'} · ${t.from||'Svincolato'} → ${t.to||'—'}</span><b>${t.fee||'—'}</b></div>`).join('')||'<p class="muted">Storico non disponibile nella fonte.</p>';
  const photo=safeImg(p.cutout||p.thumb,'face',p.name);
  modal(`<div class="teamHero">${photo}<div><div class="eyebrow">PLAYER PROFILE</div><h2>${p.name}</h2><p>${p.pos} · ${p.age} anni · ${p.nationality||'Nazionalità n/d'}</p></div></div>
  <div class="profileGrid"><div class="screen"><h3>Attributi</h3>${attrs}</div><div class="screen"><h3>Dati fisici</h3><div class="row">Altezza <b>${p.height||'—'}</b></div><div class="row">Peso <b>${p.weight||'—'}</b></div><div class="row">Piede <b>${p.foot||'—'}</b></div><div class="row">Valore <b>${money(p.value||0)}</b></div><div class="row">Stipendio <b>${money((p.value||0)*.008)}</b></div></div></div>
  <h3>Statistiche stagione</h3><div class="stats">${stats}</div><h3>Storico trasferimenti</h3>${transfers}<br><button class="primary" onclick="closeModal()">Chiudi</button>`);
  S.players=S.players.map(x=>x.id===p.id?p:x);
  localStorage.setItem('fcRosterCacheV5',JSON.stringify(rosterCache));
}

function showPlayer(id){let p=S.players[id];modal(`<div class="player">${`<img class="face" data-img-kind="player" data-img-name="${p.name}" src="${avatarData(p.name,'face')}" alt="${p.name}">`}<h2>${p.name}</h2></div><p>${p.pos} · ${p.age} anni · ${p.team||S.club}</p><div class="stats"><div class="card"><div class="big">${p.ovr}</div>OVERALL</div><div class="card"><div class="big greenText">${p.pot}</div>POTENZIALE</div><div class="card"><div class="big">${p.apps}</div>PRESENZE</div><div class="card"><div class="big">${p.g}</div>GOL</div></div><button onclick="closeModal()">Chiudi</button>`)}
function formationPositions(){let f=S.formation;return f==="4-3-3"?[[50,90],[18,72],[39,77],[61,77],[82,72],[30,55],[50,60],[70,55],[18,27],[50,18],[82,27]]:f==="4-2-3-1"?[[50,90],[18,72],[39,77],[61,77],[82,72],[38,59],[62,59],[18,38],[50,32],[82,38],[50,17]]:f==="3-5-2"?[[50,90],[28,73],[50,77],[72,73],[10,50],[32,55],[50,57],[68,55],[90,50],[38,25],[62,25]]:[[50,90],[18,72],[39,77],[61,77],[82,72],[38,56],[62,56],[18,30],[82,30],[42,20],[62,20]]}
function tactics(){let pos=formationPositions();return `<div class="screen"><h2>🧠 Modulo e formazione</h2><p class="muted">Scegli il modulo e assegna un giocatore a ogni posizione. Le scelte restano salvate nella carriera.</p>${["4-3-3","4-2-3-1","3-5-2","4-4-2"].map(f=>`<button class="${S.formation==f?'primary':''}" onclick="setFormation('${f}')">${f}</button>`).join("")}<div class="pitch">${pos.map((xy,i)=>{let p=S.players.find(x=>x.id===S.lineup[i]);return `<div class="slot" style="left:${xy[0]}%;top:${xy[1]}%"><div class="playerdot">${p&&faceImg(p.name)?`<img src="${faceImg(p.name)}">`:i+1}</div><select onchange="setLineup(${i},this.value)"><option value="">Scegli giocatore</option>${S.players.map(x=>`<option value="${x.id}" ${p&&p.id===x.id?'selected':''}>${x.name} · ${x.pos}</option>`).join("")}</select></div>`}).join("")}</div></div>`}
function setFormation(f){S.formation=f;S.lineup=defaultLineup();render()}
function setLineup(i,id){S.lineup[i]=id===""?null:Number(id);render()}
function youthPage(){completeYouthRoster();const tiers=['U17','U18','U19','Primavera'];return `<div class="screen"><div class="eyebrow">ACADEMY · LONG TERM</div><h2>🌱 Vivaio</h2><p class="muted">Filiera completa. Il potenziale può salire o scendere in base a minuti, prestiti, forma e infortuni.</p>${tiers.map(t=>`<div class="youthTier"><h3>${t}</h3>${S.youth.filter(p=>p.team===t).map(p=>`<div class="row"><span><b>${p.name}</b><br><small class="muted">${p.pos} · ${p.age} anni · 🌍 ${p.nationality} · OVR ${p.ovr} · POT ${p.pot}</small></span><span><button class="green" onclick="promote(${p.id})">Promuovi</button><button onclick="loan(${p.id})">Prestito</button></span></div>`).join('')}</div>`).join('')}</div>`}
function promote(id){let p=S.youth[id];p.status="promosso";S.players.push({id:S.players.length,name:p.name,pos:p.pos,ovr:p.ovr,age:p.age,pot:p.pot,apps:0,g:0,a:0,form:7,value:p.ovr*p.ovr*6000,team:S.club});S.news.unshift(`${p.name} promosso in prima squadra.`);S.social.unshift(`🟢 @AcademyWatch: ${p.name} è stato promosso da ${S.club}.`);render()}
function loan(id){S.youth[id].status="prestito";S.news.unshift(`${S.youth[id].name} mandato in prestito.`);render()}
const transferPool=[["Kenan Yildiz","ATT",82,78000000,"Juventus"],["Nico Paz","CC",79,55000000,"Como"],["Scalvini","DC",82,52000000,"Atalanta"],["Bakayoko","AD",78,42000000,"PSV"],["Nusa","AS",77,35000000,"RB Leipzig"],["Osimhen","ATT",88,95000000,"Napoli"],["Wirtz","TQ",90,120000000,"Bayer Leverkusen"],["Gyokeres","ATT",88,90000000,"Sporting CP"],["Donnarumma","POR",88,70000000,"Paris Saint-Germain"]];
function market(){return `<div class="screen"><h2>💰 Mercato intelligente</h2><p>Budget: <b class="goldText">${money(S.budget)}</b> · Cerca per <b>nome, costo, squadra o ruolo</b>.</p><div class="searchbar"><input id="q" placeholder="🔎 Nome giocatore..." oninput="filterMarket()"><input id="max" type="number" placeholder="Costo max €" oninput="filterMarket()"><select id="teamFilter" onchange="filterMarket()"><option value="">Tutte le squadre</option>${[...new Set(transferPool.map(x=>x[4]))].map(t=>`<option>${t}</option>`).join("")}</select><select id="posFilter" onchange="filterMarket()"><option value="">Tutti i ruoli</option><option>POR</option><option>DC</option><option>CC</option><option>TQ</option><option>AS</option><option>AD</option><option>ATT</option></select></div><div id="marketResults"></div></div>`}
function filterMarket(){let q=(document.getElementById("q")?.value||"").toLowerCase(),max=Number(document.getElementById("max")?.value||Infinity),tm=document.getElementById("teamFilter")?.value||"",po=document.getElementById("posFilter")?.value||"";let a=transferPool.filter(p=>(!q||p[0].toLowerCase().includes(q))&&p[3]<=max&&(!tm||p[4]===tm)&&(!po||p[1]===po));document.getElementById("marketResults").innerHTML=a.map((p)=>`<div class="card row"><span class="player">${`<img class="face" data-img-kind="player" data-img-name="${p[0]}" src="${avatarData(p[0],'face')}" alt="${p[0]}">`}<span><b>${p[0]}</b><br><span class="muted">${p[1]} · OVR ${p[2]} · ${p[4]}</span></span></span><span><b class="goldText">${money(p[3])}</b><br><button class="primary" onclick="buyName('${p[0]}')">Acquista</button></span></div>`).join("")||"<p>Nessun giocatore trovato.</p>"}
function buyName(name){let p=transferPool.find(x=>x[0]===name);if(S.month!=1&&S.month!=7)return status("🛒 Mercato chiuso: gennaio o luglio.");if(S.budget<p[3])return status("💰 Budget insufficiente");S.budget-=p[3];S.players.push({id:S.players.length,name:p[0],pos:p[1],ovr:p[2],age:21,pot:p[2]+9,apps:0,g:0,a:0,form:7,value:p[3],team:S.club});S.news.unshift(`🚨 UFFICIALE: ${p[0]} è un nuovo giocatore di ${S.club}!`);S.social.unshift(`🔴 @TransferAlert: ${p[0]} ➡️ ${S.club} per ${money(p[3])}.`);celebrate("transfer",p[0],"BENVENUTO NELLA SQUADRA!");render()}
function calendar(){return `<div class="screen"><h2>📅 Calendario</h2>${Array.from({length:38},(_,i)=>`<div class="row"><span>G${i+1} · ${i%2?"✈️":"🏠"} ${clubs()[(i+3)%clubs().length]}</span><b>${S.results[i]||"—"}</b></div>`).join("")}</div>`}
function table(){let a=Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts);return `<div class="screen"><h2>🏆 ${S.league}</h2><table style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td class="team">${safeImg(teamImg(x[0]),"logo",x[0])}${x[0]}</td><td>${x[1].p}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td><b>${x[1].pts}</b></td></tr>`).join("")}</table></div>`}
function offers(){return `<div class="screen"><h2>📩 Offerte da altri club</h2>${S.offers.length?S.offers.map((o,i)=>`<div class="card team">${safeImg(teamImg(o.club),'logo',o.club)}<div><h3>${o.club}</h3><span class="muted">${o.league}</span><p>Reputazione richiesta: ${o.req}</p><button class="primary" onclick="accept(${i})">ACCETTA</button><button onclick="S.offers.splice(${i},1);render()">Rifiuta</button></div></div>`).join(""):`<p>Nessuna offerta disponibile.</p>`}<button onclick="offersNow()">Genera offerte</button></div>`}
function offersNow(){if(S.month!=1&&S.month<5){status("📩 Le offerte arrivano a gennaio o a fine stagione.");return}let all=[];for(const [co,ds] of Object.entries(divisions))for(const [d,cs] of Object.entries(ds))for(const c of cs)if(c!=S.club&&(power[c]||76)<=S.rep+7)all.push([co,d,c]);if(!all.length)return status("📩 Nessun club interessato.");let [co,d,c]=all[Math.floor(Math.random()*all.length)];S.offers.push({league:co+" — "+d,country:co,division:d,club:c,req:(power[c]||76)-5});S.tab="offers";render()}
function accept(i){let o=S.offers[i];start(o.country,o.division,o.club);S.news.unshift(`Hai accettato l'offerta del ${o.club}. Nuova avventura!`);render()}
function news(){return `<div class="grid2"><div class="screen"><h2>📰 News</h2>${S.news.slice(0,30).map((x,i)=>`<div class="newsItem"><b>${i==0?"FLASH":"NEWS"}</b> · ${x}</div>`).join("")}</div><div class="screen"><h2>📱 Social</h2>${S.social.slice(0,30).map(x=>`<div class="social">${x}</div>`).join("")||"Nessun post."}</div></div>`}

function cups(){const e=S.europe||'—';return `<div class="screen"><div class="eyebrow">TROFEI & QUALIFICAZIONE</div><h2>🏆 Coppe</h2><div class="cupGrid"><div class="card cupCard"><div>🇮🇹/🏆</div><h3>Coppa nazionale</h3><p class="muted">${S.cup||'Da giocare'}</p><button onclick="playCup()">Gioca turno</button></div><div class="card cupCard"><div>🌟</div><h3>Champions League</h3><p>${e.includes('Champions')?'Qualificato':'Non qualificato'}</p></div><div class="card cupCard"><div>🟠</div><h3>Europa League</h3><p>${e.includes('Europa')?'Qualificato':'Non qualificato'}</p></div><div class="card cupCard"><div>🟢</div><h3>Conference League</h3><p>${e.includes('Conference')?'Qualificato':'Non qualificato'}</p></div></div></div>`}
function playCup(){const ok=Math.random()<.58;S.cup=ok?'Passaggio del turno':'Eliminazione';S.news.unshift(`🏆 Coppa: ${S.club} — ${S.cup}.`);S.social.unshift(`📱 @CupWatch: ${S.club} ${S.cup.toLowerCase()}.`);if(ok)celebrate('cup','Coppa nazionale','PASSAGGIO DEL TURNO');render()}

function career(){return `<div class="screen"><h2>🧳 Storico carriera</h2>${S.history.map(x=>`<div class="row"><span class="team">${safeImg(teamImg(x.club),'logo',x.club)}<span><b>${x.club}</b><br><span class="muted">${x.league}</span></span></span><b>${x.date}</b></div>`).join("")}</div>`}
function cupCheck(){if(Math.random()<.12){let cups=["🏆 Coppa Italia","🌟 Champions League","🏆 Europa League","🏆 Conference League"];let cup=cups[Math.floor(Math.random()*cups.length)];S.news.unshift(`🏆 ${S.club} ha vinto ${cup}!`);S.social.unshift(`🔥 @FootballSocial: ${S.club} CAMPIONE! ${cup} conquistata!`);celebrate("cup",cup,"TROFEO CONQUISTATO!");return true}return false}
function match(){playMatchday()}
function celebrate(type,title,subtitle){let emoji=type==="transfer"?"🚨":type==="league"?"🏆":"🏆";document.getElementById("trophyBox").innerHTML=`<div class="cup">${emoji}</div><h1>${subtitle}</h1><h2>${title}</h2><p>Momento storico per <b>${S.club}</b>!</p><button class="primary" onclick="closeTrophy()">CONTINUA</button>`;document.getElementById("trophy").style.display="flex";let c=document.getElementById("confetti");c.innerHTML=Array.from({length:90},()=>`<i class="piece" style="left:${Math.random()*100}%;--c:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*1.2}s"></i>`).join("")}
function closeTrophy(){document.getElementById("trophy").style.display="none";document.getElementById("confetti").innerHTML=""}
function closeModal(){const d=document.getElementById('playerModal');if(d)d.remove();const m=document.getElementById('modal');if(m)m.style.display='none'}function modal(x){let old=document.getElementById('playerModal');if(old)old.remove();let d=document.createElement('div');d.className='trophy';d.style.display='flex';d.id='playerModal';d.innerHTML=`<div class="trophyBox">${x}</div>`;document.body.appendChild(d)}
const pages={home,squad,tactics,youth:youthPage,market,calendar,table,cups,offers,news,career};render();
if(S.started===false){}

</script></body></html>
