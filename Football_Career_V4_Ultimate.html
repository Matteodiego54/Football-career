or:#fff;border:1px solid #34404e;border-radius:10px;padding:11px}.pitch{position:relative;min-height:560px;border-radius:20px;border:2px solid #e8fff0;background:linear-gradient(#126c3e,#0c5a34);overflow:hidden;box-shadow:inset 0 0 0 30px #ffffff0a}.pitch:before{content:"";position:absolute;inset:8%;border:2px solid #ffffff55;border-radius:5px}.pitch:after{content:"";position:absolute;left:50%;top:8%;bottom:8%;border-left:2px solid #ffffff55}.slot{position:absolute;transform:translate(-50%,-50%);width:120px;text-align:center}.slot select{max-width:120px;background:#0c1118dd;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:6px;font-size:11px}.playerdot{width:38px;height:38px;border-radius:50%;margin:auto;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;border:3px solid #e32632;overflow:hidden}.playerdot img{width:100%;height:100%;object-fit:cover}.newsItem{padding:11px;border-bottom:1px solid #29313c}.social{background:#0d131b;border:1px solid #293442;border-radius:12px;padding:11px;margin:8px 0}.social b{color:#6db6ff}.trophy{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:100}.trophyBox{text-align:center;background:linear-gradient(145deg,#161d28,#0b0f15);border:2px solid var(--gold);border-radius:24px;padding:34px;max-width:520px;animation:pop .65s ease}.cup{font-size:92px;animation:bounce 1.2s infinite}.confetti{position:fixed;inset:0;pointer-events:none;z-index:101;overflow:hidden}.piece{position:absolute;top:-20px;width:9px;height:18px;background:var(--c);animation:fall 2.8s linear forwards}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}@keyframes bounce{50%{transform:translateY(-14px) rotate(5deg)}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes pulse{50%{box-shadow:0 0 30px #f0c75e88}}.champion{animation:pulse 1.2s infinite}.tabs{display:flex;gap:7px;overflow:auto}.small{font-size:1 let imgCache={};
try{imgCache=JSON.parse(localStorage.getItem('footballImageCacheV4')||'{}')}catch(e){imgCache={}}
function initials(name){return (name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function avatarData(name,type){let bg=type==='logo'?'#192b46':'#26313d',fg=type==='logo'?'#75b8ff':'#f3f6fa';let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="${bg}"/><stop offset="1" stop-color="#0b1017"/></linearGradient></defs><rect width="160" height="160" rx="${type==='logo'?28:80}" fill="url(#g)"/><text x="80" y="96" text-anchor="middle" font-family="Arial" font-size="54" font-weight="800" fill="${fg}">${initials(name)}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function teamImg(c){return imgCache['team:'+c]||avatarData(c,'logo')}
function faceImg(p){return imgCache['player:'+p]||avatarData(p,'face')}
async function resolveWikiImage(kind,name){let key=kind+':'+name;if(imgCache[key])return imgCache[key];let title=(kind==='team'?wikiTeamTitles[name]:wikiPlayerTitles[name])||name;try{if(kind==='team'&&!wikiTeamTitles[name]){let q=await fetch('https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch='+encodeURIComponent(name+' football club')+'&format=json&origin=*');if(q.ok){let sj=await q.json();title=sj.query?.search?.[0]?.title||title}}let r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));if(!r.ok)throw new Error('not found');let j=await r.json();let u=j.thumbnail?.source||j.originalimage?.source;if(u){imgCache[key]=u;localStorage.setItem('footballImageCacheV4',JSON.stringify(imgCache));return u}}catch(e){}return null}
async function hydrateImages(){let nodes=[...document.querySelectorAll('img[data-img-kind]')];await Promise.all(nodes.map(async img=>{let u=await resolveWikiImage(img.dataset.imgKind,img.dataset.imgName);if(u)img.src=u}))}
let S={started:false,country:"",division:"",league:"",club:"",season:2026,match:0,month:8,tab:"home",budget:0,rep:60,players:[],youth:[],table:{},results:[],offers:[],history:[],news:[],social:[],formation:"4-3-3",lineup:[]};

function money(n){return "€"+(n/1e6).toFixed(1)+"M"}
function clubs(){return divisions[S.country][S.division]||[]}
function makePlayers(c){let a=famous[c]||[];if(!a.length){let p=power[c]||76;a=[["Portiere","POR",p-2,28,p+2],["Difensore","DC",p-3,26,p+3],["Difensore 2","DC",p-4,24,p+4],["Centrocampista","CC",p-2,25,p+4],["Ala","AD",p-5,22,p+8],["Attaccante","ATT",p,27,p+5]]}return a.map((x,i)=>({id:i,name:x[0],pos:x[1],ovr:x[2],age:x[3],pot:x[4],apps:0,g:0,a:0,form:7,value:x[2]*x[2]*8000,team:c}))}
function youth(){return [["Talento U17",16,"CC",55,81,"U17"],["Promessa U18",17,"ATT",61,86,"U18"],["Stella Primavera",18,"AD",67,90,"Primavera"],["Difensore U17",16,"DC",54,79,"U17"],["Regista U18",17,"CC",59,84,"U18"]].map((x,i)=>({id:i,name:x[0],age:x[1],pos:x[2],ovr:x[3],pot:x[4],team:x[5],status:"vivaio"}))}
function initTable(){S.table={};for(const c of clubs())S.table[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}}
function defaultLineup(){let f=S.formation;let positions=f==="4-3-3"?["POR","DC","DC","DC","DC","CC","CC","CC","AS","ATT","AD"]:f==="4-2-3-1"?["POR","DC","DC","DC","DC","CC","CC","AS","TQ","AD","ATT"]:f==="3-5-2"?["POR","DC","DC","DC","AS","CC","CC","CC","AD","ATT","ATT"]:["POR","DC","DC","DC","DC","CC","CC","AS","AD","ATT","ATT"];let used=[];return positions.map(pos=>{let p=S.players.find(x=>x.pos===pos&&!used.includes(x.id))||S.players.find(x=>!used.includes(x.id));if(p)used.push(p.id);return p?p.id:null})}
function start(country,division,c){S={...S,started:true,country,division,league:country+" — "+division,club:c,season:2026,match:0,month:8,budget:(power[c]||76)*1800000,rep:power[c]||76,players:makePlayers(c),youth:youth(),table:{},results:[],offers:[],history:[{club:c,league:country+" — "+division,date:"Agosto 2026"}],news:[`Sei il nuovo allenatore di ${c}.`],social:[`📰 @CalcioNews: ${c} presenta il nuovo allenatore!`],formation:"4-3-3",lineup:[],tab:"home"};initTable();S.lineup=defaultLineup();render()}
function save(){localStorage.setItem("footballCareerV3",JSON.stringify(S));alert("Carriera V3 salvata!")}
function load(){let x=localStorage.getItem("footballCareerV3");if(x){let old=JSON.parse(x);S={...S,...old};S.players=S.players||[];S.youth=S.youth||[];S.news=S.news||[];S.social=S.social||[];S.offers=S.offers||[];S.history=S.history||[];S.formation=S.formation||'4-3-3';S.lineup=S.lineup||defaultLineup();S.tab='home';render()}else alert("Nessun salvataggio trovato.")}
function nav(){return `<nav>${[["home","🏠 Home"],["squad","👥 Rosa"],["tactics","🧠 Formazione"],["youth","🌱 Vivaio"],["market","💰 Mercato"],["calendar","📅 Calendario"],["table","🏆 Classifica"],["offers","📩 Offerte"],["news","📰 News & Social"],["career","🧳 Carriera"]].map(x=>`<button type="button" class="navBtn ${S.tab==x[0]?'primary':''}" data-tab="${x[0]}">${x[1]}</button>`).join("")}<button type="button" onclick="save()">💾</button><button type="button" onclick="load()">📂</button></nav>`}

function startScreen(){document.getElementById("app").innerHTML=`<div class="screen"><h1>⚽ FOOTBALL CAREER MANAGER <span class="pill">V4 ULTIMATE</span></h1><p class="muted">Una carriera completa: formazioni, mercato avanzato, divisioni, coppe, news, social, immagini e celebrazioni.</p><p class="muted small">Stemmi e foto reali vengono caricati da Wikipedia/Wikimedia Commons quando disponibili; se una pagina non ha immagine, compare un avatar elegante invece del cerchio nero.</p><h2>1️⃣ Paese</h2><div class="grid">${Object.keys(divisions).map(c=>`<button onclick="chooseCountry('${c}')">🌍 ${c}</button>`).join("")}</div><div id="startArea"></div></div>`}
function chooseCountry(c){let ds=Object.keys(divisions[c]);document.getElementById("startArea").innerHTML=`<h2>2️⃣ Divisione</h2><div class="tabs">${ds.map(d=>`<button onclick="chooseDivision('${c}','${d}')">${d}</button>`).join("")}</div><div id="clubs"></div>`}
function chooseDivision(c,d){let arr=divisions[c][d];document.getElementById("clubs").innerHTML=`<h2>3️⃣ Squadra</h2><div class="grid">${arr.map(x=>`<div class="card team">${`<img class="logo" data-img-kind="team" data-img-name="${x}" src="${avatarData(x,'logo')}" alt="${x}">`}<div><b>${x}</b><p class="muted">Forza ${power[x]||76}</p><button class="primary" onclick="start('${c}','${d}','${x}')">Inizia</button></div></div>`).join("")}</div>`}
function go(t){if(!pages[t])return;S.tab=t;render();window.scrollTo({top:0,behavior:'smooth'});if(t==='market')setTimeout(filterMarket,0)}
document.addEventListener('click',function(e){const b=e.target.closest('.navBtn');if(b){e.preventDefault();go(b.dataset.tab)}});
function rank(){return Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts).findIndex(x=>x[0]==S.club)+1}
function home(){return `<div class="screen hero"><div class="eyebrow">CAREER MODE · LIVE</div><h1>${`<img class="logo" data-img-kind="team" data-img-name="${S.club}" src="${avatarData(S.club,'logo')}" alt="${S.club}">`} ${S.club}</h1><p>${S.league} · Giornata ${S.match+1} · ${S.month==1?"🛒 Mercato di gennaio aperto":S.month>=5?"🏁 Fine stagione vicina":"🔥 Stagione in corso"}</p><div class="stats"><div class="card"><div class="big">${money(S.budget)}</div><span class="muted">Budget</span></div><div class="card"><div class="big">${S.table[S.club].pts}</div><span class="muted">Punti</span></div><div class="card"><div class="big">${rank()}°</div><span class="muted">Posizione</span></div><div class="card"><div class="big">${S.rep}</div><span class="muted">Reputazione</span></div></div><br><button class="primary" onclick="match()">⚽ Gioca partita</button><button onclick="simulate()">⏩ Simula 5</button><button class="gold" onclick="offersNow()">📩 Cerca offerte</button></div><div class="grid2"><div class="screen"><h3>📣 Ultimi risultati</h3>${S.results.slice(-6).reverse().map(x=>`<div class="row">${x}</div>`).join("")||"Nessuna partita."}</div><div class="screen"><h3>📰 Notizie</h3>${S.news.slice(0,7).map(x=>`<div class="newsItem">• ${x}</div>`).join("")}</div></div>`}
function squad(){return `<div class="screen"><h2>👥 Rosa</h2>${S.players.map(p=>`<div class="row player" onclick="showPlayer(${p.id})">${`<img class="face" data-img-kind="player" data-img-name="${p.name}" src="${avatarData(p.name,'face')}" alt="${p.name}">`}<span style="flex:1"><b>${p.name}</b><br><small class="muted">${p.pos} · ${p.age} anni · Forma ${p.form.toFixed(1)}</small></span><span><b>${p.ovr}</b> <span class="greenText">POT ${p.pot}</span></span></div>`).join("")}</div>`}
function showPlayer(id){let p=S.players[id];modal(`<div class="player">${`<img class="face" data-img-kind="player" data-img-name="${p.name}" src="${avatarData(p.name,'face')}" alt="${p.name}">`}<h2>${p.name}</h2></div><p>${p.pos} · ${p.age} anni · ${p.team||S.club}</p><div class="stats"><div class="card"><div class="big">${p.ovr}</div>OVERALL</div><div class="card"><div class="big greenText">${p.pot}</div>POTENZIALE</div><div class="card"><div class="big">${p.apps}</div>PRESENZE</div><div class="card"><div class="big">${p.g}</div>GOL</div></div><button onclick="closeModal()">Chiudi</button>`)}
function formationPositions(){let f=S.formation;return f==="4-3-3"?[[50,90],[18,72],[39,77],[61,77],[82,72],[30,55],[50,60],[70,55],[18,27],[50,18],[82,27]]:f==="4-2-3-1"?[[50,90],[18,72],[39,77],[61,77],[82,72],[38,59],[62,59],[18,38],[50,32],[82,38],[50,17]]:f==="3-5-2"?[[50,90],[28,73],[50,77],[72,73],[10,50],[32,55],[50,57],[68,55],[90,50],[38,25],[62,25]]:[[50,90],[18,72],[39,77],[61,77],[82,72],[38,56],[62,56],[18,30],[82,30],[42,20],[62,20]]}
function tactics(){let pos=formationPositions();return `<div class="screen"><h2>🧠 Modulo e formazione</h2><p class="muted">Scegli il modulo e assegna un giocatore a ogni posizione. Le scelte restano salvate nella carriera.</p>${["4-3-3","4-2-3-1","3-5-2","4-4-2"].map(f=>`<button class="${S.formation==f?'primary':''}" onclick="setFormation('${f}')">${f}</button>`).join("")}<div class="pitch">${pos.map((xy,i)=>{let p=S.players.find(x=>x.id===S.lineup[i]);return `<div class="slot" style="left:${xy[0]}%;top:${xy[1]}%"><div class="playerdot">${p&&faceImg(p.name)?`<img src="${faceImg(p.name)}">`:i+1}</div><select onchange="setLineup(${i},this.value)"><option value="">Scegli giocatore</option>${S.players.map(x=>`<option value="${x.id}" ${p&&p.id===x.id?'selected':''}>${x.name} · ${x.pos}</option>`).join("")}</select></div>`}).join("")}</div></div>`}
function setFormation(f){S.formation=f;S.lineup=defaultLineup();render()}
function setLineup(i,id){S.lineup[i]=id===""?null:Number(id);render()}
function youthPage(){return `<div class="screen"><h2>🌱 Primavera / U18 / U17</h2>${S.youth.map(p=>`<div class="row"><span><b>${p.name}</b><br><span class="muted">${p.team} · ${p.pos} · ${p.age} anni · OVR ${p.ovr} · POT ${p.pot}</span></span><span>${p.status=="vivaio"?`<button class="green" onclick="promote(${p.id})">Promuovi</button><button onclick="loan(${p.id})">Prestito</button>`:`<span class="pill">${p.status}</span>`}</span></div>`).join("")}</div>`}
function promote(id){let p=S.youth[id];p.status="promosso";S.players.push({id:S.players.length,name:p.name,pos:p.pos,ovr:p.ovr,age:p.age,pot:p.pot,apps:0,g:0,a:0,form:7,value:p.ovr*p.ovr*6000,team:S.club});S.news.unshift(`${p.name} promosso in prima squadra.`);S.social.unshift(`🟢 @AcademyWatch: ${p.name} è stato promosso da ${S.club}.`);render()}
function loan(id){S.youth[id].status="prestito";S.news.unshift(`${S.youth[id].name} mandato in prestito.`);render()}
const transferPool=[["Kenan Yildiz","ATT",82,78000000,"Juventus"],["Nico Paz","CC",79,55000000,"Como"],["Scalvini","DC",82,52000000,"Atalanta"],["Bakayoko","AD",78,42000000,"PSV"],["Nusa","AS",77,35000000,"RB Leipzig"],["Osimhen","ATT",88,95000000,"Napoli"],["Wirtz","TQ",90,120000000,"Bayer Leverkusen"],["Gyokeres","ATT",88,90000000,"Sporting CP"],["Donnarumma","POR",88,70000000,"Paris Saint-Germain"]];
function market(){return `<div class="screen"><h2>💰 Mercato intelligente</h2><p>Budget: <b class="goldText">${money(S.budget)}</b> · Cerca per <b>nome, costo, squadra o ruolo</b>.</p><div class="searchbar"><input id="q" placeholder="🔎 Nome giocatore..." oninput="filterMarket()"><input id="max" type="number" placeholder="Costo max €" oninput="filterMarket()"><select id="teamFilter" onchange="filterMarket()"><option value="">Tutte le squadre</option>${[...new Set(transferPool.map(x=>x[4]))].map(t=>`<option>${t}</option>`).join("")}</select><select id="posFilter" onchange="filterMarket()"><option value="">Tutti i ruoli</option><option>POR</option><option>DC</option><option>CC</option><option>TQ</option><option>AS</option><option>AD</option><option>ATT</option></select></div><div id="marketResults"></div></div>`}
function filterMarket(){let q=(document.getElementById("q")?.value||"").toLowerCase(),max=Number(document.getElementById("max")?.value||Infinity),tm=document.getElementById("teamFilter")?.value||"",po=document.getElementById("posFilter")?.value||"";let a=transferPool.filter(p=>(!q||p[0].toLowerCase().includes(q))&&p[3]<=max&&(!tm||p[4]===tm)&&(!po||p[1]===po));document.getElementById("marketResults").innerHTML=a.map((p)=>`<div class="card row"><span class="player">${`<img class="face" data-img-kind="player" data-img-name="${p[0]}" src="${avatarData(p[0],'face')}" alt="${p[0]}">`}<span><b>${p[0]}</b><br><span class="muted">${p[1]} · OVR ${p[2]} · ${p[4]}</span></span></span><span><b class="goldText">${money(p[3])}</b><br><button class="primary" onclick="buyName('${p[0]}')">Acquista</button></span></div>`).join("")||"<p>Nessun giocatore trovato.</p>"}
function buyName(name){let p=transferPool.find(x=>x[0]===name);if(S.month!=1&&S.month!=7)return alert("Mercato chiuso: gennaio o luglio.");if(S.budget<p[3])return alert("Budget insufficiente");S.budget-=p[3];S.players.push({id:S.players.length,name:p[0],pos:p[1],ovr:p[2],age:21,pot:p[2]+9,apps:0,g:0,a:0,form:7,value:p[3],team:S.club});S.news.unshift(`🚨 UFFICIALE: ${p[0]} è un nuovo giocatore di ${S.club}!`);S.social.unshift(`🔴 @TransferAlert: ${p[0]} ➡️ ${S.club} per ${money(p[3])}.`);celebrate("transfer",p[0],"BENVENUTO NELLA SQUADRA!");render()}
function calendar(){return `<div class="screen"><h2>📅 Calendario</h2>${Array.from({length:38},(_,i)=>`<div class="row"><span>G${i+1} · ${i%2?"✈️":"🏠"} ${clubs()[(i+3)%clubs().length]}</span><b>${S.results[i]||"—"}</b></div>`).join("")}</div>`}
function table(){let a=Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts);return `<div class="screen"><h2>🏆 ${S.league}</h2><table style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td class="team">${safeImg(teamImg(x[0]),"logo",x[0])}${x[0]}</td><td>${x[1].p}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td><b>${x[1].pts}</b></td></tr>`).join("")}</table></div>`}
function offers(){return `<div class="screen"><h2>📩 Offerte da altri club</h2>${S.offers.length?S.offers.map((o,i)=>`<div class="card team">${`<img class="logo" data-img-kind="team" data-img-name="${o.club}" src="${avatarData(o.club,'logo')}" alt="${o.club}">`}<div><h3>${o.club}</h3><span class="muted">${o.league}</span><p>Reputazione richiesta: ${o.req}</p><button class="primary" onclick="accept(${i})">ACCETTA</button><button onclick="S.offers.splice(${i},1);render()">Rifiuta</button></div></div>`).join(""):`<p>Nessuna offerta disponibile.</p>`}<button onclick="offersNow()">Genera offerte</button></div>`}
function offersNow(){if(S.month!=1&&S.month<5){alert("I club iniziano a contattarti a gennaio o verso fine stagione.");return}let all=[];for(const [co,ds] of Object.entries(divisions))for(const [d,cs] of Object.entries(ds))for(const c of cs)if(c!=S.club&&(power[c]||76)<=S.rep+7)all.push([co,d,c]);if(!all.length)return alert("Nessun club interessato.");let [co,d,c]=all[Math.floor(Math.random()*all.length)];S.offers.push({league:co+" — "+d,country:co,division:d,club:c,req:(power[c]||76)-5});S.tab="offers";render()}
function accept(i){let o=S.offers[i];start(o.country,o.division,o.club);S.news.unshift(`Hai accettato l'offerta del ${o.club}. Nuova avventura!`);render()}
function news(){return `<div class="grid2"><div class="screen"><h2>📰 News</h2>${S.news.slice(0,30).map((x,i)=>`<div class="newsItem"><b>${i==0?"FLASH":"NEWS"}</b> · ${x}</div>`).join("")}</div><div class="screen"><h2>📱 Social</h2>${S.social.slice(0,30).map(x=>`<div class="social">${x}</div>`).join("")||"Nessun post."}</div></div>`}
function career(){return `<div class="screen"><h2>🧳 Storico carriera</h2>${S.history.map(x=>`<div class="row"><span class="team">${`<img class="logo" data-img-kind="team" data-img-name="${x.club}" src="${avatarData(x.club,'logo')}" alt="${x.club}">`}<span><b>${x.club}</b><br><span class="muted">${x.league}</span></span></span><b>${x.date}</b></div>`).join("")}</div>`}
function cupCheck(){if(Math.random()<.12){let cups=["🏆 Coppa Italia","🌟 Champions League","🏆 Europa League","🏆 Conference League"];let cup=cups[Math.floor(Math.random()*cups.length)];S.news.unshift(`🏆 ${S.club} ha vinto ${cup}!`);S.social.unshift(`🔥 @FootballSocial: ${S.club} CAMPIONE! ${cup} conquistata!`);celebrate("cup",cup,"TROFEO CONQUISTATO!");return true}return false}
function match(){let opp=clubs()[(S.match+3)%clubs().length],home=S.match%2==0,A=power[S.club]||76,B=power[opp]||76;let us=Math.floor(Math.random()*3)+(Math.random()<A/B*.45?1:0),them=Math.floor(Math.random()*3)+(Math.random()<B/A*.4?1:0);us=Math.min(5,us);them=Math.min(5,them);S.results[S.match]=`${S.club} ${us}-${them} ${opp}`;let t=S.table[S.club],o=S.table[opp];t.p++;o.p++;t.gf+=us;t.ga+=them;o.gf+=them;o.ga+=us;if(us>them){t.w++;t.pts+=3;o.l++;S.rep++;S.news.unshift(`✅ Vittoria ${us}-${them} contro ${opp}.`);S.social.unshift(`🔥 @MatchDay: ${S.club} vince ${us}-${them}!`)}else if(us==them){t.d++;t.pts++;o.d++;o.pts++;S.news.unshift(`🤝 Pareggio ${us}-${them} contro ${opp}.`)}else{t.l++;o.w++;o.pts+=3;S.rep=Math.max(1,S.rep-1);S.news.unshift(`❌ Sconfitta ${us}-${them} contro ${opp}.`)}S.players.slice(0,11).forEach(p=>{p.apps++;p.form=Math.max(5,Math.min(9.5,p.form+(us>them?.2:us<them?-.15:.03)));if(p.form>8&&p.ovr<p.pot&&Math.random()<.25)p.ovr++});if(Math.random()<.18)cupCheck();S.match++;if(S.match==19)S.month=1;if(S.match>=38){S.month=7;let finalRank=rank();if(finalRank===1){S.news.unshift(`🏆 ${S.club} è CAMPIONE di ${S.division}!`);S.social.unshift(`👑 @LeagueOfficial: ${S.club} è CAMPIONE!`);celebrate("league",S.division,"CAMPIONI!")}else if(finalRank<=4)S.news.unshift(`⭐ ${S.club} chiude la stagione al ${finalRank}° posto.`);S.history.unshift({club:S.club,league:S.league,date:`Fine stagione ${S.season}`});S.season++;S.match=0;S.players.forEach(p=>{p.age++;if(p.form>7.7&&p.ovr<p.pot)p.ovr++;p.form=7});S.youth.forEach(p=>{p.age++;if(p.status=="prestito"){p.status="vivaio";p.ovr=Math.min(p.pot,p.ovr+2)}});initTable();if(S.rep>=65)offersNow()}else if(S.match==19&&S.rep>=65)offersNow();render()}
function simulate(){for(let i=0;i<5;i++)match()}
function celebrate(type,title,subtitle){let emoji=type==="transfer"?"🚨":type==="league"?"🏆":"🏆";document.getElementById("trophyBox").innerHTML=`<div class="cup">${emoji}</div><h1>${subtitle}</h1><h2>${title}</h2><p>Momento storico per <b>${S.club}</b>!</p><button class="primary" onclick="closeTrophy()">CONTINUA</button>`;document.getElementById("trophy").style.display="flex";let c=document.getElementById("confetti");c.innerHTML=Array.from({length:90},()=>`<i class="piece" style="left:${Math.random()*100}%;--c:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*1.2}s"></i>`).join("")}
function closeTrophy(){document.getElementById("trophy").style.display="none";document.getElementById("confetti").innerHTML=""}
function closeModal(){const d=document.getElementById('playerModal');if(d)d.remove();const m=document.getElementById('modal');if(m)m.style.display='none'}function modal(x){let old=document.getElementById('playerModal');if(old)old.remove();let d=document.createElement('div');d.className='trophy';d.style.display='flex';d.id='playerModal';d.innerHTML=`<div class="trophyBox">${x}</div>`;document.body.appendChild(d)}
const pages={home,squad,tactics,youth:youthPage,market,calendar,table,offers,news,career};render();
if(S.started===false){}
const imageObserver=new MutationObserver(()=>setTimeout(hydrateImages,25));imageObserver.observe(document.getElementById('app'),{childList:true,subtree:true});setTimeout(hydrateImages,50);
</script></body></html>
