<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Manager 2026 - Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: white;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #00d2ff;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(135deg, #00d2ff, #7a2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #8892b0;
            font-size: 14px;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .sidebar h2 {
            color: #00d2ff;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a3a6e;
        }

        .sidebar::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 10px;
        }

        /* ===== GERARCHIA CAMPIONATI ===== */
        .nazione {
            margin-bottom: 10px;
        }

        .nazione-titolo {
            background: #1a2a4e;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #00d2ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .nazione-titolo:hover {
            background: #2a3a6e;
            border-color: #00d2ff;
        }

        .nazione-titolo .freccia {
            transition: transform 0.3s;
        }

        .nazione-titolo .freccia.aperto {
            transform: rotate(180deg);
        }

        .nazione-contenuto {
            display: none;
            padding-left: 15px;
            margin-top: 5px;
        }

        .nazione-contenuto.aperto {
            display: block;
        }

        .lega {
            margin: 5px 0;
        }

        .lega-titolo {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            color: #8892b0;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lega-titolo:hover {
            background: #1a2a4e;
            color: white;
        }

        .lega-titolo.attiva {
            color: #00d2ff;
            background: #1a2a4e;
        }

        .lega-contenuto {
            display: none;
            padding-left: 15px;
        }

        .lega-contenuto.aperto {
            display: block;
        }

        .squadra-link {
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            color: #8892b0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .squadra-link:hover {
            background: #1a2a4e;
            color: white;
        }

        .squadra-link.attiva {
            background: #00d2ff;
            color: #0a0a1a;
            font-weight: bold;
        }

        .squadra-link .stemma {
            font-size: 18px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            min-height: 600px;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #16213e;
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a3a6e;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .card .label {
            font-size: 12px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }

        .card .value.gold {
            color: #ffd700;
        }
        .card .value.green {
            color: #00ff88;
        }
        .card .value.red {
            color: #ff6b6b;
        }
        .card .value.blue {
            color: #00d2ff;
        }

        /* ===== PULSANTI ===== */
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d2ff, #7a2ffc);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #00ff88, #00b894);
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #fdcb6e, #f39c12);
        }
        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(253, 203, 110, 0.3);
        }

        /* ===== TABELLA CLASSIFICA ===== */
        .classifica-container {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .classifica-container h2 {
            color: #00d2ff;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #2a3a6e;
            color: #8892b0;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #1a2a4e;
        }

        .pos-1 {
            color: #ffd700;
        }
        .pos-2 {
            color: #c0c0c0;
        }
        .pos-3 {
            color: #cd7f32;
        }

        tr:hover {
            background: #1a2a4e;
        }
        .mia-squadra {
            background: #2a3a6e !important;
            border-left: 3px solid #00d2ff;
        }

        /* ===== GIOCATORI ===== */
        .giocatori-container {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
        }

        .giocatori-container h2 {
            color: #00d2ff;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .giocatori-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .giocatore-card {
            background: #1a2a4e;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
            position: relative;
        }

        .giocatore-card:hover {
            transform: translateY(-3px);
            border-color: #00d2ff;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.1);
        }

        .giocatore-card .foto {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a3a6e, #1a2a4e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 10px;
            border: 2px solid #2a3a6e;
        }

        .giocatore-card .nome {
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }

        .giocatore-card .ruolo {
            text-align: center;
            color: #8892b0;
            font-size: 12px;
        }

        .giocatore-card .ovr {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin: 5px 0;
        }

        .giocatore-card .stats {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: #8892b0;
        }

        .giocatore-card .stats span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* ===== MODALE GIOCATORE ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.aperto {
            display: flex;
        }

        .modal {
            background: #16213e;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2a3a6e;
            position: relative;
        }

        .modal::-webkit-scrollbar {
            width: 5px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 10px;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #8892b0;
            transition: all 0.3s;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: white;
            transform: rotate(90deg);
        }

        .modal .foto-grande {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a3a6e, #1a2a4e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 15px;
            border: 3px solid #00d2ff;
        }

        .modal .nome-grande {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .modal .info-base {
            text-align: center;
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .modal .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .modal .info-item {
            background: #1a2a4e;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .modal .info-item .label {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
        }

        .modal .info-item .valore {
            font-size: 16px;
            font-weight: bold;
            margin-top: 3px;
        }

        .modal .attributi {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin: 15px 0;
        }

        .modal .attributo {
            background: #1a2a4e;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .modal .attributo .label {
            font-size: 10px;
            color: #8892b0;
            text-transform: uppercase;
        }

        .modal .attributo .valore {
            font-size: 16px;
            font-weight: bold;
        }

        .modal .storico {
            margin-top: 15px;
        }

        .modal .storico h3 {
            color: #00d2ff;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .modal .storico-item {
            background: #1a2a4e;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 5px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        /* ===== MESSAGGIO ===== */
        .messaggio {
            background: #2a3a6e;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #00d2ff;
            text-align: center;
        }

        /* ===== PARTITE ===== */
        .partite-container {
            background: #16213e;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a3a6e;
            margin-top: 20px;
        }

        .partite-container h2 {
            color: #00d2ff;
            margin-bottom: 15px;
        }

        .partita {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            border-bottom: 1px solid #1a2a4e;
        }

        .partita:last-child {
            border-bottom: none;
        }

        .partita .squadra {
            font-weight: bold;
            font-size: 14px;
        }

        .partita .risultato {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                max-height: 400px;
                overflow-y: auto;
            }
            .giocatori-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
            .modal {
                padding: 20px;
                margin: 10px;
            }
            .modal .info-grid {
                grid-template-columns: 1fr;
            }
            .modal .attributi {
                grid-template-columns: 1fr 1fr;
            }
            .dashboard {
                grid-template-columns: repeat(3, 1fr);
            }
            .card .value {
                font-size: 20px;
            }
        }

        @media (max-width: 500px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
            .header h1 {
                font-size: 1.3em;
            }
            .buttons .btn {
                padding: 8px 15px;
                font-size: 12px;
            }
            .giocatori-grid {
                grid-template-columns: 1fr 1fr;
            }
            .giocatore-card .foto {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .giocatore-card .ovr {
                font-size: 18px;
            }
        }
    </style>
</head>

        // ============================================================

        let gameState = {
            squadraSelezionata: 1,
            giornata: 0,

        let SQUADRE = [];

        // ============================================================
        // INIZIALIZZAZIONE
        // ============================================================

        function initSquadre() {
            SQUADRE = [];
            for (const nazione in CAMPIONATI) {
                for (const lega in CAMPIONATI[nazione].leghe) {
                    SQUADRE.push(...CAMPIONATI[nazione].leghe[lega].squadre);
                }
            }
        }

        function initClassifica() {
            const c = {};
            for (const squadra of SQUADRE) {
                c[squadra.id] = {
                    nome: squadra.nome,
                    partite: 0,
                    vittorie: 0,
                    pareggi: 0,
                    sconfitte: 0,
                    golFatti: 0,
                    golSubiti: 0,
                    punti: 0,
                };
            }
            return c;
        }

                    // Genera giocatori fittizi per le squadre minori
                    for (let i = 0; i < 17; i++) {

        function resetGame() {
            gameState.giornata = 0;
            gameState.classifica = initClassifica();
            gameState.partite = [];
            gameState.giocatori = initGiocatori();
            gameState.capocannoniere = { nome: '', gol: 0 };
            gameState.assistman = { nome: '', assist: 0 };
            aggiornaUI();
            mostraMessaggio('🔄 Gioco resettato! Inizia una nuova stagione!', '#2a3a6e');
        }

        // ============================================================
        // FUNZIONI UTILITÀ
        // ============================================================

        function getSquadra(id) {
            return SQUADRE.find(s => s.id === id);
        }

        function getGiocatoriSquadra(id) {
            return gameState.giocatori.filter(g => g.squadra_id === id);
        }

        function calcolaForza(id) {
            const giocatori = getGiocatoriSquadra(id);
            if (giocatori.length === 0) return 50;
            giocatori.sort((a, b) => b.ovr - a.ovr);
            const top = giocatori.slice(0, 11);
            const sum = top.reduce((acc, g) => acc + g.ovr, 0);
            return Math.round(sum / top.length);
        }

        function getClassificaArray() {
            const arr = Object.values(gameState.classifica);
            arr.sort((a, b) => {
                if (b.punti !== a.punti) return b.punti - a.punti;
                return (b.golFatti - b.golSubiti) - (a.golFatti - a.golSubiti);
            });
            return arr;
        }

        // ============================================================
        // SIMULAZIONE
        // ============================================================

        function simulaGiornata() {
            if (gameState.giornata >= gameState.totaleGiornate) {
                mostraMessaggio('🏆 Stagione completata! Premi Reset per ricominciare.', '#ff6b6b');
                return;
            }

            gameState.giornata++;
            const squadreIds = SQUADRE.map(s => s.id);
            const mischiate = [...squadreIds].sort(() => Math.random() - 0.5);
            const risultati = [];

            for (let i = 0; i < mischiate.length; i += 2) {
                if (i + 1 >= mischiate.length) break;
                const casa = mischiate[i];
                const ospite = mischiate[i + 1];

                const fCasa = calcolaForza(casa);
                const fOspite = calcolaForza(ospite);

                const attesiCasa = Math.max(0, (fCasa / 100) * 2.5 - (fOspite / 100) * 1.2) * 1.1;
                const attesiOspite = Math.max(0, (fOspite / 100) * 2.5 - (fCasa / 100) * 1.2);

                let gCasa = Math.round(attesiCasa + (Math.random() - 0.5) * 1.5);
                let gOspite = Math.round(attesiOspite + (Math.random() - 0.5) * 1.5);
                gCasa = Math.max(0, gCasa);
                gOspite = Math.max(0, gOspite);

                // Aggiorna classifica
                const c = gameState.classifica;
                if (c[casa]) {
                    c[casa].partite++;
                    c[casa].golFatti += gCasa;
                    c[casa].golSubiti += gOspite;
                    if (gCasa > gOspite) { c[casa].vittorie++;
                        c[casa].punti += 3; } else if (gCasa === gOspite) { c[casa].pareggi++;
                        c[casa].punti += 1; } else { c[casa].sconfitte++; }
                }
                if (c[ospite]) {
                    c[ospite].partite++;
                    c[ospite].golFatti += gOspite;
                    c[ospite].golSubiti += gCasa;
                    if (gOspite > gCasa) { c[ospite].vittorie++;
                        c[ospite].punti += 3; } else if (gOspite === gCasa) { c[ospite].pareggi++;
                        c[ospite].punti += 1; } else { c[ospite].sconfitte++; }
                }

                // Statistiche giocatori
                for (const id of [casa, ospite]) {
                    const gol = id === casa ? gCasa : gOspite;
                    const giocatori = getGiocatoriSquadra(id);
                    for (const g of giocatori) {
                        g.minuti = (g.minuti || 0) + 90;
                        if (Math.random() < 0.15 && gol > 0) {
                            g.gol = (g.gol || 0) + 1;
                            g.golStagione = (g.golStagione || 0) + 1;
                        }
                        if (Math.random() < 0.12 && gol > 1) {
                            g.assist = (g.assist || 0) + 1;
                            g.assistStagione = (g.assistStagione || 0) + 1;
                        }
                    }
                }

                risultati.push({
                    giornata: gameState.giornata,
                    squadra_casa: casa,
                    squadra_ospite: ospite,
                    gol_casa: gCasa,
                    gol_ospite: gOspite,
                });
            }

            gameState.partite = [...gameState.partite, ...risultati];

            // Calcola capocannoniere
            aggiornaPremi();
            aggiornaUI();
            mostraMessaggio(`📊 Giornata ${gameState.giornata} completata! ${risultati.length} partite giocate.`,
            '#00d2ff');
        }

        function simulaStagione() {
            if (gameState.giornata >= gameState.totaleGiornate) {
                mostraMessaggio('🏆 Stagione già completata! Premi Reset per ricominciare.', '#ff6b6b');
                return;
            }
            const rimanenti = gameState.totaleGiornate - gameState.giornata;
            for (let i = 0; i < rimanenti; i++) {
                simulaGiornata();
            }
            const campione = getClassificaArray()[0]?.nome || '?';
            mostraMessaggio(`🏆 STAGIONE COMPLETATA! Campione: ${campione} 🏆`, '#ffd700');
        }

        function aggiornaPremi() {
            let maxGol = 0;
            let maxAssist = 0;
            let capo = '';
            let assistMan = '';
            for (const g of gameState.giocatori) {
                if ((g.golStagione || 0) > maxGol) {
                    maxGol = g.golStagione || 0;
                    capo = `${g.nome} ${g.cognome}`;
                }
                if ((g.assistStagione || 0) > maxAssist) {
                    maxAssist = g.assistStagione || 0;
                    assistMan = `${g.nome} ${g.cognome}`;
                }
            }
            gameState.capocannoniere = { nome: capo, gol: maxGol };
            gameState.assistman = { nome: assistMan, assist: maxAssist };
        }

        // SELEZIONE SQUADRA
        // ============================================================

        function selezionaSquadra(id) {
            gameState.squadraSelezionata = id;
            aggiornaUI();
            const squadra = getSquadra(id);
            mostraMessaggio(`✅ Squadra selezionata: ${squadra?.stemma} ${squadra?.nome}`, '#00ff88');
            // Aggiorna sidebar evidenziando la squadra
            document.querySelectorAll('.squadra-link').forEach(el => el.classList.remove('attiva'));
            document.querySelector(`.squadra-link[data-id="${id}"]`)?.classList.add('attiva');
        }

                    </div>
                </div>
                <h3 style="color:#00d2ff;font-size:14px;margin-top:10px;">🎯 Attributi</h3>
                <div class="attributi">
                    <div class="attributo">
                        <div class="label">🎯 Tiro</div>
                        <div class="valore" style="color:#ff6b6b;">${giocatore.tiro || 70}</div>
                    </div>
                    <div class="attributo">
                        <div class="label">🛡️ Difesa</div>
                        <div class="valore" style="color:#00d2ff;">${giocatore.difesa || 70}</div>
                    </div>
                    <div class="attributo">
                        <div class="label">💨 Velocità</div>
                        <div class="valore" style="color:#ffd700;">${giocatore.velocita || 70}</div>
                    </div>
                    <div class="attributo">
                        <div class="label">💪 Fisico</div>
                        <div class="valore" style="color:#00ff88;">${giocatore.fisico || 70}</div>
                    </div>
                    <div class="attributo">
                        <div class="label">🎯 Tecnica</div>
                        <div class="valore" style="color:#7a2ffc;">${giocatore.tecnica || 70}</div>
                    </div>
                    <div class="attributo">
                        <div class="label">🧠 Intelligenza</div>
                        <div class="valore" style="color:#fdcb6e;">${giocatore.intelligenza || 70}</div>
                    </div>
                </div>
                <div class="storico">
                    <h3>📜 Storico Trasferimenti</h3>
                    ${storicoHtml}
                </div>
            `;

            modal.classList.add('aperto');
        }

        function chiudiModal() {
            document.getElementById('modalGiocatore').classList.remove('aperto');
        }

        // Clicca fuori per chiudere
        document.getElementById('modalGiocatore').addEventListener('click', function(e) {
            if (e.target === this) chiudiModal();
        });

        // ============================================================
        // UI - GERARCHIA
        // ============================================================

        function buildGerarchia() {
            const container = document.getElementById('gerarchia');
            let html = '';

            for (const nazione in CAMPIONATI) {
                const nazioneData = CAMPIONATI[nazione];
                html += `
                    <div class="nazione">
                        <div class="nazione-titolo" onclick="toggleNazione(this)">
                            ${nazioneData.stemma} ${nazione}
                            <span class="freccia">▼</span>
                        </div>
                        <div class="nazione-contenuto">
                `;

                for (const lega in nazioneData.leghe) {
                    const legaData = nazioneData.leghe[lega];
                    html += `
                        <div class="lega">
                            <div class="lega-titolo" onclick="toggleLega(this)">
                                ${lega}
                                <span class="freccia">▶</span>
                            </div>
                            <div class="lega-contenuto">
                    `;

                    for (const squadra of legaData.squadre) {
                        html += `
                            <div class="squadra-link" data-id="${squadra.id}" onclick="selezionaSquadra(${squadra.id})">
                                <span class="stemma">${squadra.stemma}</span>
                                ${squadra.nome}
                            </div>
                        `;
                    }

                    html += `
                            </div>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function toggleNazione(el) {
            const contenuto = el.nextElementSibling;
            const freccia = el.querySelector('.freccia');
            contenuto.classList.toggle('aperto');
            freccia.classList.toggle('aperto');
        }

        function toggleLega(el) {
            const contenuto = el.nextElementSibling;
            const freccia = el.querySelector('.freccia');
            contenuto.classList.toggle('aperto');
            freccia.textContent = contenuto.classList.contains('aperto') ? '▼' : '▶';
        }

        // ============================================================
        // UI - AGGIORNAMENTO
        // ============================================================

        function mostraMessaggio(msg, colore = '#2a3a6e') {
            const el = document.getElementById('messaggio');
            el.textContent = msg;
            el.style.borderLeftColor = colore || '#00d2ff';
        }

        function aggiornaUI() {
            const squadra = getSquadra(gameState.squadraSelezionata);
            const classificaArr = getClassificaArray();
            const stats = gameState.classifica[gameState.squadraSelezionata];
            const pos = classificaArr.findIndex(s => s.nome === squadra?.nome) + 1;

            // Dashboard
            document.getElementById('campionato').textContent = 'Serie A';
            document.getElementById('posizione').textContent = pos > 0 ? pos + '°' : '-';
            document.getElementById('golFatti').textContent = stats?.golFatti || 0;
            document.getElementById('golSubiti').textContent = stats?.golSubiti || 0;
            document.getElementById('giornata').textContent = `${gameState.giornata} / ${gameState.totaleGiornate}`;
            document.getElementById('squadraNome').textContent = squadra ? `${squadra.stemma} ${squadra.nome}` : '-';

            // Classifica
            let html = `<table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Squadra</th>
                        <th>G</th>
                        <th>V</th>
                        <th>N</th>
                        <th>P</th>
                        <th>GF</th>
                        <th>GS</th>
                        <th>Punti</th>
                    </tr>
                </thead>
                <tbody>`;

            const miaSquadraNome = squadra?.nome || '';
            for (let i = 0; i < classificaArr.length; i++) {
                const s = classificaArr[i];
                const classe = i === 0 ? 'pos-1' : i === 1 ? 'pos-2' : i === 2 ? 'pos-3' : '';
                const isMia = s.nome === miaSquadraNome;
                html += `<tr class="${isMia ? 'mia-squadra' : ''}">
                    <td class="${classe}">${i + 1}</td>
                    <td>${isMia ? '👉 ' : ''}${s.nome}</td>
                    <td>${s.partite}</td>
                    <td>${s.vittorie}</td>
                    <td>${s.pareggi}</td>
                    <td>${s.sconfitte}</td>
                    <td>${s.golFatti}</td>
                    <td>${s.golSubiti}</td>
                    <td><strong>${s.punti}</strong></td>
                </tr>`;
            }
            html += `</tbody></table>
                <div style="margin-top:15px;padding:10px;background:#1a2a4e;border-radius:10px;">
                    <strong>⚽ Capocannoniere:</strong> ${gameState.capocannoniere.nome || '-'} (${gameState.capocannoniere.gol || 0} gol) &nbsp;|&nbsp;
                    <strong>🅰️ Assistman:</strong> ${gameState.assistman.nome || '-'} (${gameState.assistman.assist || 0} assist)
                </div>`;
            document.getElementById('classificaTabella').innerHTML = html;
            document.getElementById('classificaInfo').textContent =
                `(${classificaArr.length} squadre • Giornata ${gameState.giornata})`;

            // Partite
            const ultime = gameState.partite.slice(-15).reverse();
            let partiteHtml = '';
            if (ultime.length === 0) {
                partiteHtml = '<p style="color:#8892b0;">Nessuna partita giocata. Simula una giornata!</p>';
            } else {
                for (const p of ultime) {
                    const casa = getSquadra(p.squadra_casa);
                    const ospite = getSquadra(p.squadra_ospite);
                    partiteHtml += `<div class="partita">
                        <span class="squadra">${casa?.stemma || ''} ${casa?.nome || '?'}</span>
                        <span class="risultato">${p.gol_casa} - ${p.gol_ospite}</span>
                        <span class="squadra">${ospite?.stemma || ''} ${ospite?.nome || '?'}</span>
                    </div>`;
                }
            }
            document.getElementById('partiteLista').innerHTML = partiteHtml;

            // Giocatori
            const giocatori = getGiocatoriSquadra(gameState.squadraSelezionata);
            let giocatoriHtml = '';
            if (giocatori.length === 0) {
                giocatoriHtml = '<p style="color:#8892b0;">Nessun giocatore trovato.</p>';
            } else {
                giocatori.sort((a, b) => b.ovr - a.ovr);
                for (const g of giocatori) {
                    giocatoriHtml += `
                        <div class="giocatore-card" onclick='apriModal(${JSON.stringify(g).replace(/'/g, "&apos;")})'>
                            <div class="foto">${g.foto || '⚽'}</div>
                            <div class="nome">${g.nome} ${g.cognome}</div>
                            <div class="ruolo">${g.ruolo} • ${g.eta} anni</div>
                            <div class="ovr">${g.ovr}</div>
                            <div class="stats">
                                <span>⚽ ${g.golStagione || 0}</span>
                                <span>🅰️ ${g.assistStagione || 0}</span>
                                <span>⏱️ ${g.minuti || 0}</span>
                            </div>
                        </div>
                    `;
                }
            }
            document.getElementById('giocatoriLista').innerHTML = giocatoriHtml;
            document.getElementById('giocatoriInfo').textContent = `(${giocatori.length} giocatori)`;
        }

        // ============================================================
        // AVVIO
        // ============================================================

        initSquadre();
        buildGerarchia();
        resetGame();

        // Apri automaticamente la prima nazione e lega
        setTimeout(() => {
            const primi = document.querySelectorAll('.nazione-titolo');
            if (primi.length > 0) {
                primi[0].click();
                const primeLeghe = document.querySelectorAll('.lega-titolo');
                if (primeLeghe.length > 0) {
                    setTimeout(() => primeLeghe[0].click(), 200);
                }
            }
            // Seleziona automaticamente la prima squadra
            const primaSquadra = document.querySelector('.squadra-link');
            if (primaSquadra) {
                const id = parseInt(primaSquadra.dataset.id);
                selezionaSquadra(id);
            }
        }, 300);

        console.log('⚽ Football Manager 2026 avviato!');
        console.log(`📊 ${SQUADRE.length} squadre caricate`);
        console.log(`👥 ${gameState.giocatori.length} giocatori caricati`);
    </script>

</body>
</html>
