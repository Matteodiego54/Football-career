<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Manager — Gioco</title>
<style>
body{margin:0;background:#090b0f;color:#fff;font-family:Arial,sans-serif}*{box-sizing:border-box}
#app{max-width:1100px;margin:auto;padding:16px}.screen{background:#12161d;border:1px solid #2b3340;border-radius:16px;padding:18px;margin-bottom:14px}
button{background:#252d38;color:#fff;border:0;border-radius:9px;padding:10px 14px;margin:4px;font-weight:bold;cursor:pointer}button:hover{background:#3a4655}.primary{background:#e32632}.green{background:#157044}.gold{background:#80631c}
nav{display:flex;gap:4px;overflow:auto;margin:12px 0}nav button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#1a2029;border:1px solid #303947;border-radius:12px;padding:13px}.big{font-size:24px;font-weight:900}.muted{color:#96a0ad;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid #282f39}.row:last-child{border:0}.pill{background:#2a313c;padding:4px 7px;border-radius:6px;font-size:12px}.greenText{color:#40d889}.goldText{color:#f1c75a}.redText{color:#ff6871}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:end}.modal>div{background:#11161d;width:100%;max-width:650px;margin:auto;padding:18px;border-radius:18px 18px 0 0;max-height:90vh;overflow:auto}.line{height:7px;background:#303641;border-radius:5px}.line i{display:block;height:100%;background:#e32632;border-radius:5px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div><div class="modal" id="modal"><div id="modalBody"></div></div>
<script>
const leagues={
"Italia — Serie A":["Milan","Inter","Juventus","Napoli","Roma","Lazio","Atalanta","Fiorentina","Bologna","Torino","Genoa","Sassuolo","Udinese","Parma","Cagliari","Lecce","Como","Cremonese","Pisa","Venezia"],
"Inghilterra — Premier League":["Arsenal","Manchester City","Liverpool","Manchester United","Chelsea","Tottenham","Newcastle","Aston Villa","West Ham","Everton","Brighton","Crystal Palace","Wolves","Fulham","Brentford","Nottingham Forest","Bournemouth","Leeds","Burnley","Sunderland"],
"Spagna — LaLiga":["Real Madrid","Barcelona","Atletico Madrid","Athletic Club","Real Sociedad","Villarreal","Real Betis","Sevilla","Valencia","Girona","Celta Vigo","Getafe","Osasuna","Mallorca","Rayo Vallecano","Alaves","Espanyol","Levante"],
"Germania — Bundesliga":["Bayern Munich","Borussia Dortmund","Bayer Leverkusen","RB Leipzig","Eintracht Frankfurt","Stuttgart","Freiburg","Mainz","Werder Bremen","Wolfsburg","Hoffenheim","Union Berlin","Augsburg","Hamburg","St Pauli"],
"Francia — Ligue 1":["Paris Saint-Germain","Marseille","Lyon","Monaco","Lille","Nice","Lens","Rennes","Strasbourg","Nantes","Toulouse","Brest","Reims","Auxerre","Saint-Etienne","Le Havre"],
"Olanda — Eredivisie":["Ajax","PSV","Feyenoord","AZ","Twente","Utrecht","Groningen","Heerenveen","Sparta Rotterdam","NEC","Fortuna Sittard","PEC Zwolle"],
"Portogallo — Primeira Liga":["Benfica","Porto","Sporting CP","Braga","Vitoria Guimaraes","Boavista","Famalicao","Rio Ave","Gil Vicente","Estoril","Casa Pia","Arouca"]
};
const power={Milan:84,Inter:85,Juventus:82,Napoli:83,Arsenal:87,"Manchester City":92,Liverpool:89,"Manchester United":82,Chelsea:84,"Real Madrid":92,Barcelona:89,"Atletico Madrid":87,"Bayern Munich":91,"Borussia Dortmund":85,"Bayer Leverkusen":86,"Paris Saint-Germain":91,Marseille:80,Lyon:78,Ajax:82,PSV:83,Feyenoord:81,Benfica:84,Porto:84,"Sporting CP":84};
const famous={
Milan:[["Maignan","POR",87,31,88],["Tomori","DC",82,28,83],["Pavlovic","DC",80,25,85],["Fofana","CC",82,27,84],["Modric","CC",90,40,90],["Ricci","CC",79,25,85],["Pulisic","AD",86,27,89],["Leao","AS",88,27,93],["Gimenez","ATT",84,25,90]],
"Real Madrid":[["Courtois","POR",89,34,89],["Rudiger","DC",86,33,86],["Valverde","CC",89,28,92],["Bellingham","CC",91,23,96],["Vinicius","AS",91,26,95],["Mbappe","ATT",92,27,96]],
"Manchester City":[["Ederson","POR",86,33,86],["Dias","DC",88,29,90],["Rodri","CC",90,30,92],["Bernardo Silva","CC",87,32,87],["Haaland","ATT",91,26,96],["Foden","AD",88,26,94]],
Barcelona:[["Ter Stegen","POR",87,34,87],["Araujo","DC",86,27,91],["Pedri","CC",90,23,95],["De Jong","CC",87,29,89],["Yamal","AD",89,19,97],["Lewandowski","ATT",88,38,88]],
"Bayern Munich":[["Neuer","POR",86,40,86],["Kimmich","CC",88,31,89],["Musiala","TQ",90,23,96],["Kane","ATT",90,33,91],["Olise","AD",86,24,94]],
"Paris Saint-Germain":[["Donnarumma","POR",88,27,91],["Marquinhos","DC",86,32,87],["Vitinha","CC",88,26,93],["Kvaratskhelia","AS",87,25,94],["Dembele","AD",90,29,92]]
};
let S={started:false,league:"",club:"",season:2026,match:0,month:8,tab:"home",budget:0,rep:60,players:[],youth:[],table:{},results:[],offers:[],history:[],news:[],formation:"4-3-3"};

function money(n){return "€"+(n/1e6).toFixed(1)+"M"}
function makePlayers(c){let a=famous[c]||[];if(!a.length){let p=power[c]||76;a=[["Portiere", "POR",p-2,28,p+2],["Difensore","DC",p-3,26,p+3],["Centrocampista","CC",p-2,25,p+4],["Attaccante","ATT",p,27,p+5],["Talento","CC",p-8,20,p+10]]}return a.map((x,i)=>({id:i,name:x[0],pos:x[1],ovr:x[2],age:x[3],pot:x[4],apps:0,g:0,a:0,form:7,value:x[2]*x[2]*8000}))}
function initTable(){S.table={};for(const c of leagues[S.league])S.table[c]={p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}}
function youth(){return [["Talento U17",16,"CC",55,81,"U17"],["Promessa U18",17,"ATT",61,86,"U18"],["Stella Primavera",18,"AD",67,90,"Primavera"],["Difensore U17",16,"DC",54,79,"U17"],["Regista U18",17,"CC",59,84,"U18"]].map((x,i)=>({id:i,name:x[0],age:x[1],pos:x[2],ovr:x[3],pot:x[4],team:x[5],status:"vivaio"}))}
function start(l,c){S={...S,started:true,league:l,club:c,season:2026,match:0,month:8,budget:(power[c]||76)*1800000,rep:power[c]||76,players:makePlayers(c),youth:youth(),table:{},results:[],offers:[],history:[{club:c,league:l,date:"Agosto 2026"}],news:[`Sei il nuovo allenatore di ${c}.`],formation:"4-3-3",tab:"home"};initTable();render()}
function save(){localStorage.setItem("careerManagerSave",JSON.stringify(S));alert("Carriera salvata!")}
function load(){let x=localStorage.getItem("careerManagerSave");if(x){S=JSON.parse(x);render()}else alert("Nessun salvataggio trovato.")}
function nav(){return `<nav>${[["home","🏠 Home"],["squad","👥 Rosa"],["tactics","🧠 Tattica"],["youth","🌱 Vivaio"],["market","💰 Mercato"],["calendar","📅 Calendario"],["table","🏆 Classifica"],["offers","📩 Offerte"],["career","🧳 Carriera"]].map(x=>`<button class="${S.tab==x[0]?'primary':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}<button onclick="save()">💾 Salva</button><button onclick="load()">📂 Carica</button></nav>`}
function render(){if(!S.started){startScreen();return}document.getElementById("app").innerHTML=`<div class="screen"><b>⚽ FOOTBALL CAREER MANAGER</b><span style="float:right">${S.club} · ${S.league} · ${S.season}/${S.season+1}</span>${nav()}</div><main>${pages[S.tab]()}</main>`}
function startScreen(){document.getElementById("app").innerHTML=`<div class="screen"><h1>⚽ FOOTBALL CAREER MANAGER</h1><p class="muted">Sei TU l'allenatore. Scegli una squadra, gioca stagioni e costruisci la tua carriera. Potrai trasferirti a gennaio o a fine stagione.</p><h2>Scegli campionato</h2><div class="grid">${Object.keys(leagues).map(l=>`<button onclick="clubs('${l}')">${l}</button>`).join("")}</div><div id="clubs"></div></div>`}
function clubs(l){document.getElementById("clubs").innerHTML=`<h2>${l}</h2><div class="grid">${leagues[l].map(c=>`<div class="card"><b>${c}</b><p class="muted">Forza ${power[c]||76}</p><button class="primary" onclick="start('${l}','${c}')">Inizia con ${c}</button></div>`).join("")}</div>`}
function go(t){S.tab=t;render()}
function rank(){return Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts).findIndex(x=>x[0]==S.club)+1}
function home(){return `<div class="screen"><h1>${S.club}</h1><p>${S.league} · Giornata ${S.match+1} · ${S.month==1?"Mercato di gennaio aperto":S.month>=5?"Fine stagione vicina":"Stagione in corso"}</p><div class="stats"><div class="card"><div class="big">${money(S.budget)}</div><span class="muted">Budget</span></div><div class="card"><div class="big">${S.table[S.club].pts}</div><span class="muted">Punti</span></div><div class="card"><div class="big">${rank()}°</div><span class="muted">Posizione</span></div><div class="card"><div class="big">${S.rep}</div><span class="muted">Reputazione</span></div></div><br><button class="primary" onclick="match()">⚽ Gioca partita</button><button onclick="simulate()">⏩ Simula 5 partite</button><button onclick="offersNow()">📩 Cerca offerte</button></div><div class="grid"><div class="screen"><h3>Ultimi risultati</h3>${S.results.slice(-6).reverse().map(x=>`<div class="row">${x}</div>`).join("")||"Nessuna partita."}</div><div class="screen"><h3>News</h3>${S.news.slice(0,8).map(x=>`<div class="row">• ${x}</div>`).join("")}</div><div class="screen"><h3>Prossimo cambio club</h3><p>Puoi accettare un'offerta <b>a gennaio</b> o <b>a fine stagione</b>.</p><button class="gold" onclick="offersNow()">Vedi offerte</button></div></div>`}
function squad(){return `<div class="screen"><h2>👥 Rosa</h2>${S.players.map(p=>`<div class="row" onclick="showPlayer(${p.id})"><span><b>${p.name}</b><br><small class="muted">${p.pos} · ${p.age} anni · Forma ${p.form.toFixed(1)}</small></span><span><b>${p.ovr}</b> <span class="greenText">${p.pot}</span></span></div>`).join("")}</div>`}
function showPlayer(id){let p=S.players[id];modal(`<h2>${p.name}</h2><p>${p.pos} · ${p.age} anni</p><div class="stats"><div class="card"><div class="big">${p.ovr}</div>OVERALL</div><div class="card"><div class="big greenText">${p.pot}</div>POTENZIALE</div><div class="card"><div class="big">${p.apps}</div>PRESENZE</div><div class="card"><div class="big">${p.g}</div>GOL</div></div><br><button onclick="closeModal()">Chiudi</button>`)}
function tactics(){return `<div class="screen"><h2>🧠 Tattica</h2>${["4-3-3","4-2-3-1","3-5-2","4-4-2"].map(f=>`<button class="${S.formation==f?'primary':''}" onclick="S.formation='${f}';render()">${f}</button>`).join("")}<h3>XI</h3><div class="grid">${S.players.slice(0,11).map((p,i)=>`<div class="card">${i+1}. <b>${p.name}</b><br><span class="muted">${p.pos} · ${p.ovr}</span></div>`).join("")}</div></div>`}
function youthPage(){return `<div class="screen"><h2>🌱 Primavera / U18 / U17</h2>${S.youth.map(p=>`<div class="row"><span><b>${p.name}</b><br><span class="muted">${p.team} · ${p.pos} · ${p.age} anni · OVR ${p.ovr} · POT ${p.pot}</span></span><span>${p.status=="vivaio"?`<button class="green" onclick="promote(${p.id})">Promuovi</button><button onclick="loan(${p.id})">Prestito</button><button class="gold" onclick="keep(${p.id})">Lascia</button>`:`<span class="pill">${p.status}</span>`}</span></div>`).join("")}</div>`}
function promote(id){let p=S.youth[id];p.status="promosso";S.players.push({id:S.players.length,name:p.name,pos:p.pos,ovr:p.ovr,age:p.age,pot:p.pot,apps:0,g:0,a:0,form:7,value:p.ovr*p.ovr*6000});S.news.unshift(`${p.name} promosso in prima squadra.`);render()}
function loan(id){S.youth[id].status="prestito";S.news.unshift(`${S.youth[id].name} mandato in prestito.`);render()}function keep(id){S.news.unshift(`${S.youth[id].name} resta nel vivaio.`);render()}
function market(){let pool=[["Kenan Yildiz","ATT",82,78000000],["Nico Paz","CC",79,55000000],["Scalvini","DC",82,52000000],["Bakayoko","AD",78,42000000],["Nusa","AS",77,35000000]];return `<div class="screen"><h2>💰 Mercato</h2><p>Disponibile solo a gennaio e luglio. Budget: <b class="goldText">${money(S.budget)}</b></p><div class="grid">${pool.map((p,i)=>`<div class="card"><b>${p[0]}</b><p class="muted">${p[1]} · OVR ${p[2]}</p><b class="goldText">${money(p[3])}</b><br><button class="primary" onclick="buy(${i})">Acquista</button></div>`).join("")}</div></div>`}
function buy(i){if(S.month!=1&&S.month!=7){alert("Mercato chiuso.");return}let p=[["Kenan Yildiz","ATT",82,78000000],["Nico Paz","CC",79,55000000],["Scalvini","DC",82,52000000],["Bakayoko","AD",78,42000000],["Nusa","AS",77,35000000]][i];if(S.budget<p[3])return alert("Budget insufficiente");S.budget-=p[3];S.players.push({id:S.players.length,name:p[0],pos:p[1],ovr:p[2],age:21,pot:p[2]+9,apps:0,g:0,a:0,form:7,value:p[3]});S.news.unshift(`${p[0]} acquistato.`);render()}
function calendar(){return `<div class="screen"><h2>📅 Calendario</h2>${Array.from({length:38},(_,i)=>`<div class="row"><span>G${i+1} · ${i%2?"✈️":"🏠"} ${leagues[S.league][(i+3)%leagues[S.league].length]}</span><b>${S.results[i]||"—"}</b></div>`).join("")}</div>`}
function table(){let a=Object.entries(S.table).sort((a,b)=>b[1].pts-a[1].pts);return `<div class="screen"><h2>🏆 ${S.league}</h2><table style="width:100%"><tr><th>#</th><th>Club</th><th>PG</th><th>V</th><th>N</th><th>P</th><th>PT</th></tr>${a.map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td>${x[1].p}</td><td>${x[1].w}</td><td>${x[1].d}</td><td>${x[1].l}</td><td><b>${x[1].pts}</b></td></tr>`).join("")}</table></div>`}
function offers(){return `<div class="screen"><h2>📩 Offerte da altri club</h2><p class="muted">Puoi trasferirti a gennaio o a fine stagione.</p>${S.offers.length?S.offers.map((o,i)=>`<div class="card"><h3>${o.club}</h3><span class="muted">${o.league}</span><p>Reputazione richiesta: ${o.req}</p><button class="primary" onclick="accept(${i})">ACCETTA E CAMBIA CLUB</button><button onclick="S.offers.splice(${i},1);render()">Rifiuta</button></div>`).join(""):`<p>Nessuna offerta disponibile.</p>`}<button onclick="offersNow()">Genera nuove offerte</button></div>`}
function offersNow(){if(S.month!=1&&S.month<5){alert("I club iniziano a contattarti a gennaio o verso fine stagione.");return}let all=[];for(const [l,cs] of Object.entries(leagues))for(const c of cs)if(c!=S.club&&(power[c]||76)<=S.rep+7)all.push([l,c]);if(!all.length)return alert("Nessun club interessato.");let [l,c]=all[Math.floor(Math.random()*all.length)];S.offers.push({league:l,club:c,req:(power[c]||76)-5});S.tab="offers";render()}
function accept(i){if(S.month!=1&&S.month<5)return alert("Puoi cambiare club solo a gennaio o a fine stagione.");let o=S.offers[i];start(o.league,o.club);S.news.unshift(`Hai accettato l'offerta del ${o.club}. Nuova avventura!`);render()}
function career(){return `<div class="screen"><h2>🧳 Storico carriera</h2>${S.history.map(x=>`<div class="row"><span><b>${x.club}</b><br><span class="muted">${x.league}</span></span><b>${x.date}</b></div>`).join("")}</div>`}
function match(){let opp=leagues[S.league][(S.match+3)%leagues[S.league].length],home=S.match%2==0,A=(power[S.club]||76),B=power[opp]||76;let x=Math.floor(Math.random()*3)+(Math.random()<A/B*.45?1:0),y=Math.floor(Math.random()*3)+(Math.random()<B/A*.4?1:0);if(home){x=Math.min(5,x);y=Math.min(5,y)}else{[x,y]=[Math.min(5,y),Math.min(5,x)]}let us=x,them=y;S.results[S.match]=`${S.club} ${us}-${them} ${opp}`;let t=S.table[S.club],o=S.table[opp];t.p++;o.p++;t.gf+=us;t.ga+=them;o.gf+=them;o.ga+=us;if(us>them){t.w++;t.pts+=3;o.l++;S.rep++}else if(us==them){t.d++;t.pts++;o.d++;o.pts++}else{t.l++;o.w++;o.pts+=3;S.rep=Math.max(1,S.rep-1)}S.players.slice(0,11).forEach(p=>{p.apps++;p.form=Math.max(5,Math.min(9.5,p.form+(us>them?.2:us<them?-.15:.03)));if(p.form>8&&p.ovr<p.pot&&Math.random()<.25)p.ovr++});S.news.unshift(`G${S.match+1}: ${S.club} ${us}-${them} ${opp}`);S.match++;if(S.match==19)S.month=1;if(S.match>=38){S.month=7;S.season++;S.match=0;S.players.forEach(p=>{p.age++;if(p.form>7.7&&p.ovr<p.pot)p.ovr++;p.form=7});S.youth.forEach(p=>{p.age++;if(p.status=="prestito"){p.status="vivaio";p.ovr=Math.min(p.pot,p.ovr+2)}});initTable();if(S.rep>=65)offersNow()}else if(S.match==19&&S.rep>=65)offersNow();render()}
function simulate(){for(let i=0;i<5;i++)match()}
function closeModal(){document.getElementById("modal").style.display="none"}function modal(x){document.getElementById("modalBody").innerHTML=x;document.getElementById("modal").style.display="flex"}
const pages={home,squad,tactics,youth:youthPage,market,calendar,table,offers,career};render()
</script></body></html>
