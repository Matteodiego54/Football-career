<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandiera Tattica — Carriera Allenatore</title>
<style>
:root{
  --verde:#0b3d2e;
  --verde2:#124a37;
  --erba:#0e5c3f;
  --oro:#c9a24b;
  --panna:#f3ede1;
  --rosso:#a13d3d;
  --inchiostro:#16211c;
  --linea:#2c5c46;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 40px, rgba(0,0,0,0.03) 40px 80px),
    linear-gradient(180deg,var(--verde) 0%, var(--verde2) 100%);
  color:var(--panna);
  font-family: 'Georgia', 'Iowan Old Style', serif;
  min-height:100vh;
}
#app{max-width:1200px;margin:0 auto;padding:18px 14px 60px;}
header.hero{
  border-bottom:2px solid var(--oro);
  padding-bottom:14px;margin-bottom:16px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;
}
header.hero h1{font-size:1.6rem;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
header.hero .eyebrow{font-family:'Georgia',serif;font-style:italic;color:var(--oro);font-size:0.85rem;letter-spacing:1px;display:block;margin-bottom:2px;}
.badge{
  width:34px;height:34px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:0.75rem;font-family:sans-serif;color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,0.15) inset;flex-shrink:0;
}
.hud{
  display:flex;gap:14px;flex-wrap:wrap;font-family:sans-serif;font-size:0.8rem;color:var(--panna);
  background:rgba(0,0,0,0.18);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;align-items:center;
}
.hud b{color:var(--oro);}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;font-family:sans-serif;}
nav.tabs button{
  background:rgba(0,0,0,0.2);border:1px solid var(--linea);color:var(--panna);
  padding:8px 14px;border-radius:20px;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all .15s;
}
nav.tabs button:hover{background:rgba(201,162,75,0.15);}
nav.tabs button.active{background:var(--oro);color:var(--inchiostro);border-color:var(--oro);}
.panel{background:rgba(0,0,0,0.22);border:1px solid var(--linea);border-radius:10px;padding:16px;margin-bottom:16px;}
.panel h2{margin-top:0;font-size:1.15rem;color:var(--oro);border-bottom:1px solid var(--linea);padding-bottom:8px;}
table{width:100%;border-collapse:collapse;font-family:sans-serif;font-size:0.82rem;}
th{text-align:left;color:var(--oro);border-bottom:1px solid var(--linea);padding:6px 8px;font-weight:600;position:sticky;top:0;background:var(--verde2);}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.06);}
tr:hover td{background:rgba(201,162,75,0.06);}
.tablewrap{overflow-x:auto;max-height:520px;overflow-y:auto;}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.68rem;font-weight:700;font-family:sans-serif;}
.pill.gk{background:#5c4a1e;color:#f0d68a;}
.pill.def{background:#1e3f5c;color:#a9d4f5;}
.pill.mid{background:#2c5c46;color:#c9e8d5;}
.pill.att{background:#5c1e1e;color:#f5b1a9;}
.ovr{font-weight:800;font-family:sans-serif;}
.ovr.high{color:#7ee68a;}
.ovr.mid{color:#e6d47e;}
.ovr.low{color:#e68a7e;}
button.action{background:var(--oro);color:var(--inchiostro);border:none;border-radius:6px;padding:5px 10px;font-family:sans-serif;font-weight:700;font-size:0.72rem;cursor:pointer;}
button.action.secondary{background:transparent;border:1px solid var(--oro);color:var(--oro);}
button.action.danger{background:var(--rosso);color:#fff;}
button.action:disabled{opacity:0.4;cursor:not-allowed;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:800px){.grid2{grid-template-columns:1fr;}}
.player-row{cursor:pointer;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--verde2);border:1px solid var(--oro);border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:20px;position:relative;}
.modal h3{margin-top:0;color:var(--oro);font-size:1.2rem;}
.close-x{position:absolute;top:14px;right:16px;cursor:pointer;font-size:1.3rem;color:var(--panna);background:none;border:none;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:sans-serif;font-size:0.78rem;margin:12px 0;}
.statbox{background:rgba(0,0,0,0.25);border-radius:8px;padding:8px;text-align:center;}
.statbox b{display:block;font-size:1.1rem;color:var(--oro);}
.barwrap{background:rgba(255,255,255,0.08);border-radius:4px;height:8px;margin:2px 0 8px;overflow:hidden;}
.bar{height:100%;background:linear-gradient(90deg,#7ee68a,#c9a24b);}
.transfer-hist{font-size:0.75rem;font-family:sans-serif;color:#d9d0bd;margin-top:8px;}
.transfer-hist div{padding:3px 0;border-bottom:1px dashed rgba(255,255,255,0.1);}
.small{font-size:0.72rem;color:#c9c2ac;font-family:sans-serif;}
.warn{color:#e68a7e;font-family:sans-serif;font-size:0.75rem;}
select,input[type=number],input[type=text]{background:rgba(0,0,0,0.3);border:1px solid var(--linea);color:var(--panna);border-radius:6px;padding:6px 8px;font-family:sans-serif;font-size:0.8rem;}
.matchcard{display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.2);border:1px solid var(--linea);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-family:sans-serif;font-size:0.85rem;}
.matchcard .score{font-weight:800;color:var(--oro);font-size:1rem;}
.news{font-family:sans-serif;font-size:0.8rem;background:rgba(0,0,0,0.18);border-left:3px solid var(--oro);padding:8px 12px;margin-bottom:6px;}
.formation-pitch{background:radial-gradient(ellipse at center, #1a6b47 0%, #0e5c3f 70%);border:2px solid rgba(255,255,255,0.3);border-radius:8px;aspect-ratio:3/4;position:relative;max-width:420px;margin:0 auto;}
.slot{position:absolute;transform:translate(-50%,-50%);width:60px;text-align:center;font-family:sans-serif;cursor:pointer;}
.slot .dot{width:30px;height:30px;border-radius:50%;background:var(--oro);color:var(--inchiostro);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.75rem;margin:0 auto 2px;border:2px solid #fff;}
.slot .nm{font-size:0.6rem;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;}
footer.credits{text-align:center;font-family:sans-serif;font-size:0.7rem;color:#8fae9c;margin-top:24px;}
.tag-real{color:#7ee68a;font-size:0.65rem;font-family:sans-serif;}
.tag-gen{color:#e6c47e;font-size:0.65rem;font-family:sans-serif;}
</style>
</head>

function genPlayer(teamId, league, group, ageRange, ovrRange, potBoost, youth=false, cat=null){

    foot: Math.random()<0.75?"D":"S", value: Math.max(0.1, +((ovr*ovr)/450).toFixed(1)),
    wage: Math.max(1, Math.round(ovr*0.6)), contractYear: 2026+rnd(1,4),
    teamId, league, youth, youthCat:cat, real:false});

function fixYouthGroups(list){
  const order=["gk","gk","def","def","def","mid","mid","mid","att","att"];
  list.forEach((p,i)=>{ p.role = randRole(order[i%order.length]); });
}

let STATE = {myTeamId:null, season:2026, week:1, table:{}, fixtures:{}, results:{}, news:[], formation:{}};
let FREE_AGENTS=[];

function leagueTeams(l){return TEAMS.filter(t=>t.league===l);}
function roundRobinFixtures(teamIds){
  let ids = teamIds.slice();
  if(ids.length%2!==0) ids.push(null);
  const n=ids.length, rounds=n-1, half=n/2;
  let weeks=[]; let arr=ids.slice();
  for(let r=0;r<rounds;r++){
    let pairs=[];
    for(let i=0;i<half;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a!==null && b!==null) pairs.push(r%2===0?[a,b]:[b,a]);
    }
    weeks.push(pairs);
    arr.splice(1,0,arr.pop());
  }
  const second = weeks.map(w=>w.map(([h,a])=>[a,h]));
  return weeks.concat(second);
}
function initSeason(){
  ["A","B"].forEach(l=>{
    const ids = leagueTeams(l).map(t=>t.id);
    STATE.fixtures[l] = roundRobinFixtures(ids);
    STATE.results[l] = [];
    STATE.table[l] = {};
    ids.forEach(id=> STATE.table[l][id] = {pts:0,gf:0,ga:0,w:0,d:0,l:0,pg:0});
  });
  STATE.week=1; STATE.news=[];
  addNews("Benvenuto in panchina! La stagione "+STATE.season+" sta per iniziare.");
}
function addNews(txt){STATE.news.unshift({week:STATE.week,txt});if(STATE.news.length>60)STATE.news.pop();}

function teamStrength(team){
  const xi = bestXI(team);
  if(xi.length===0) return 50;
  return xi.reduce((s,p)=>s+p.ovr,0)/xi.length;
}
function bestXI(team){
  const lineup = STATE.formation[team.id];
  if(lineup && lineup.lineup && lineup.lineup.length===11){
    const arr = lineup.lineup.map(pid=>team.players.find(p=>p.id===pid)).filter(Boolean);
    if(arr.length===11) return arr;
  }
  const avail = team.players.filter(p=>!p.injured && !p.loanedTo);
  const gk = avail.filter(p=>ROLE_GROUP[p.role]==="gk").sort((a,b)=>b.ovr-a.ovr).slice(0,1);
  const def = avail.filter(p=>ROLE_GROUP[p.role]==="def").sort((a,b)=>b.ovr-a.ovr).slice(0,4);
  const mid = avail.filter(p=>ROLE_GROUP[p.role]==="mid").sort((a,b)=>b.ovr-a.ovr).slice(0,4);
  const att = avail.filter(p=>ROLE_GROUP[p.role]==="att").sort((a,b)=>b.ovr-a.ovr).slice(0,2);
  return [...gk,...def,...mid,...att];
}
function poisson(lambda){let L=Math.exp(-lambda),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simulateMatch(homeId, awayId){
  const home = TEAMS.find(t=>t.id===homeId), away = TEAMS.find(t=>t.id===awayId);
  const hs = teamStrength(home)+3.5, as = teamStrength(away);
  const diff = (hs-as)/8;
  const hGoalsExp = clamp(1.3 + diff*0.55, 0.2, 4.5);
  const aGoalsExp = clamp(1.1 - diff*0.5, 0.15, 4.2);
  const hg = poisson(hGoalsExp), ag = poisson(aGoalsExp);
  applyMatchToPlayers(home, hg, ag); applyMatchToPlayers(away, ag, hg);
  return {home:homeId, away:awayId, hg, ag};
}
function bumpForm(p,n){p.formPts+=n; p.morale=clamp(p.morale+(n>0?1:-1),10,99);}
function weightedPick(pool,weights){
  const total=weights.reduce((a,b)=>a+b,0);
  if(total<=0) return pool[rnd(0,pool.length-1)];
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i]; if(r<=0) return pool[i];}
  return pool[pool.length-1];
}
function applyMatchToPlayers(team, gf, ga){
  const xi = bestXI(team);
  xi.forEach(p=>{p.stats.pres++; p.stats.min+=rnd(60,90); if(Math.random()<0.06) p.stats.amm++; if(Math.random()<0.004) p.stats.esp++;});
  const scorersPool = xi;
  for(let i=0;i<gf;i++){
    const w = scorersPool.map(p=>(ROLE_GROUP[p.role]==="att"?4:ROLE_GROUP[p.role]==="mid"?2:0.4)*(p.ovr/70));
    const scorer = weightedPick(scorersPool,w);
    if(scorer){scorer.stats.gol++; bumpForm(scorer,3);}
    if(Math.random()<0.6){
      const assistPool = xi.filter(p=>p!==scorer);
      const assister = assistPool[rnd(0,assistPool.length-1)];
      if(assister) assister.stats.assist++;
    }
  }
  const gk = xi.find(p=>ROLE_GROUP[p.role]==="gk");
  if(gk && ga===0){gk.stats.cleanSheet++; bumpForm(gk,2);}
  xi.forEach(p=>{if(gf>ga) bumpForm(p,1); else if(gf<ga) bumpForm(p,-1);});
}
function myLeague(){const t=TEAMS.find(x=>x.id===STATE.myTeamId); return t?t.league:"A";}
function updateTable(l,r){
  const T=STATE.table[l];
  T[r.home].pg++; T[r.away].pg++; T[r.home].gf+=r.hg; T[r.home].ga+=r.ag; T[r.away].gf+=r.ag; T[r.away].ga+=r.hg;
  if(r.hg>r.ag){T[r.home].w++;T[r.home].pts+=3;T[r.away].l++;}
  else if(r.hg<r.ag){T[r.away].w++;T[r.away].pts+=3;T[r.home].l++;}
  else {T[r.home].d++;T[r.away].d++;T[r.home].pts++;T[r.away].pts++;}
}
function playWeek(){
  ["A","B"].forEach(l=>{
    const weekFixtures = STATE.fixtures[l][STATE.week-1];
    if(!weekFixtures) return;
    let weekResults=[];
    weekFixtures.forEach(([h,a])=>{const r=simulateMatch(h,a); weekResults.push(r); updateTable(l,r);});
    STATE.results[l].push(weekResults);
    if(l===myLeague()){
      const my = weekFixtures.find(([h,a])=>h===STATE.myTeamId||a===STATE.myTeamId);
      if(my){
        const r = weekResults.find(x=>x.home===my[0]&&x.away===my[1]);
        const homeName=TEAMS.find(t=>t.id===r.home).name, awayName=TEAMS.find(t=>t.id===r.away).name;
        addNews(`Risultato: ${homeName} ${r.hg}-${r.ag} ${awayName}`);
      }
    }
  });
  agingAndGrowth(); runTransferAI(); contractDecay();
  STATE.week++;
}
function agingAndGrowth(){
  TEAMS.forEach(team=>{
    [team.players, team.primavera, team.u18, team.u17].forEach(list=>{
      list.forEach(p=>{
        let delta=0;
        if(p.youth || p.age<23){
          if(p.stats.min>200 && p.morale>60) delta+=0.15;
          if(p.formPts>4) delta+=0.1;
          if(p.morale<35 || p.stats.min<20) delta-=0.1;
          if(p.age>26) delta-=0.05;
        } else if(p.age>=31){ delta-=0.06; }
        p.ovr = clamp(+(p.ovr+delta).toFixed(2), 35, p.pot+2);
        if(Math.random()<0.02) p.formPts = Math.round(p.formPts*0.5);
      });
    });
  });
}
function contractDecay(){
  const currentYear = STATE.season;
  TEAMS.forEach(team=>{
    team.players.slice().forEach(p=>{
      if(p.contractYear <= currentYear && Math.random()<0.05){
        if(Math.random() < clamp((p.ovr-60)/60,0.1,0.85) && p.age<32){
          p.contractYear += rnd(1,3);
          if(team.id===STATE.myTeamId) addNews(`${p.name} ha rinnovato con la tua squadra fino al ${p.contractYear}.`);
        } else if(Math.random()<0.3){
          releasePlayer(team,p);
          addNews(`${p.name} si è svincolato da ${team.name}.`);
        }
      }
    });
  });
}
function releasePlayer(team,p){
  team.players = team.players.filter(x=>x.id!==p.id);
  p.teamId=null; p.value=Math.round(p.value*0.3);
  FREE_AGENTS.push(p);
}
function endOfSeasonYouthPromotion(){
  TEAMS.forEach(team=>{
    team.u17.forEach(p=>p.age++); team.u18.forEach(p=>p.age++); team.primavera.forEach(p=>p.age++);
    const movingToU18 = team.u17.filter(p=>p.age>=17);
    team.u17 = team.u17.filter(p=>p.age<17);
    movingToU18.forEach(p=>{p.youthCat="U18"; team.u18.push(p);});
    const movingToPrimavera = team.u18.filter(p=>p.age>=18);
    team.u18 = team.u18.filter(p=>p.age<18);
    movingToPrimavera.forEach(p=>{p.youthCat="Primavera"; team.primavera.push(p);});
    const promotable = team.primavera.filter(p=>p.age>=19 || (p.ovr>=68 && p.age>=17));
    promotable.forEach(p=>{
      if(team.players.length<28 && Math.random()<0.4){
        p.youth=false; p.youthCat=null; team.players.push(p);
        team.primavera = team.primavera.filter(x=>x.id!==p.id);
        if(team.id===STATE.myTeamId) addNews(`${p.name} (${p.age} anni) è stato promosso in prima squadra!`);
      }
    });
    for(let i=0;i<3;i++) team.u17.push(genPlayer(team.id, team.league, "mid", [15,15], team.league==="A"?[40,54]:[36,48], 30, true, "U17"));
  });
}
function marketValueDisplay(v){return "€"+v.toFixed(1)+"M";}
function playerInterest(player, buyer, seller){
  let score=50;
  score += (buyer.league==="A"?10:-5) - (seller.league==="A"?10:-5);
  score += rnd(-15,15);
  score += clamp((70-player.age)/2,0,10);
  return clamp(Math.round(score),5,95);
}
function makeOffer(player, fromTeamId, amountM){
  const seller = TEAMS.find(t=>t.players.includes(player));
  if(!seller) return {ok:false,msg:"Giocatore non trovato in nessuna rosa."};
  const buyer = TEAMS.find(t=>t.id===fromTeamId);
  const interest = playerInterest(player, buyer, seller);
  const clauseActive = player.clause && amountM >= player.clause;
  const askingOk = clauseActive || amountM >= player.value*0.85;
  if(!askingOk){
    return {ok:false, msg:`${seller.name} rifiuta: offerta troppo bassa (valutano ${player.name} ${marketValueDisplay(player.value)}${player.clause?`, clausola ${marketValueDisplay(player.clause)}`:""}).`};
  }
  if(interest < 35 && !clauseActive){
    return {ok:false, msg:`${player.name} non è convinto dal progetto tecnico e frena il trasferimento (gradimento ${interest}/100).`};
  }
  if(buyer.budget < amountM){
    return {ok:false, msg:`Budget insufficiente: hai ${marketValueDisplay(buyer.budget)} disponibili.`};
  }
  buyer.budget = +(buyer.budget-amountM).toFixed(1);
  seller.budget = +(seller.budget+amountM).toFixed(1);
  seller.players = seller.players.filter(x=>x.id!==player.id);
  buyer.players.push(player);
  player.transferHistory.push({season:STATE.season, from:seller.name, to:buyer.name, fee:amountM});
  player.teamId = buyer.id; player.league = buyer.league; player.clause = null;
  player.value = +(amountM*1.05).toFixed(1);
  return {ok:true, msg:`Trasferimento completato: ${player.name} è un nuovo giocatore del ${buyer.name} per ${marketValueDisplay(amountM)}.`};
}
function proposeLoan(player, toTeamId){
  const from = TEAMS.find(t=>t.players.includes(player));
  const to = TEAMS.find(t=>t.id===toTeamId);
  if(!from||!to) return {ok:false,msg:"Errore squadra."};
  if(player.age>27) return {ok:false,msg:"In questo motore semplificato si mandano in prestito solo under 27."};
  player.loanedTo = to.id; player.loanedFrom = from.id;
  from.players = from.players.filter(x=>x.id!==player.id);
  to.players.push(player);
  addNews(`${player.name} va in prestito al ${to.name}.`);
  return {ok:true, msg:`${player.name} è stato mandato in prestito al ${to.name} per crescere.`};
}
function recallLoan(player){
  if(!player.loanedFrom) return;
  const from = TEAMS.find(t=>t.id===player.loanedFrom);
  const cur = TEAMS.find(t=>t.players.includes(player));
  cur.players = cur.players.filter(x=>x.id!==player.id);
  from.players.push(player);
  player.loanedTo=null; player.loanedFrom=null;
}
function runTransferAI(){
  if(Math.random()<0.3){
    const others = TEAMS.filter(t=>t.id!==STATE.myTeamId);
    const seller = others[rnd(0,others.length-1)];
    if(seller.players.length>16){
      const p = seller.players[rnd(0,seller.players.length-1)];
      const buyer = others[rnd(0,others.length-1)];
      if(buyer.id!==seller.id && buyer.budget>p.value*0.9 && p.ovr<83){
        buyer.budget=+(buyer.budget-p.value).toFixed(1);
        seller.budget=+(seller.budget+p.value).toFixed(1);
        seller.players=seller.players.filter(x=>x.id!==p.id);
        buyer.players.push(p);
        p.transferHistory.push({season:STATE.season, from:seller.name, to:buyer.name, fee:p.value});
        p.teamId=buyer.id; p.league=buyer.league;
        addNews(`Mercato: ${p.name} passa dal ${seller.name} al ${buyer.name} per ${marketValueDisplay(p.value)}.`);
      }
    }
  }
}

    const res=makeOffer(p, myTeam.id, amt);
    addNews(res.msg); alert(res.msg); render();
  };
  const btnSignFree=q("#btnSignFree");
  if(btnSignFree) btnSignFree.onclick=()=>{
    const p=findPlayerById(SELECTED_PLAYER);
    FREE_AGENTS=FREE_AGENTS.filter(x=>x.id!==p.id);
    p.teamId=myTeam.id; p.league=myTeam.league; p.wage=Math.max(3,Math.round(p.ovr*0.5)); p.contractYear=STATE.season+2;
    myTeam.players.push(p); addNews(`${p.name} firma da svincolato per il ${myTeam.name}.`); render();
  };
  const btnLoan=q("#btnLoan");
  if(btnLoan) btnLoan.onclick=()=>{
    const p=findPlayerById(SELECTED_PLAYER); const target=+q("#loanTarget").value;
    const res=proposeLoan(p, target); alert(res.msg); render();
  };
  const btnRecall=q("#btnRecall"); if(btnRecall) btnRecall.onclick=()=>{recallLoan(findPlayerById(SELECTED_PLAYER)); render();};
  const btnRelease=q("#btnRelease");
  if(btnRelease) btnRelease.onclick=()=>{
    const p=findPlayerById(SELECTED_PLAYER);
    const t=TEAMS.find(x=>[x.players,x.primavera,x.u18,x.u17].some(l=>l.includes(p)));
    ["players","primavera","u18","u17"].forEach(k=>t[k]=t[k].filter(x=>x.id!==p.id));
    if(!p.youth) FREE_AGENTS.push(p);
    SELECTED_PLAYER=null; render();
  };
  const btnPromote=q("#btnPromote");
  if(btnPromote) btnPromote.onclick=()=>{
    const p=findPlayerById(SELECTED_PLAYER);
    myTeam.primavera=myTeam.primavera.filter(x=>x.id!==p.id);
    p.youth=false; p.youthCat=null; myTeam.players.push(p);
    addNews(`${p.name} promosso in prima squadra.`); render();
  };
  const search=q("#searchPlayer");
  if(search) search.oninput=()=>{
    const term=search.value.toLowerCase();
    const all=TEAMS.flatMap(t=>t.players).filter(p=>p.teamId!==myTeam.id && p.name.toLowerCase().includes(term)).slice(0,80);
    q("#marketResults").innerHTML=all.map(p=>playerRowHTML(p,true)).join("");
    qa("#marketResults tr.player-row").forEach(tr=>tr.onclick=()=>{SELECTED_PLAYER=+tr.dataset.pid; render();});
  };
  const btnSaveLineup=q("#btnSaveLineup");
  if(btnSaveLineup) btnSaveLineup.onclick=()=>{
    const ids=Array.from(qa(".lineup-cb:checked")).map(cb=>+cb.dataset.pid);
    if(ids.length!==11){alert("Seleziona esattamente 11 giocatori."); return;}
    STATE.formation[myTeam.id]={lineup:ids}; render();
  };
  qa(".lineup-cb").forEach(cb=>cb.onchange=()=>{
    const n=qa(".lineup-cb:checked").length; const el=q("#lineupCount"); if(el) el.textContent=`${n}/11 selezionati`;
  });
}
render();
</script>
</body>
</html>
